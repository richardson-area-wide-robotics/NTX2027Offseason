name: Build

# Every project in the repo has to compile and pass its tests before a pull
# request can be merged into main. The "CI" job at the bottom is the single
# check that branch protection requires -- see .github/README-ci.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run still going for the old push.
  # Runs on main are never canceled.
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Add a project here when a new robot folder joins the repo. "slug" is
        # the same name in a form that is safe to use in an artifact name.
        include:
          - project: Black team
            slug: black-team
          - project: Peashooter
            slug: peashooter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache the Gradle distribution
        # setup-java's gradle cache covers ~/.gradle/caches and ~/.gradle/wrapper.
        # WPILib's wrapper puts the distribution in ~/.gradle/permwrapper/dists
        # instead (distributionPath in gradle-wrapper.properties), so without
        # this the wrapper re-downloads ~100 MB of Gradle on every single job.
        # That is slow, and it is the flaky part: a timeout there fails the
        # build before a line of robot code is compiled.
        uses: actions/cache@v6
        with:
          path: ~/.gradle/permwrapper
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-dist-${{ runner.os }}-

      - name: Make gradlew executable
        # Windows checkouts drop the executable bit, so a student committing
        # from VS Code on Windows can silently break this for everyone.
        run: chmod +x ./gradlew
        working-directory: ${{ matrix.project }}

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
        working-directory: ${{ matrix.project }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.slug }}
          path: ${{ matrix.project }}/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 14

  tools:
    # The laptop swerve tools' own tests (tools/swervetune). Suggested, not required: this job is
    # deliberately left out of the "CI" check below, which is what branch protection requires.
    name: Swerve tools (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install WPILib's Python log library
        # For the WPILOG export tests; everything else needs only the standard library.
        run: python -m pip install "robotpy-wpiutil>=2026,<2027"

      - name: Test
        run: python -m unittest discover -s swervetune/tests -v
        working-directory: tools

  pathplanner:
    # Does each robot's PathPlanner settings.json, paths and autos describe the same robot as its
    # code? Fails on a mismatch (gearing, wheel size, module positions, speed, current, mass, MOI),
    # a named command the code never registers, or a missing path or auto. Suggested, not required,
    # like the tools job: out of the "CI" check that branch protection requires.
    name: PathPlanner matches the code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check
        run: python tools/swervetune ppcheck

  ci:
    # One stable check name for branch protection to require. The matrix job
    # names change whenever a project is added or renamed; this one does not.
    name: CI
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Report result
        run: |
          echo "build: ${{ needs.build.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::At least one project failed to build. Open the Build jobs above to see which."
            exit 1
          fi
          echo "All projects built and tested successfully."
