<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 328" width="520" height="328" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="oscillation-title oscillation-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="oscillation-title">Oscillation: swinging past the target</title>
<desc id="oscillation-desc">Animated graph. The dashed setpoint jumps to the target and the solid measured line is drawn after it. It swings above the target, then below it, then above again, back and forth across the whole graph; each swing over the target fills in blue and each swing under fills in orange as the line passes. Each correction is so strong, or so late, that it overshoots the other way. Fix: lower kP, add kD, or reduce delay.</desc>
