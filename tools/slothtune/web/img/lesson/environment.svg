<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="env-title env-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="env-title">Where the robot is changes the safety rules</title>
<desc id="env-desc">Animated. Three rows, one for each place the robot can be. On blocks: the robot's frame sits on a block with its wheels off the floor; the wheels spin and the robot stays put. Rule: if the gyro or cameras see motion, or a wheel works like it carries weight, it is not on blocks and the test stops. On the floor: the robot drives forward and back inside a dashed space budget. Rule: the space budget is enforced and an impact stops everything. Simulator: a small robot drives on a laptop screen; it all happens on the computer. Below: on blocks and on the floor a deadman must be held, because 'on blocks' is only what someone told the tool.</desc>
<style>
.env-spin { transform-box: view-box; transform-origin: 0 0; animation: env-spin 8s linear infinite; }
@keyframes env-spin { from { transform: rotate(0deg); } to { transform: rotate(2880deg); } }
.env-drive { animation: env-drive 8s ease-in-out infinite; }
@keyframes env-drive { 0%, 8% { transform: translateX(0px); } 46%, 54% { transform: translateX(56px); } 92%, 100% { transform: translateX(0px); } }
.env-roll { transform-box: view-box; transform-origin: 0 0; animation: env-roll 8s ease-in-out infinite; }
@keyframes env-roll { 0%, 8% { transform: rotate(0deg); } 46%, 54% { transform: rotate(246.8deg); } 92%, 100% { transform: rotate(0deg); } }
.env-sdrive { animation: env-sdrive 8s ease-in-out infinite; }
@keyframes env-sdrive { 0%, 8% { transform: translateX(0px); } 46%, 54% { transform: translateX(44px); } 92%, 100% { transform: translateX(0px); } }
.env-sroll { transform-box: view-box; transform-origin: 0 0; animation: env-sroll 8s ease-in-out infinite; }
@keyframes env-sroll { 0%, 8% { transform: rotate(0deg); } 46%, 54% { transform: rotate(420.2deg); } 92%, 100% { transform: rotate(0deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Where the robot is changes the safety rules</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">On blocks, on the floor, or in the simulator: the tool's rules change with it.</text>
