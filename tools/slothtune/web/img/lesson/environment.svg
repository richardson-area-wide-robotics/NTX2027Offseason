<text x="116" y="195" font-size="12" fill="#5c5c5c" text-anchor="middle">space budget</text>
<g class="env-drive"><rect x="34" y="222" width="110" height="16" rx="3" fill="#b0b8c0" stroke="#444444" stroke-width="1.5"/><g transform="translate(50 241)"><g class="env-roll"><circle r="13" fill="#3a3f45"/><circle r="10.14" fill="#b0b8c0" stroke="#444444" stroke-width="1.2"/><path d="M3.15 1.82L7.66 4.42M0 3.64L0 8.84M-3.15 1.82L-7.66 4.42M-3.15 -1.82L-7.66 -4.42M0 -3.64L0 -8.84M3.15 -1.82L7.66 -4.42" stroke="#444444" stroke-width="2" stroke-linecap="round"/><circle r="3.12" fill="#7d8790" stroke="#444444" stroke-width="1.2"/><circle cx="11.57" r="2.2" fill="#ffffff"/></g></g><g transform="translate(128 241)"><g class="env-roll"><circle r="13" fill="#3a3f45"/><circle r="10.14" fill="#b0b8c0" stroke="#444444" stroke-width="1.2"/><path d="M3.15 1.82L7.66 4.42M0 3.64L0 8.84M-3.15 1.82L-7.66 4.42M-3.15 -1.82L-7.66 -4.42M0 -3.64L0 -8.84M3.15 -1.82L7.66 -4.42" stroke="#444444" stroke-width="2" stroke-linecap="round"/><circle r="3.12" fill="#7d8790" stroke="#444444" stroke-width="1.2"/><circle cx="11.57" r="2.2" fill="#ffffff"/></g></g></g>
<text x="232" y="190" font-size="14" font-weight="700" fill="#222222">On the floor</text>
<text x="232" y="210" font-size="13" fill="#222222">It really drives.</text>
<text x="232" y="230" font-size="12" fill="#b45309">A space budget is enforced, and an</text>
<text x="232" y="246" font-size="12" font-weight="700" fill="#b45309">impact stops everything.</text>
