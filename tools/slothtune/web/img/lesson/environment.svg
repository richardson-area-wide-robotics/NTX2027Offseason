<g><path d="M139.21 109.16A20 20 0 0 1 160.77 96.19" fill="none" stroke="#444444" stroke-width="1.8"/><path d="M164.84 97.21L156.89 98.57L159.63 91.05Z" fill="#444444"/></g>
<text x="232" y="82" font-size="14" font-weight="700" fill="#222222">On blocks</text>
<text x="232" y="102" font-size="13" fill="#222222">The wheels spin and the robot stays put.</text>
<text x="232" y="122" font-size="12" fill="#b45309">If the gyro or cameras see motion,</text>
<text x="232" y="138" font-size="12" fill="#b45309">or a wheel works like it carries weight,</text>
<text x="232" y="154" font-size="12" font-weight="700" fill="#b45309">it is not on blocks: the test stops.</text>
<line x1="24" y1="254" x2="208" y2="254" stroke="#444444" stroke-width="1.5"/><path d="M34 254l-6 7M46 254l-6 7M58 254l-6 7M70 254l-6 7M82 254l-6 7M94 254l-6 7M106 254l-6 7M118 254l-6 7M130 254l-6 7M142 254l-6 7M154 254l-6 7M166 254l-6 7M178 254l-6 7M190 254l-6 7M202 254l-6 7" stroke="#b0b8c0" stroke-width="1.2"/>
