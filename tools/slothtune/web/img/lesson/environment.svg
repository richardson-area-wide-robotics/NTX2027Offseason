<text x="232" y="298" font-size="14" font-weight="700" fill="#222222">Simulator</text>
<text x="232" y="318" font-size="13" fill="#222222">It all happens on the computer.</text>
<line x1="16" y1="388" x2="504" y2="388" stroke="#e2e2e2"/>
<text x="16" y="408" font-size="13" fill="#222222"><tspan font-weight="700">On blocks and on the floor, a deadman must be held:</tspan></text>
<text x="16" y="426" font-size="13" fill="#222222">“on blocks” is only what someone told the tool.</text>
