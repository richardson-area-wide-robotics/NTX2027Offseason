<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 348" width="520" height="348" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="can_heartbeat-title can_heartbeat-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="can_heartbeat-title">The robot's heartbeat</title>
<desc id="can_heartbeat-desc">Animated, slowed down. The robot controller (roboRIO or SystemCore) sends a heartbeat that says enabled down the CAN cable every 20 ms, drawn as a dot running past three SPARK motor controllers, each driving a spinning wheel. A bar under each SPARK shows the time since it last heard one; each heartbeat resets it. Then the cable breaks between the first and second SPARK: heartbeats stop reaching the two past the break, their bars fill to 100 ms, and each stops its own motor, while the first SPARK, still hearing them, keeps running. When the cable is whole again the heartbeats return and all three run. A motor controller that misses the heartbeat for 100 ms acts as if the robot was disabled, so a broken cable stops only the controllers past the break.</desc>
<style>
.hb-bar0{transform-box:fill-box;transform-origin:0% 50%;animation:hb-bar0 8s linear infinite}
