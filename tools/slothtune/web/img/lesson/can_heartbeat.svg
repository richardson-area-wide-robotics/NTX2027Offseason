.hb-bar1{transform-box:fill-box;transform-origin:0% 50%;animation:hb-bar1 8s linear infinite}
@keyframes hb-bar1{0%{transform:scaleX(0.110)}2.698%{transform:scaleX(0.196)}2.823%{transform:scaleX(0.001)}8.948%{transform:scaleX(0.196)}9.073%{transform:scaleX(0.001)}15.198%{transform:scaleX(0.196)}15.323%{transform:scaleX(0.001)}21.448%{transform:scaleX(0.196)}21.573%{transform:scaleX(0.001)}52.823%{transform:scaleX(1.000)}83.948%{transform:scaleX(1.000)}84.073%{transform:scaleX(0.001)}90.198%{transform:scaleX(0.196)}90.323%{transform:scaleX(0.001)}96.448%{transform:scaleX(0.196)}96.573%{transform:scaleX(0.001)}100%{transform:scaleX(0.110)}}
