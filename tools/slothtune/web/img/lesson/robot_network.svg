<g class="rn-p3"><circle r="6.5" fill="#446ce3" stroke="#ffffff" stroke-width="2"/></g>
<path d="M318 126 L311 110 M386 126 L393 110" stroke="#444444" stroke-width="2.5" stroke-linecap="round"/>
<rect class="rn-ring" x="294" y="120" width="116" height="64" rx="10" fill="none" stroke="#446ce3" stroke-width="3"/>
<rect x="300" y="126" width="104" height="52" rx="7" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="352" y="147" font-size="13" fill="#222222" font-weight="700" text-anchor="middle">radio</text>
<text x="352" y="166" font-size="13" fill="#446ce3" font-weight="700" text-anchor="middle">10.17.45.1</text>
<rect x="240" y="222" width="150" height="72" rx="7" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="315" y="242" font-size="13" fill="#222222" font-weight="700" text-anchor="middle">robot controller</text>
<text x="315" y="259" font-size="12" fill="#5c5c5c" text-anchor="middle">roboRIO or SystemCore</text>
<text x="315" y="281" font-size="13" fill="#446ce3" font-weight="700" text-anchor="middle">10.17.45.2</text>
<rect x="400" y="222" width="100" height="72" rx="7" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="450" y="250" font-size="13" fill="#222222" font-weight="700" text-anchor="middle">coprocessor</text>
<text x="450" y="272" font-size="13" fill="#446ce3" font-weight="700" text-anchor="middle">10.17.45.x</text>
<rect x="16" y="112" width="176" height="62" rx="5" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<path d="M10 174 H198 L190 184 H18 Z" fill="#b0b8c0" stroke="#444444" stroke-width="1.2"/>
<text x="26" y="132" font-size="13" fill="#222222" font-weight="700">Driver Station laptop</text>
<text x="26" y="149" font-size="12" fill="#5c5c5c">Driver Station, dashboards</text>
<text x="26" y="167" font-size="13" fill="#446ce3" font-weight="700">10.17.45.x</text><text x="106" y="167" font-size="12" fill="#5c5c5c">from the radio</text>
<rect x="16" y="201" width="176" height="62" rx="5" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<path d="M10 263 H198 L190 273 H18 Z" fill="#b0b8c0" stroke="#444444" stroke-width="1.2"/>
<text x="26" y="221" font-size="13" fill="#222222" font-weight="700">this laptop</text>
<text x="26" y="238" font-size="12" fill="#5c5c5c">Sloth Tune</text>
<text x="26" y="256" font-size="13" fill="#446ce3" font-weight="700">10.17.45.x</text><text x="106" y="256" font-size="12" fill="#5c5c5c">from the radio</text>
<line x1="16" y1="318" x2="504" y2="318" stroke="#d6d6d6" stroke-width="1"/>
<text x="16" y="338" font-size="13" fill="#222222">The robot controller is at .2 and the radio at .1; the laptops get</text>
<text x="16" y="356" font-size="13" fill="#222222">their addresses from the radio.</text>
<text x="16" y="373" font-size="12" fill="#5c5c5c">A roboRIO also answers to roboRIO-1745-FRC.local.</text>
<text x="16" y="390" font-size="12" fill="#5c5c5c">Each dot is a message: control packets, NetworkTables, camera streams.</text>
</svg>
