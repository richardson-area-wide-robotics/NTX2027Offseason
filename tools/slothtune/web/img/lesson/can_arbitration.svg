<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384" width="520" height="384" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="can_arbitration-title can_arbitration-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="can_arbitration-title">Who talks first: the lower ID wins</title>
<desc id="can_arbitration-desc">Animated. The robot controller's heartbeat (roboRIO or SystemCore, device type 1) and a SPARK's status message (a motor controller, device type 2) start at the same moment. Each sends the front of its ID, the device type, one bit at a time while listening to the wire: 0 0 0 0 1 against 0 0 0 1 0. For three bits they match. On the fourth bit the SPARK sends a 1 but hears a 0 on the wire, because a 0 always beats a 1, so it stops and tries again after. The heartbeat carries on and its message arrives undamaged. A 0 is dominant: one device driving the wires apart beats any number leaving them at rest, so the lowest ID always gets through first.</desc>
<style>
.ca-c0{opacity:1;animation:ca-c0 8s linear infinite}
@keyframes ca-c0{0%{opacity:1}6%{opacity:1}9%{opacity:0}11%{opacity:0}12%{opacity:1}100%{opacity:1}}
.ca-c1{opacity:1;animation:ca-c1 8s linear infinite}
@keyframes ca-c1{0%{opacity:1}6%{opacity:1}9%{opacity:0}20%{opacity:0}21%{opacity:1}100%{opacity:1}}
.ca-c2{opacity:1;animation:ca-c2 8s linear infinite}
@keyframes ca-c2{0%{opacity:1}6%{opacity:1}9%{opacity:0}29%{opacity:0}30%{opacity:1}100%{opacity:1}}
.ca-c3{opacity:1;animation:ca-c3 8s linear infinite}
@keyframes ca-c3{0%{opacity:1}6%{opacity:1}9%{opacity:0}38%{opacity:0}39%{opacity:1}100%{opacity:1}}
.ca-c4{opacity:1;animation:ca-c4 8s linear infinite}
@keyframes ca-c4{0%{opacity:1}6%{opacity:1}9%{opacity:0}54%{opacity:0}55%{opacity:1}100%{opacity:1}}
.ca-dots{opacity:1;animation:ca-dots 8s linear infinite}
@keyframes ca-dots{0%{opacity:1}6%{opacity:1}9%{opacity:0}61%{opacity:0}62%{opacity:1}100%{opacity:1}}
.ca-clash{opacity:1;animation:ca-clash 8s linear infinite}
@keyframes ca-clash{0%{opacity:1}6%{opacity:1}9%{opacity:0}42%{opacity:0}43%{opacity:1}100%{opacity:1}}
.ca-win{opacity:1;animation:ca-win 8s linear infinite}
@keyframes ca-win{0%{opacity:1}6%{opacity:1}9%{opacity:0}65%{opacity:0}66%{opacity:1}100%{opacity:1}}
.ca-band{opacity:0;animation:ca-band 8s linear infinite}
@keyframes ca-band{0%{opacity:0;transform:translateX(0px)}9%{opacity:0;transform:translateX(0px)}11%{opacity:1;transform:translateX(0px)}20%{opacity:1;transform:translateX(0px)}21%{opacity:1;transform:translateX(42px)}29%{opacity:1;transform:translateX(42px)}30%{opacity:1;transform:translateX(84px)}38%{opacity:1;transform:translateX(84px)}39%{opacity:1;transform:translateX(126px)}54%{opacity:1;transform:translateX(126px)}55%{opacity:1;transform:translateX(168px)}60%{opacity:1;transform:translateX(168px)}62%{opacity:0;transform:translateX(168px)}100%{opacity:0;transform:translateX(168px)}}
.ca-bdim{opacity:0.45;animation:ca-bdim 8s linear infinite}
@keyframes ca-bdim{0%{opacity:0.45}6%{opacity:0.45}9%{opacity:1}47%{opacity:1}51%{opacity:0.45}100%{opacity:0.45}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Who talks first: the lower ID wins</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Both start at once. Each sends its ID one bit at a time and listens to the wire.</text>
<text x="214" y="76" font-size="12" font-weight="700" fill="#222222">front of the ID: the device type, sent first  →</text>
<rect class="ca-band" x="210" y="82" width="44" height="158" rx="6" fill="#446ce3" fill-opacity="0.10" stroke="#446ce3" stroke-width="1.5"/>
<text x="16" y="104" font-size="13" font-weight="700" fill="#222222">heartbeat, type 1</text>
<text x="16" y="120" font-size="12" fill="#5c5c5c">roboRIO or SystemCore</text>
<text x="16" y="152" font-size="13" font-weight="700" fill="#222222">SPARK status, type 2</text>
<text x="16" y="168" font-size="12" fill="#5c5c5c">a motor controller</text>
<line x1="16" y1="186" x2="470" y2="186" stroke="#e2e2e2" stroke-width="1.5"/>
<text x="16" y="214" font-size="13" font-weight="700" fill="#222222">on the wire</text>
<text x="16" y="230" font-size="12" fill="#5c5c5c">what both of them hear</text>
<rect x="214" y="88" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="214" y="136" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="214" y="198" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="256" y="88" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="256" y="136" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="256" y="198" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="298" y="88" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="298" y="136" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="298" y="198" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="340" y="88" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="340" y="136" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="340" y="198" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="382" y="88" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="382" y="136" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<rect x="382" y="198" width="36" height="36" rx="4" fill="none" stroke="#b0b8c0" stroke-width="1.2" stroke-dasharray="3 3"/>
<g class="ca-c0"><rect x="214" y="88" width="36" height="36" rx="4" fill="#444444"/><text x="232" y="112" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text><rect x="214" y="198" width="36" height="36" rx="4" fill="#444444"/><text x="232" y="222" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text><g class="ca-bdim"><rect x="214" y="136" width="36" height="36" rx="4" fill="#444444"/><text x="232" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text></g></g>
<g class="ca-c1"><rect x="256" y="88" width="36" height="36" rx="4" fill="#444444"/><text x="274" y="112" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text><rect x="256" y="198" width="36" height="36" rx="4" fill="#444444"/><text x="274" y="222" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text><g class="ca-bdim"><rect x="256" y="136" width="36" height="36" rx="4" fill="#444444"/><text x="274" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text></g></g>
<g class="ca-c2"><rect x="298" y="88" width="36" height="36" rx="4" fill="#444444"/><text x="316" y="112" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text><rect x="298" y="198" width="36" height="36" rx="4" fill="#444444"/><text x="316" y="222" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text><g class="ca-bdim"><rect x="298" y="136" width="36" height="36" rx="4" fill="#444444"/><text x="316" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text></g></g>
<g class="ca-c3"><rect x="340" y="88" width="36" height="36" rx="4" fill="#444444"/><text x="358" y="112" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text><rect x="340" y="198" width="36" height="36" rx="4" fill="#444444"/><text x="358" y="222" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">0</text><g class="ca-bdim"><rect x="340" y="136" width="36" height="36" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.6"/><text x="358" y="160" font-size="15" font-weight="700" fill="#222222" text-anchor="middle">1</text></g></g>
<g class="ca-c4"><rect x="382" y="88" width="36" height="36" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.6"/><text x="400" y="112" font-size="15" font-weight="700" fill="#222222" text-anchor="middle">1</text><rect x="382" y="198" width="36" height="36" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.6"/><text x="400" y="222" font-size="15" font-weight="700" fill="#222222" text-anchor="middle">1</text></g>
<g class="ca-dots"><text x="436" y="112" font-size="15" font-weight="700" fill="#222222">…</text><text x="436" y="222" font-size="15" font-weight="700" fill="#222222">…</text></g>
<g class="ca-clash"><rect x="336" y="132" width="44" height="44" rx="6" fill="none" stroke="#c62828" stroke-width="3"/><path d="M358.0 194 V182" stroke="#c62828" stroke-width="2" fill="none"/><path d="M353.0 186 L358.0 178 L363.0 186 Z" fill="#c62828"/><path d="M388 144 l24 20 M412 144 l-24 20" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><text x="430" y="152" font-size="12" font-weight="700" fill="#c62828">stops</text><text x="430" y="167" font-size="12" font-weight="700" fill="#c62828">here</text></g>
<text x="16" y="262" font-size="12" font-weight="700" fill="#c62828" class="ca-clash">SPARK: sent a 1 but heard a 0, so it stops and tries again after.</text>
<text x="16" y="280" font-size="12" font-weight="700" fill="#1a7f37" class="ca-win">Heartbeat: keeps going, and its message arrives undamaged.</text>
<line x1="16" y1="296" x2="504" y2="296" stroke="#e2e2e2"/>
<text x="16" y="318" font-size="13" fill="#222222">A 0 always beats a 1: one device driving the wires apart beats any</text>
<text x="16" y="336" font-size="13" fill="#222222">number leaving them at rest. So the lowest ID gets through first.</text>
<text x="16" y="358" font-size="12" fill="#5c5c5c">FRC puts the device type at the front of the ID, so the heartbeat (type 1)</text>
<text x="16" y="374" font-size="12" fill="#5c5c5c">beats every motor controller (type 2) to the wire.</text>
</svg>
