<g class="fs-ver"><text x="86" y="186" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="middle">keep</text><text x="198" y="186" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="middle">keep</text><text x="328" y="186" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">update</text><text x="422" y="186" font-size="12" font-weight="700" fill="#5c5c5c" text-anchor="middle">keep</text></g>
<rect class="fs-fr" x="58" y="72" width="168" height="108" rx="10" fill="#446ce3" fill-opacity="0.06" stroke="#446ce3" stroke-width="2.5" stroke-dasharray="8 5"/>
<rect class="fs-h1" x="12" y="210" width="492" height="20" rx="4" fill="#e8eefc"/>
<circle cx="26" cy="219.5" r="9" fill="#446ce3"/>
<text x="26" y="224" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="42" y="224" font-size="12" fill="#222222">Two tags in one camera frame fix where they sit relative to each other.</text>
<rect class="fs-h2" x="12" y="230" width="492" height="20" rx="4" fill="#e8eefc"/>
<circle cx="26" cy="239.5" r="9" fill="#446ce3"/>
<text x="26" y="244" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="42" y="244" font-size="12" fill="#222222">Many frames tie them into a group, fitted onto the official layout.</text>
<rect class="fs-h3" x="12" y="250" width="492" height="20" rx="4" fill="#e8eefc"/>
<circle cx="26" cy="259.5" r="9" fill="#446ce3"/>
<text x="26" y="264" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="42" y="264" font-size="12" fill="#222222">What is left over is how far each tag really is from its place.</text>
<rect x="16" y="282" width="14" height="14" fill="none" stroke="#446ce3" stroke-width="2" stroke-dasharray="4 2"/>
<text x="36" y="294" font-size="12" fill="#222222">official layout</text>
<rect x="150" y="282" width="14" height="14" fill="#111111" stroke="#9a9a9a" stroke-width="0.8"/>
<text x="170" y="294" font-size="12" fill="#222222">where it really hangs</text>
<line x1="318" y1="289" x2="336" y2="289" stroke="#c2410c" stroke-width="2.5"/>
<text x="342" y="294" font-size="12" fill="#222222">how far it is off</text>
<circle cx="23" cy="310" r="7" fill="none" stroke="#222222" stroke-width="1.4" stroke-dasharray="2 2"/>
<text x="36" y="314" font-size="12" fill="#222222">noise circle: 3 × the tag's own uncertainty, and at least 0.4 in</text>
<line x1="16" y1="328" x2="504" y2="328" stroke="#d6d6d6" stroke-width="1"/>
<text x="16" y="348" font-size="12" fill="#222222">A tag is changed only when it moved clearly outside its noise circle: noise must</text>
<text x="16" y="364" font-size="12" fill="#222222">never move a tag. More than about 12 in off is refused: that is a misread, or a</text>
<text x="16" y="380" font-size="12" fill="#222222">tag on the wrong bracket.</text>
<text x="16" y="400" font-size="12" fill="#5c5c5c">A whole structure moved as one piece looks right this way: its tags still agree</text>
<text x="16" y="416" font-size="12" fill="#5c5c5c">with each other.</text>
</svg>
