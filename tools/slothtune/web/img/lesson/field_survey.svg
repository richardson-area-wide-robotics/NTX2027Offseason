<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 426" width="520" height="426" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="fs-title fs-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="fs-title">Surveying the field's tags</title>
<desc id="fs-desc">Animated. A field wall with four AprilTags, each hung a little off its dashed official spot. A camera frame slides along the wall, seeing two tags at a time, and each pair it sees is tied together with a blue link: two tags in one frame fix where they sit relative to each other. The linked group is fitted onto the official layout, and what is left over shows as an orange line from each official spot to the real tag. Three tags sit inside their noise circle, three times their own uncertainty and at least 0.4 in, and are kept; the one that moved clearly outside it is updated. More than about 12 in off is refused.</desc>
