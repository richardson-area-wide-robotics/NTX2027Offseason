<text x="16" y="47" font-size="12" fill="#5c5c5c">1 Mbit/s carries about 7,000 full-size messages a second.</text>
<text x="16" y="76" font-size="13" font-weight="700" fill="#222222">How busy the bus is</text>
<text x="504" y="76" font-size="12" fill="#5c5c5c" text-anchor="end">the Driver Station calls it CAN utilization</text>
