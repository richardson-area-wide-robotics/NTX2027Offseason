<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 344" width="520" height="344" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="can_load-title can_load-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="can_load-title">CAN bus load</title>
<desc id="can_load-desc">Animated. A bar shows how busy the CAN bus is, from 0 to 100%; 1 Mbit/s carries about 7,000 full-size messages a second. Twenty SPARK tiles light up one at a time, and each adds about 2% to the bar, roughly 150 messages a second each, so twenty SPARKs fill about 40%. Then more messages push it past the line at about 80% busy, where messages start arriving late: arbitration makes the higher IDs wait, so their data arrives late and jittery. Waiting is not an error; errors come from the wires.</desc>
