<text x="16" y="296" font-size="13" fill="#222222">Near full, arbitration makes the higher IDs wait: late, jittery data.</text>
<text x="16" y="316" font-size="12" fill="#5c5c5c">Waiting is not an error. Errors come from the wires: a loose plug, a bad</text>
<text x="16" y="332" font-size="12" fill="#5c5c5c">terminator, noise. The CAN load test runs the bus busy on purpose to find them.</text>
