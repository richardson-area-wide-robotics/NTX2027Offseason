<text x="504" y="176" font-size="12" font-weight="700" fill="#c62828" text-anchor="end" class="cl-late">messages start arriving late</text>
<text x="16" y="200" font-size="12" font-weight="700" fill="#222222">Each SPARK: roughly 150 messages a second, about 2% of the bus</text>
