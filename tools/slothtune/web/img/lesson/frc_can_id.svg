<rect x="100.0" y="90" width="134.4" height="36" fill="none" stroke="#b45309" stroke-width="2"/>
<rect x="136.2" y="98" width="62" height="20" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
<text x="167.2" y="113" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">5: REV</text>
<text x="167.2" y="142" font-size="12" fill="#5c5c5c" text-anchor="middle">8 bits</text>
<rect class="fi-h1" x="97.0" y="86" width="140.4" height="44" rx="4" fill="none" stroke="#222222" stroke-width="3"/>
<rect class="fi-h1" x="10" y="192" width="500" height="38" rx="6" fill="#b45309" fill-opacity="0.10" stroke="#b45309" stroke-width="1.5"/>
<rect x="18" y="198" width="12" height="12" rx="2" fill="#b45309"/>
<text x="38" y="208" font-size="12" font-weight="700" fill="#222222">manufacturer, 8 bits:  5 = REV</text>
<text x="38" y="224" font-size="12" fill="#5c5c5c">others: 1 NI, 4 CTRE, 11 Playing With Fusion, 14 Redux</text>
<rect x="234.4" y="90" width="16.8" height="36" fill="#6b7785" fill-opacity="0.16" stroke="#6b7785" stroke-opacity="0.5" stroke-width="1"/>
