<text x="318.4" y="142" font-size="12" fill="#5c5c5c" text-anchor="middle">10 bits</text>
<rect class="fi-h2" x="231.4" y="86" width="174.0" height="44" rx="4" fill="none" stroke="#222222" stroke-width="3"/>
<rect class="fi-h2" x="10" y="232" width="500" height="38" rx="6" fill="#6b7785" fill-opacity="0.10" stroke="#6b7785" stroke-width="1.5"/>
<rect x="18" y="238" width="12" height="12" rx="2" fill="#6b7785"/>
<text x="38" y="248" font-size="12" font-weight="700" fill="#222222">which message, 10 bits:  a SPARK's status 0</text>
<text x="38" y="264" font-size="12" fill="#5c5c5c">FRC calls this the API: just the message's number</text>
<rect x="402.4" y="90" width="16.8" height="36" fill="#1a7f37" fill-opacity="0.16" stroke="#1a7f37" stroke-opacity="0.5" stroke-width="1"/>
