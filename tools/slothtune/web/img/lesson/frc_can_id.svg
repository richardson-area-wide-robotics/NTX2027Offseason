<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404" width="520" height="404" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="frc_can_id-title frc_can_id-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="frc_can_id-title">FRC's CAN ID: four parts</title>
<desc id="frc_can_id-desc">Animated. FRC's 29-bit CAN ID drawn as a strip of 29 cells split into four parts, most important first: device type, 5 bits; manufacturer, 8 bits; which message, 10 bits (FRC calls it the API); and device number, 6 bits, 0 to 63. The example is a SPARK set to number 5 sending its status 0: type 2 (motor controller), maker 5 (REV), message status 0, number 5. A highlight steps through the parts one at a time and stops on the device number, which is all the "CAN ID" you set on a SPARK is. Other types: 4 gyro, 8 power distribution, 9 pneumatics; other makers: 1 NI, 4 CTRE, 11 Playing With Fusion, 14 Redux. A REV and a CTRE motor controller can both be number 5 because their makers differ; two SPARKs at the same number collide.</desc>
<style>
.fi-h0{opacity:0;animation:fi-h0 8s linear infinite}
@keyframes fi-h0{0%{opacity:0}3%{opacity:0}4%{opacity:1}21%{opacity:1}22%{opacity:0}100%{opacity:0}}
.fi-h1{opacity:0;animation:fi-h1 8s linear infinite}
@keyframes fi-h1{0%{opacity:0}21%{opacity:0}22%{opacity:1}39%{opacity:1}40%{opacity:0}100%{opacity:0}}
.fi-h2{opacity:0;animation:fi-h2 8s linear infinite}
@keyframes fi-h2{0%{opacity:0}39%{opacity:0}40%{opacity:1}57%{opacity:1}58%{opacity:0}100%{opacity:0}}
.fi-h3{opacity:1;animation:fi-h3 8s linear infinite}
@keyframes fi-h3{0%{opacity:0}57%{opacity:0}58%{opacity:1}95%{opacity:1}96%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">FRC's CAN ID: four parts</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">29 bits, most important first. The “CAN ID” you set on a SPARK is only the last part.</text>
<text x="16" y="78" font-size="12" font-weight="700" fill="#222222">Example: a SPARK set to number 5, sending its status 0</text>
<rect x="16.0" y="90" width="16.8" height="36" fill="#446ce3" fill-opacity="0.16" stroke="#446ce3" stroke-opacity="0.5" stroke-width="1"/>
<rect x="32.8" y="90" width="16.8" height="36" fill="#446ce3" fill-opacity="0.16" stroke="#446ce3" stroke-opacity="0.5" stroke-width="1"/>
