<rect x="47.0" y="98" width="22" height="20" rx="4" fill="#ffffff" stroke="#446ce3" stroke-width="1"/>
<text x="58" y="113" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">2</text>
<text x="58" y="142" font-size="12" fill="#5c5c5c" text-anchor="middle">5 bits</text>
<rect class="fi-h0" x="13.0" y="86" width="90.0" height="44" rx="4" fill="none" stroke="#222222" stroke-width="3"/>
<rect class="fi-h0" x="10" y="152" width="500" height="38" rx="6" fill="#446ce3" fill-opacity="0.10" stroke="#446ce3" stroke-width="1.5"/>
<rect x="18" y="158" width="12" height="12" rx="2" fill="#446ce3"/>
<text x="38" y="168" font-size="12" font-weight="700" fill="#222222">device type, 5 bits:  2 = motor controller</text>
<text x="38" y="184" font-size="12" fill="#5c5c5c">others: 4 gyro, 8 power distribution, 9 pneumatics</text>
