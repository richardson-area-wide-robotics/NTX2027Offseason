<text x="452.8" y="142" font-size="12" fill="#5c5c5c" text-anchor="middle">6 bits</text>
<rect class="fi-h3" x="399.4" y="86" width="106.8" height="44" rx="4" fill="none" stroke="#222222" stroke-width="3"/>
<rect class="fi-h3" x="10" y="272" width="500" height="38" rx="6" fill="#1a7f37" fill-opacity="0.10" stroke="#1a7f37" stroke-width="1.5"/>
<rect x="18" y="278" width="12" height="12" rx="2" fill="#1a7f37"/>
<text x="38" y="288" font-size="13" font-weight="700" fill="#1a7f37">device number, 6 bits:  5</text>
<text x="38" y="304" font-size="12" fill="#5c5c5c">the “CAN ID” you set on a SPARK: 0 to 63</text>
<line x1="16" y1="320" x2="504" y2="320" stroke="#e2e2e2"/>
<text x="16" y="342" font-size="13" fill="#222222">Two devices can share a number when their type or maker differs:</text>
<text x="16" y="360" font-size="13" fill="#222222">a REV and a CTRE motor controller can both be number 5.</text>
<text x="16" y="382" font-size="13" font-weight="700" fill="#c62828">Two SPARKs at the same number collide: both answer the same messages.</text>
</svg>
