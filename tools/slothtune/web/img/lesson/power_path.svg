<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="power_path-title power_path-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="power_path-title">The power path</title>
<desc id="power_path-desc">Animated. Current flows from the battery on a red wire through the main breaker to the PDH, out through a breaker on each port and along a red lead to each of three motor controllers, and back on black wires. Every joint on the way, each crimp, Wago and screw terminal, is drawn as a dot: a small resistor. A good feed loses about 0.6 V at 40 A. The third controller's feed has a loose joint that can lose several volts: when it pulls hard, that controller sees a low supply and warns, then reboots and drops off the CAN bus while it restarts. One controller rebooting points at its own feed; many at once points upstream, at the battery or main breaker.</desc>
<style>
.pp-flow{animation:pp-flow 8s linear infinite}
@keyframes pp-flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-480}}
.pp-ok3{opacity:0;animation:pp-ok3 8s linear infinite}
@keyframes pp-ok3{0%{opacity:1}30%{opacity:1}34%{opacity:0}84%{opacity:0}88%{opacity:1}100%{opacity:1}}
.pp-low3{animation:pp-low3 8s linear infinite}
@keyframes pp-low3{0%{opacity:0}30%{opacity:0}34%{opacity:1}58%{opacity:1}62%{opacity:0}100%{opacity:0}}
.pp-reb3{opacity:0;animation:pp-reb3 8s linear infinite}
@keyframes pp-reb3{0%{opacity:0}58%{opacity:0}62%{opacity:1}84%{opacity:1}88%{opacity:0}100%{opacity:0}}
.pp-box3{animation:pp-box3 8s linear infinite}
@keyframes pp-box3{0%{opacity:1}58%{opacity:1}62%{opacity:0.3}84%{opacity:0.3}88%{opacity:1}100%{opacity:1}}
.pp-feed3{animation:pp-feed3 8s linear infinite}
@keyframes pp-feed3{0%{opacity:1}58%{opacity:1}61%{opacity:0}85%{opacity:0}88%{opacity:1}100%{opacity:1}}
.pp-glow{animation:pp-glow 8s linear infinite}
@keyframes pp-glow{0%{opacity:0}30%{opacity:0}34%{opacity:1}40%{opacity:0.35}46%{opacity:1}52%{opacity:0.35}58%{opacity:1}62%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">The power path</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Current goes out on red to each controller and comes back on black.</text>
