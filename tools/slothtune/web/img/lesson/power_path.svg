<text x="254" y="78" font-size="12" font-weight="700" fill="#1a7f37">good feed: about 0.6 V</text>
<text x="254" y="92" font-size="12" font-weight="700" fill="#1a7f37">lost at 40 A</text>
<text x="254" y="272" font-size="12" font-weight="700" fill="#c62828">loose joint: several volts lost</text>
<path d="M392 244 L330 260" stroke="#c62828" stroke-width="1" fill="none"/>
