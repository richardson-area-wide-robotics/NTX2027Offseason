<text x="452" y="101" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">controller</text>
</g>
<text x="452" y="117" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">OK</text>
<g><rect x="404" y="151" width="96" height="42" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
<text x="452" y="169" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">controller</text>
</g>
<text x="452" y="185" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">OK</text>
<g class="pp-box3"><rect x="404" y="219" width="96" height="42" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
<text x="452" y="237" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">controller</text>
</g>
<text x="452" y="253" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle" class="pp-ok3" data-ov="st3">OK</text>
<text x="452" y="253" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle" class="pp-low3" data-ov="st3">low supply!</text>
<text x="452" y="253" font-size="12" font-weight="700" fill="#c62828" text-anchor="middle" class="pp-reb3" data-ov="st3">rebooting</text>
<text x="500" y="290" font-size="12" font-weight="700" fill="#c62828" text-anchor="end" class="pp-reb3">gone from the CAN bus</text>
