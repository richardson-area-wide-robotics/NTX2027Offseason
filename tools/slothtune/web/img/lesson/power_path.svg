<rect x="228" y="161" width="16" height="10" rx="2" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
<rect x="228" y="229" width="16" height="10" rx="2" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
<text x="216" y="288" font-size="12" fill="#5c5c5c" text-anchor="middle">a breaker per port</text>
<path d="M236 239 V276" stroke="#5c5c5c" stroke-width="1" fill="none"/>
