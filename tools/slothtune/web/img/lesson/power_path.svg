<text x="34" y="242" font-size="12" fill="#5c5c5c">(crimp, Wago or</text>
<text x="34" y="258" font-size="12" fill="#5c5c5c">screw terminal)</text>
<line x1="16" y1="304" x2="504" y2="304" stroke="#e2e2e2"/>
<text x="16" y="326" font-size="13" fill="#222222">Volts lost = current × resistance (V = I × R): a bad joint adds a lot.</text>
<text x="16" y="346" font-size="13" fill="#222222">One controller rebooting points at its own feed; many at once points</text>
<text x="16" y="364" font-size="13" fill="#222222">upstream, at the battery or main breaker.</text>
</svg>
