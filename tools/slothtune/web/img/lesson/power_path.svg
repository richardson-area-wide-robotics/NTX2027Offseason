<path d="M246 166 H404" fill="none" stroke="#d0352b" stroke-width="5"/>
<path d="M404 178 H246" fill="none" stroke="#333333" stroke-width="5"/>
<g><path class="pp-flow" d="M246 166 H404" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 15.9"/><path class="pp-flow" d="M404 178 H246" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 15.9"/></g>
<path d="M246 234 H404" fill="none" stroke="#d0352b" stroke-width="5"/>
<path d="M404 246 H246" fill="none" stroke="#333333" stroke-width="5"/>
<g class="pp-feed3"><path class="pp-flow" d="M246 234 H404" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 15.9"/><path class="pp-flow" d="M404 246 H246" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 15.9"/></g>
