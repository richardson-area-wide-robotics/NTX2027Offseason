<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 394" width="520" height="394" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="kA-title kA-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="kA-title">kA: extra volts to speed up</title>
<desc id="kA-desc">Animated, two graphs drawn left to right together. Top: speed, which is zero, rises steadily while the robot speeds up, then holds. Bottom: volts. A dashed gray line shows kV times speed, just to hold each speed. The green line, the volts sent, sits above it by a shaded extra while the robot is speeding up: kA times acceleration. When the speed stops changing the extra drops away and the green line falls back onto the dashed one. Speeding up takes force, force takes current, and current takes volts; kA reflects how heavy the robot is: tiny on blocks, a quarter of the robot on the floor.</desc>
