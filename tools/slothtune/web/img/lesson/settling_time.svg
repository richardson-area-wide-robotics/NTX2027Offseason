<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 354" width="520" height="354" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="settling_time-title settling_time-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="settling_time-title">Settling time: until it stays in the band</title>
<desc id="settling_time-desc">Animated graph. A shaded band surrounds the target; the band is 2% of the step, drawn wider here so it can be seen. The dashed setpoint jumps and the solid measured line is drawn after it: it overshoots, rings in and out of the band a few times, and finally stays inside. A green line marks where it stays inside from then on, and a bracket from the setpoint jump to that line is the settling time.</desc>
