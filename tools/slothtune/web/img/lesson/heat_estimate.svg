<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 378" width="520" height="378" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="he-title he-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="he-title">Heat estimate: faster than the sensor</title>
<desc id="he-desc">Animated. Left: a NEO 550 cut open, with the copper windings inside and the temperature sensor on the outside of the case. As time passes at 40 A the windings glow hotter while the sensor barely warms. Right: a graph of temperature over time. The heat estimate, worked out from the current, follows the windings' real temperature; the sensor reading lags tens of seconds behind. When the windings die the sensor still reads about 40 °C.</desc>
