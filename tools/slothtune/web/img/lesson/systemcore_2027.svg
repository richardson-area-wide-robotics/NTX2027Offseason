<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 452" width="520" height="452" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="systemcore_2027-title systemcore_2027-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="systemcore_2027-title">From the roboRIO to SystemCore in 2027</title>
<desc id="systemcore_2027-desc">Animated, two columns: the roboRIO today and SystemCore in 2027. Left, a navX sits on the roboRIO's MXP port, which it talks to over SPI, and the roboRIO has one CAN bus. The navX lifts off and is crossed out, because SystemCore has no MXP port and no SPI. Right, SystemCore has an IMU of its own on board and five CAN buses, each CAN-H in its own color and every CAN-L green, with messages moving along each; a Redux Canandgyro appears on the first bus. Below, a switch on a digital input opens and closes. On the roboRIO the input is pulled up to 5 volts and the switch goes to ground, so it reads high when open and low when closed. On SystemCore's 3.3-volt Smart I/O the input is pulled down and the switch goes to 3.3 volts, so it reads low when open and high when closed. Sensors made for the roboRIO's inputs may need different wiring. SystemCore's numbers come from its June 2025 alpha specification.</desc>
<style>
.sc-navx{animation:sc-navx 8s ease-in-out infinite}
.sc-x{opacity:0;animation:sc-x 8s linear infinite}
.sc-cg{opacity:1;animation:sc-cg 8s linear infinite}
.sc-sw{transform-box:view-box;transform:rotate(-34deg);animation:sc-sw 8s ease-in-out infinite}
.sc-swl{transform-origin:62px 330px}
.sc-swr{transform-origin:318px 330px}
.sc-ho{opacity:1;animation:sc-ho 8s linear infinite}
.sc-hc{opacity:0;animation:sc-hc 8s linear infinite}
.sc-p{opacity:0;animation:sc-p 8s linear infinite}
.sc-pl{opacity:0;animation:sc-pl 8s linear infinite}
.sc-p0{animation-delay:-0s}.sc-p1{animation-delay:-1.6s}.sc-p2{animation-delay:-3.2s}.sc-p3{animation-delay:-4.8s}.sc-p4{animation-delay:-6.4s}
@keyframes sc-navx{0%{transform:translateY(0px);opacity:1}22%{transform:translateY(0px);opacity:1}34%{transform:translateY(-16px);opacity:0}88%{transform:translateY(-16px);opacity:0}96%{transform:translateY(0px);opacity:1}100%{transform:translateY(0px);opacity:1}}
@keyframes sc-x{0%{opacity:0}32%{opacity:0}36%{opacity:1}86%{opacity:1}90%{opacity:0}100%{opacity:0}}
@keyframes sc-cg{0%{opacity:0}38%{opacity:0}46%{opacity:1}86%{opacity:1}92%{opacity:0}100%{opacity:0}}
@keyframes sc-sw{0%{transform:rotate(-34deg)}44%{transform:rotate(-34deg)}50%{transform:rotate(0deg)}94%{transform:rotate(0deg)}100%{transform:rotate(-34deg)}}
@keyframes sc-ho{0%{opacity:1}47%{opacity:1}49%{opacity:0}97%{opacity:0}99%{opacity:1}100%{opacity:1}}
@keyframes sc-hc{0%{opacity:0}47%{opacity:0}49%{opacity:1}97%{opacity:1}99%{opacity:0}100%{opacity:0}}
@keyframes sc-p{0%{transform:translateX(0px);opacity:0}3%{transform:translateX(0px);opacity:1}22%{transform:translateX(160px);opacity:1}25%{transform:translateX(160px);opacity:0}100%{transform:translateX(160px);opacity:0}}
@keyframes sc-pl{0%{transform:translateX(0px);opacity:0}3%{transform:translateX(0px);opacity:1}22%{transform:translateX(150px);opacity:1}25%{transform:translateX(150px);opacity:0}100%{transform:translateX(150px);opacity:0}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">From the roboRIO to SystemCore in 2027</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">What changes on the robot. SystemCore's spec is still an alpha.</text>
<line x1="262" y1="62" x2="262" y2="374" stroke="#d6d6d6" stroke-width="1"/>
<text x="24" y="76" font-size="13" font-weight="700" fill="#222222">roboRIO (today)</text>
<text x="280" y="76" font-size="13" font-weight="700" fill="#222222">SystemCore (2027)</text>

<g class="sc-navx"><rect x="56" y="88" width="120" height="28" rx="3" fill="#e7edfb" stroke="#444444" stroke-width="1.4"/>
<text x="116" y="107" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">navX</text></g>
<rect x="76" y="116" width="80" height="7" fill="#444444"/>
<g class="sc-x"><path d="M100 90 L132 116 M132 90 L100 116" stroke="#c62828" stroke-width="3.5" stroke-linecap="round"/></g>
<rect x="24" y="123" width="212" height="56" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
<text x="130" y="146" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">roboRIO</text>
<text x="130" y="167" font-size="12" fill="#5c5c5c" text-anchor="middle">MXP port: the navX talks SPI</text>
<path d="M60 179 V198 H236" fill="none" stroke="#f2c200" stroke-width="2.4"/>
<path d="M64 179 V202 H236" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
<rect class="sc-pl" x="70" y="193" width="22" height="13" rx="6.5" fill="#446ce3" fill-opacity="0.4"/>
<text x="24" y="226" font-size="12" font-weight="700" fill="#222222">one CAN bus</text>

<text x="280" y="104" font-size="12" font-weight="700" fill="#c62828">no MXP port, no SPI</text>
<rect x="280" y="123" width="140" height="56" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
<text x="350" y="144" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">SystemCore</text>
<rect x="326" y="152" width="48" height="19" rx="2" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
<text x="350" y="166" font-size="12" fill="#222222" text-anchor="middle">IMU</text>
<path d="M340 179 V198 H504" fill="none" stroke="#f2c200" stroke-width="2.4"/><path d="M344 179 V202 H504" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
<rect class="sc-p sc-p0" x="348" y="193" width="22" height="13" rx="6.5" fill="#446ce3" fill-opacity="0.4"/>
<path d="M328 179 V210 H504" fill="none" stroke="#446ce3" stroke-width="2.4"/><path d="M332 179 V214 H504" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
<rect class="sc-p sc-p1" x="336" y="205" width="22" height="13" rx="6.5" fill="#446ce3" fill-opacity="0.4"/>
<path d="M316 179 V222 H504" fill="none" stroke="#8e44ad" stroke-width="2.4"/><path d="M320 179 V226 H504" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
<rect class="sc-p sc-p2" x="324" y="217" width="22" height="13" rx="6.5" fill="#446ce3" fill-opacity="0.4"/>
<path d="M304 179 V234 H504" fill="none" stroke="#e8890c" stroke-width="2.4"/><path d="M308 179 V238 H504" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
<rect class="sc-p sc-p3" x="312" y="229" width="22" height="13" rx="6.5" fill="#446ce3" fill-opacity="0.4"/>
<path d="M292 179 V246 H504" fill="none" stroke="#8d6e63" stroke-width="2.4"/><path d="M296 179 V250 H504" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
<rect class="sc-p sc-p4" x="300" y="241" width="22" height="13" rx="6.5" fill="#446ce3" fill-opacity="0.4"/>
<g class="sc-cg"><rect x="428" y="88" width="76" height="34" rx="4" fill="#e6f2ea" stroke="#444444" stroke-width="1.4"/>
<text x="466" y="110" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">Canandgyro</text>
<path d="M462 122 V198" stroke="#f2c200" stroke-width="2.4"/><path d="M470 122 V202" stroke="#2e7d32" stroke-width="2.4"/></g>
<text x="280" y="268" font-size="12" font-weight="700" fill="#222222">five CAN buses; CAN-L always green</text>

<line x1="16" y1="276" x2="504" y2="276" stroke="#e2e2e2" stroke-width="1"/>

<text x="24" y="286" font-size="12" font-weight="700" fill="#222222">DIO: pull-up to 5 V</text>
<text x="40" y="304" font-size="12" fill="#5c5c5c" text-anchor="end">5 V</text>
<path d="M62 300 V306" stroke="#444444" stroke-width="1.6"/><circle cx="62" cy="300" r="2.5" fill="#444444"/>
<path d="M62 306 L68 307.3 L56 310.0 L68 312.7 L56 315.3 L68 318.0 L56 320.7 L62 322" fill="none" stroke="#444444" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M62 322 V330 H112" fill="none" stroke="#444444" stroke-width="1.6"/>
<circle cx="62" cy="330" r="2.8" fill="#444444"/>
<text x="116" y="334" font-size="12" fill="#5c5c5c">input</text>
<g class="sc-sw sc-swl"><line x1="62" y1="330" x2="62" y2="352" stroke="#222222" stroke-width="2.4" stroke-linecap="round"/></g>
<circle cx="62" cy="354" r="2.5" fill="#ffffff" stroke="#444444" stroke-width="1.4"/>
<path d="M62 356 V362" stroke="#444444" stroke-width="1.6"/>
<path d="M53 362 H71 M56 366 H68 M59 370 H65" stroke="#444444" stroke-width="1.6"/>
<text x="74" y="366" font-size="12" fill="#5c5c5c">switch to ground</text>
<rect class="sc-ho" x="160" y="300" width="88" height="22" rx="4" fill="#fdf0e1" stroke="#b45309" stroke-width="1"/>
<rect class="sc-hc" x="160" y="326" width="88" height="22" rx="4" fill="#fdf0e1" stroke="#b45309" stroke-width="1"/>
<text x="168" y="315" font-size="12" fill="#222222">open: <tspan font-weight="700">high</tspan></text>
<text x="168" y="341" font-size="12" fill="#222222">closed: <tspan font-weight="700">low</tspan></text>


<text x="280" y="286" font-size="12" font-weight="700" fill="#222222">Smart I/O: pull-down, 3.3 V</text>
<text x="300" y="304" font-size="12" fill="#5c5c5c" text-anchor="end">3.3 V</text>
<path d="M318 300 V306" stroke="#444444" stroke-width="1.6"/><circle cx="318" cy="300" r="2.5" fill="#444444"/>
<circle cx="318" cy="306" r="2.5" fill="#ffffff" stroke="#444444" stroke-width="1.4"/>
<g class="sc-sw sc-swr"><line x1="318" y1="330" x2="318" y2="308" stroke="#222222" stroke-width="2.4" stroke-linecap="round"/></g>
<circle cx="318" cy="330" r="2.8" fill="#444444"/>
<path d="M318 330 H368" fill="none" stroke="#444444" stroke-width="1.6"/>
<text x="372" y="334" font-size="12" fill="#5c5c5c">input</text>
<path d="M318 330 V338" stroke="#444444" stroke-width="1.6"/>
<path d="M318 338 L324 339.3 L312 342.0 L324 344.7 L312 347.3 L324 350.0 L312 352.7 L318 354" fill="none" stroke="#444444" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M318 354 V362" stroke="#444444" stroke-width="1.6"/>
<path d="M309 362 H327 M312 366 H324 M315 370 H321" stroke="#444444" stroke-width="1.6"/>
<text x="330" y="366" font-size="12" fill="#5c5c5c">switch to 3.3 V</text>
<rect class="sc-ho" x="416" y="300" width="88" height="22" rx="4" fill="#fdf0e1" stroke="#b45309" stroke-width="1"/>
<rect class="sc-hc" x="416" y="326" width="88" height="22" rx="4" fill="#fdf0e1" stroke="#b45309" stroke-width="1"/>
<text x="424" y="315" font-size="12" fill="#222222">open: <tspan font-weight="700">low</tspan></text>
<text x="424" y="341" font-size="12" fill="#222222">closed: <tspan font-weight="700">high</tspan></text>

<line x1="16" y1="384" x2="504" y2="384" stroke="#d6d6d6" stroke-width="1"/>
<text x="16" y="404" font-size="13" fill="#222222">No MXP or SPI: the navX comes off, the Canandgyro goes on CAN.</text>
<text x="16" y="423" font-size="13" fill="#222222">Sensors made for the roboRIO's inputs may need rewiring.</text>
<text x="16" y="442" font-size="12" fill="#5c5c5c">Sources: WPILib 2027 docs; Limelight's SystemCore spec (June 2025, alpha).</text>
</svg>
