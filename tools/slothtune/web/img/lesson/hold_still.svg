<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384" width="520" height="384" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="hs-title hs-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="hs-title">Why hold still</title>
<desc id="hs-desc">Animated. Two charts fill in, dot by dot, with an encoder's readings over a few seconds. Held still: the readings only flicker by the last bit, the dashed average sits in the middle, the shaded spread is tiny, and the capture agrees and saves the offset. Bumped partway: the readings jump to a new level, the average lands between the two, a blurred position the wheel was never at, the spread is too big, and the capture asks again.</desc>
