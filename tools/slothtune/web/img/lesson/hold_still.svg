<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Why hold still</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">The capture averages a few seconds of readings and checks they agree.</text>
<text x="70" y="80" font-size="13" font-weight="700" fill="#1a7f37">Held still</text>
<rect x="70" y="88" width="302" height="60" fill="#fafbfc" stroke="#d6d6d6" stroke-width="1"/>
<text x="62" y="122" font-size="12" fill="#5c5c5c" text-anchor="end">reading</text>
