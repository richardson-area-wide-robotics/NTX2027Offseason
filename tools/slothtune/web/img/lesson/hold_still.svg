<text x="372" y="277" font-size="12" fill="#5c5c5c" text-anchor="end">a few seconds →</text>
<path class="hs-cur" d="M77 88V148M77 188V256" fill="none" stroke="#446ce3" stroke-width="1.5"/>
<line x1="70" y1="296" x2="96" y2="296" stroke="#222222" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="102" y="300" font-size="12" fill="#222222">the average</text>
<rect x="186" y="290" width="26" height="12" fill="#9aa3ad" fill-opacity="0.35"/>
<text x="218" y="300" font-size="12" fill="#222222">the spread: do the readings agree?</text>
<line x1="16" y1="316" x2="504" y2="316" stroke="#d6d6d6" stroke-width="1"/>
<text x="16" y="336" font-size="13" fill="#222222">Averaging removes the encoder's last-bit flicker. Checking the spread</text>
<text x="16" y="354" font-size="13" fill="#222222">catches a bumped wheel. Both make the offset the real position, not a</text>
<text x="16" y="372" font-size="13" fill="#222222">moment's guess.</text>
