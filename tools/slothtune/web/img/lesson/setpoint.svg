<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 356" width="520" height="356" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="setpoint-title setpoint-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="setpoint-title">Setpoint: what you want</title>
<desc id="setpoint-desc">Animated graph drawn left to right. A thick dashed blue line, the setpoint, sits at the start level, then jumps suddenly to the target and stays there; a ring flashes at the jump. A thinner solid orange line, the measured value, follows it up a moment later. The setpoint is what you want: the angle a wheel should point, or the speed it should spin. In a step test the tool jumps the setpoint suddenly, because one sudden jump shows everything about how a loop behaves in one picture. WPILib also calls it the reference, r(t).</desc>
