<line x1="18" y1="330" x2="38" y2="330" stroke="#222222" stroke-width="3" stroke-linecap="round"/><text x="48" y="334" font-size="12" fill="#222222">where the wheel points</text>
<line x1="16" y1="346" x2="504" y2="346" stroke="#e2e2e2"/>
<text x="16" y="366" font-size="13" fill="#222222">That friction is much larger than in the air, so gains tuned on blocks</text>
<text x="16" y="384" font-size="13" fill="#222222">usually stop a few degrees short on the floor.</text>
<text x="16" y="404" font-size="13" font-weight="700" fill="#222222">Always finish steering on the floor.</text>
