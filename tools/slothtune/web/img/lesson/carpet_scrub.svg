.cs-short { opacity: 1; animation: cs-short 8s linear infinite; }
@keyframes cs-short { 0%, 26.13% { opacity: 0; } 28.13%, 86% { opacity: 1; } 88%, 100% { opacity: 0; } }
.cs-done { opacity: 1; animation: cs-done 8s linear infinite; }
@keyframes cs-done { 0%, 40% { opacity: 0; } 43%, 86% { opacity: 1; } 88%, 100% { opacity: 0; } }
