<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 418" width="520" height="418" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="cs-title cs-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="cs-title">Carpet scrub: a standing wheel fights the carpet</title>
<desc id="cs-desc">Animated. Two wheels seen from above, both steered toward the same dashed target angle with the same gains. A blue arc from each wheel to its target is the push toward the target; it shrinks as the wheel gets close. Left, on blocks, in the air: the wheel turns all the way onto the target and the push shrinks to nothing. Right, on the floor, on carpet: red arrows at both ends of the wheel show the carpet friction twisting the tread the other way; the wheel turns more slowly and stops a few degrees short, where the small push left near the target can no longer beat the friction. Below: that friction is much larger than in the air, so gains tuned on blocks usually stop a few degrees short on the floor; always finish steering on the floor.</desc>
<style>
.cs-ra { transform-box: view-box; transform-origin: 0 0; transform: rotate(60.0deg); animation: cs-ra 8s linear infinite; }
.cs-rc { transform-box: view-box; transform-origin: 0 0; transform: rotate(52.0deg); animation: cs-rc 8s linear infinite; }
.cs-ea { stroke-dasharray: 60 60; stroke-dashoffset: -60.0; animation: cs-ea 8s linear infinite; }
.cs-ec { stroke-dasharray: 60 60; stroke-dashoffset: -52.0; animation: cs-ec 8s linear infinite; }
.cs-ha { opacity: 0; animation: cs-ha 8s linear infinite; }
@keyframes cs-ha { 0%, 28% { opacity: 1; } 36%, 97% { opacity: 0; } 99%, 100% { opacity: 1; } }
.cs-hc { opacity: 1; animation: cs-hc 8s linear infinite; }
@keyframes cs-hc { 0%, 86% { opacity: 1; } 88%, 97% { opacity: 0; } 99%, 100% { opacity: 1; } }
.cs-fr { opacity: 1; animation: cs-fr 8s linear infinite; }
