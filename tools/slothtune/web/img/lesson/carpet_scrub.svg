@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Carpet scrub: a standing wheel fights the carpet</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Same gains, same target: in the air it gets there; on carpet it stops short.</text>
