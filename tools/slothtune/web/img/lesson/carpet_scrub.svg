<g transform="translate(386 176)"><g class="cs-rc"><rect x="-14" y="-40" width="28" height="80" rx="6" fill="#3a3f45"/><path d="M-14 -32H14M-14 -24H14M-14 -16H14M-14 -8H14M-14 0H14M-14 8H14M-14 16H14M-14 24H14M-14 32H14" stroke="#5d646b" stroke-width="1.5"/><circle r="5" fill="#b0b8c0" stroke="#444444" stroke-width="1"/><line x1="0" y1="-42" x2="0" y2="-82" stroke="#222222" stroke-width="3" stroke-linecap="round"/><g class="cs-fr"><g><path d="M26.29 16.43A31 31 0 0 0 28.74 -11.62" fill="none" stroke="#c62828" stroke-width="3"/><path d="M26.29 -16.43L35.72 -11.71L26.39 -5.88Z" fill="#c62828"/></g><g><path d="M-26.29 -16.43A31 31 0 0 0 -28.74 11.62" fill="none" stroke="#c62828" stroke-width="3"/><path d="M-26.29 16.43L-35.72 11.71L-26.39 5.88Z" fill="#c62828"/></g></g></g></g>
