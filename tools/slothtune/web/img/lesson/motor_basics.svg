<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 414" width="520" height="414" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="mb-title mb-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="mb-title">What a motor's numbers mean</title>
<desc id="mb-desc">Animated. A graph of a NEO V1.1 at 12 V: speed falls in a straight line from its free speed, 5676 rpm with no load, to zero at its stall torque, 1.92 ft·lb (2.6 N·m) and 105 A when held still. A green power-out curve under the line peaks at 406 W at half speed and half torque. An orange dot slides along the line between free speed and stall; two bars beside it show the power out, largest at the middle and zero at both ends, and the heat, which grows as current squared and is largest at stall.</desc>
