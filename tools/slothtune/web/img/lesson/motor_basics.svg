<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">What a motor's numbers mean</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">A NEO V1.1 at 12 V: the harder it pushes, the slower it turns.</text>
<path d="M70 96 V290 H330" fill="none" stroke="#444444" stroke-width="1.5"/>
<path d="M70 90 L74.4 98 L65.6 98Z" fill="#444444"/>
<path d="M336 290 L328 294.4 L328 285.6Z" fill="#444444"/>
<text x="62" y="114" font-size="12" font-weight="700" fill="#446ce3" text-anchor="end">speed</text>
<text x="100" y="306" font-size="12" font-weight="700" fill="#222222">torque →</text>
<path d="M70 200 H190 V290" fill="none" stroke="#5c5c5c" stroke-width="1" stroke-dasharray="3 3"/>
<text x="62" y="204" font-size="12" fill="#5c5c5c" text-anchor="end">half</text>
<text x="190" y="306" font-size="12" fill="#5c5c5c" text-anchor="middle">half</text>
<path d="M70 290 Q190 206 310 290" fill="none" stroke="#1a7f37" stroke-width="2.5"/>
<text x="184" y="280" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="end">power out</text>
<line x1="70" y1="110" x2="310" y2="290" stroke="#446ce3" stroke-width="3"/>
<circle cx="70" cy="110" r="4.5" fill="#446ce3"/><circle cx="310" cy="290" r="4.5" fill="#446ce3"/>
<text x="96" y="106" font-size="13" font-weight="700" fill="#222222">free speed</text>
<text x="96" y="121" font-size="12" fill="#5c5c5c">5676 rpm, no load</text>
<line x1="226" y1="170" x2="198" y2="195" stroke="#5c5c5c" stroke-width="1"/>
<text x="228" y="160" font-size="13" font-weight="700" fill="#1a7f37">most power: 406 W</text>
<text x="228" y="176" font-size="12" fill="#5c5c5c">half speed, half torque</text>
<text x="334" y="308" font-size="13" font-weight="700" fill="#222222" text-anchor="end">stall: held still</text>
<text x="334" y="323" font-size="12" fill="#5c5c5c" text-anchor="end">1.92 ft·lb (2.6 N·m), 105 A</text>
<g class="mb-x">
  <line x1="190" y1="128" x2="190" y2="290" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7"/>
