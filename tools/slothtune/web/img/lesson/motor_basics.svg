</g>
<text x="380" y="100" font-size="13" font-weight="700" fill="#222222">At the orange dot</text>
<rect x="396" y="120" width="36" height="150" fill="#f4f6f4" stroke="#444444" stroke-width="1.2"/>
<rect class="mb-pow" x="396" y="120" width="36" height="150" fill="#1a7f37"/>
<rect x="456" y="120" width="36" height="150" fill="#f8f2f2" stroke="#444444" stroke-width="1.2"/>
<rect class="mb-heat" x="456" y="120" width="36" height="150" fill="#c62828"/>
<rect x="396" y="120" width="36" height="150" fill="none" stroke="#444444" stroke-width="1.2"/>
<rect x="456" y="120" width="36" height="150" fill="none" stroke="#444444" stroke-width="1.2"/>
<text x="414" y="288" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">power out</text>
<text x="474" y="288" font-size="12" font-weight="700" fill="#c62828" text-anchor="middle">heat</text>
<text x="474" y="303" font-size="12" fill="#5c5c5c" text-anchor="middle">(current²)</text>
<line x1="16" y1="342" x2="504" y2="342" stroke="#d6d6d6" stroke-width="1"/>
<text x="16" y="362" font-size="13" fill="#222222">Volts decide how fast it can go: 473 rpm a volt × 12 V = 5676 rpm.</text>
<text x="16" y="381" font-size="13" fill="#222222">Current makes the torque, and the heat, as current squared.</text>
<text x="16" y="400" font-size="12" fill="#5c5c5c">A stalled motor does no work and makes the most heat.</text>
</svg>
