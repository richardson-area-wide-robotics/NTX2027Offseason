.mb-yp { animation: mb-yp 8s linear infinite; }
.mb-pow { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(1); animation: mb-pow 8s linear infinite; }
.mb-heat { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0.25); animation: mb-heat 8s linear infinite; }
