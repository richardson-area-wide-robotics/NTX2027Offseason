<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" width="520" height="424" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="feedback-title feedback-desc">
<title id="feedback-title">Feedback: measure the error, push to shrink it</title>
<desc id="feedback-desc">Animated. Top: the feedback loop as three steps that light up in turn: measure where the mechanism really is, work out the error as target minus measured, push to shrink the error, then the mechanism moves and it measures again. Below: a graph drawn left to right. The measured position sits on the dashed target line and the feedback push is zero. A bump knocks the mechanism off the target; the gap, the error, is shaded red. Only then does the push jump up, and it shrinks back to zero as the mechanism returns to the target. At the bottom, WPILib's one-line summary: P drives the position error to zero, D the velocity error, I the accumulated error.</desc>
<style>
.fb-wipe { animation: fb-wipe 8s linear infinite; }
@keyframes fb-wipe { 0%, 4% { transform: translateX(-400px); } 84%, 100% { transform: translateX(0); } }
.fb-fade { animation: fb-fade 8s linear infinite; }
@keyframes fb-fade { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
.fb-cursor { opacity: 0; animation: fb-cursor 8s linear infinite; }
@keyframes fb-cursor { 0%, 4% { transform: translateX(0); opacity: 1; } 84% { transform: translateX(400px); opacity: 1; } 88%, 100% { transform: translateX(400px); opacity: 0; } }

.fb-hl { opacity: 0; animation: fb-hl 4s linear infinite; }
.fb-s1 { animation-delay: 0s; } .fb-s2 { animation-delay: -3s; }
.fb-s3 { animation-delay: -2s; } .fb-s4 { animation-delay: -1s; }
@keyframes fb-hl { 0% { opacity: 0; } 4%, 22% { opacity: 1; } 27%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="28" font-size="16" fill="#222222" font-weight="700">Feedback: measure the error, push to shrink it</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">It fixes what feedforward got wrong: bumps, friction, wear.</text>
<rect x="16" y="62" width="132" height="40" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
<rect class="fb-hl fb-s1" x="16" y="62" width="132" height="40" rx="6" fill="none" stroke="#446ce3" stroke-width="3"/>
<text x="26" y="79" font-size="13" fill="#222222" font-weight="700">1  Measure</text>
<text x="26" y="95" font-size="12" fill="#5c5c5c">where it really is</text>
<rect x="178" y="62" width="164" height="40" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
<rect class="fb-hl fb-s2" x="178" y="62" width="164" height="40" rx="6" fill="none" stroke="#446ce3" stroke-width="3"/>
<text x="188" y="79" font-size="13" fill="#222222" font-weight="700">2  Error</text>
<text x="188" y="95" font-size="12" fill="#5c5c5c">target − measured</text>
<rect x="372" y="62" width="132" height="40" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
<rect class="fb-hl fb-s3" x="372" y="62" width="132" height="40" rx="6" fill="none" stroke="#446ce3" stroke-width="3"/>
<text x="382" y="79" font-size="13" fill="#222222" font-weight="700">3  Push</text>
<text x="382" y="95" font-size="12" fill="#5c5c5c">to shrink the error</text>
<path d="M148 82 H170" stroke="#444444" stroke-width="1.6"/><path d="M176 82 L169 77.8 L169 86.2Z" fill="#444444"/>
<path d="M342 82 H364" stroke="#444444" stroke-width="1.6"/><path d="M370 82 L363 77.8 L363 86.2Z" fill="#444444"/>
