<path class="fb-hl fb-s4" d="M438 102 V118 H82 V110" fill="none" stroke="#446ce3" stroke-width="3"/>
<text x="260" y="134" font-size="12" fill="#5c5c5c" text-anchor="middle">the mechanism moves, then it measures again</text>
