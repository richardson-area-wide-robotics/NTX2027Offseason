<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384" width="520" height="384" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="can_fd-title can_fd-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="can_fd-title">CAN FD: faster data, bigger messages</title>
<desc id="can_fd-desc">Animated. Two messages drawn on the same time line, so width is time. Classic CAN: the ID, up to 8 bytes of data, and the end. CAN FD: the same ID at the same speed, because arbitration is the same, then the data part at a faster bit rate, so each byte is narrower, and up to 64 bytes instead of 8. A cursor sends both at the same pace from left to right. Below: on an FD bus every device must speak FD, so a classic-only device does not belong on it; and SystemCore, the 2027 robot controller, has five CAN buses of its own, each able to run FD, so the load can be split, the drivetrain on one and mechanisms on another.</desc>
<style>
.fd-cov{opacity:0;animation:fd-cov 8s linear infinite}
@keyframes fd-cov{0%{opacity:0;transform:translateX(0px)}4%{opacity:0;transform:translateX(0px)}6%{opacity:1;transform:translateX(0px)}74%{opacity:1;transform:translateX(408.0px)}76%{opacity:0;transform:translateX(408.0px)}100%{opacity:0;transform:translateX(408.0px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
