<g class="sp-c00"><rect x="199" y="117" width="34" height="34" rx="6" fill="#446ce3"/><text x="216" y="139" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kP</text></g>
<g class="sp-c02"><rect x="287" y="117" width="34" height="34" rx="6" fill="#446ce3"/><text x="304" y="139" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kD</text></g>
<g class="sp-c06"><rect x="463" y="117" width="34" height="34" rx="6" fill="#446ce3"/><text x="480" y="139" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kG</text></g>
<rect x="16" y="168" width="488" height="52" rx="8" fill="#f6f7f9"/>
