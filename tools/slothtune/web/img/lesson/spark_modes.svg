@keyframes sp-c06{0%,11%{opacity:0}12.5%,96%{opacity:1}99%,100%{opacity:0}}
.sp-hl1{opacity:0;animation:sp-hl1 8s linear infinite}
@keyframes sp-hl1{0%,32%{opacity:0}33.5%,56.5%{opacity:1}58%,100%{opacity:0}}
.sp-c10{animation:sp-c10 8s linear infinite}
@keyframes sp-c10{0%,34%{opacity:0}35.5%,96%{opacity:1}99%,100%{opacity:0}}
