@keyframes sp-c25{0%,69.5%{opacity:0}71%,96%{opacity:1}99%,100%{opacity:0}}
.sp-c26{animation:sp-c26 8s linear infinite}
@keyframes sp-c26{0%,72%{opacity:0}73.5%,96%{opacity:1}99%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Which gains a SPARK uses</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">A filled square: the tool computes that gain for that mode.</text>

<text x="216" y="84" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">kP</text>
<text x="260" y="84" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">kI</text>
<text x="304" y="84" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">kD</text>
<text x="348" y="84" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">kS</text>
<text x="392" y="84" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">kV</text>
<text x="436" y="84" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">kA</text>
<text x="480" y="84" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">kG</text>
<text x="480" y="99" font-size="12" fill="#5c5c5c" text-anchor="middle">gravity</text>
<rect x="16" y="108" width="488" height="52" rx="8" fill="#f6f7f9"/>
