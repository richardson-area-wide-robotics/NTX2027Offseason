<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 352" width="520" height="352" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="spark_modes-title spark_modes-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="spark_modes-title">Which gains a SPARK uses</title>
<desc id="spark_modes-desc">Animated table of SPARK modes against the gains kP, kI, kD, kS, kV, kA and kG (gravity). Each row lights in turn and its gains fill in. Position, a target position: kP, kD and kG, with kS kept at 0. Velocity, a target speed: kP, kI, kS and kV. MAXMotion, which also follows its profile: PID, plus kS, kV, kA and kG, with gravity used in MAXMotion position only. Plain Position gets only a position, so a measured kV does nothing there. In plain Position the tool keeps kS at 0.</desc>
<style>
.sp-hl0{opacity:0;animation:sp-hl0 8s linear infinite}
@keyframes sp-hl0{0%,4%{opacity:0}5.5%,28.5%{opacity:1}30%,100%{opacity:0}}
.sp-c00{animation:sp-c00 8s linear infinite}
@keyframes sp-c00{0%,6%{opacity:0}7.5%,96%{opacity:1}99%,100%{opacity:0}}
.sp-c02{animation:sp-c02 8s linear infinite}
@keyframes sp-c02{0%,8.5%{opacity:0}10%,96%{opacity:1}99%,100%{opacity:0}}
