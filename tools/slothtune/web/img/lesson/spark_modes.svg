<g class="sp-c23"><rect x="331" y="237" width="34" height="34" rx="6" fill="#446ce3"/><text x="348" y="259" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kS</text></g>
<g class="sp-c24"><rect x="375" y="237" width="34" height="34" rx="6" fill="#446ce3"/><text x="392" y="259" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kV</text></g>
<g class="sp-c25"><rect x="419" y="237" width="34" height="34" rx="6" fill="#446ce3"/><text x="436" y="259" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kA</text></g>
<g class="sp-c26"><rect x="463" y="237" width="34" height="34" rx="6" fill="#446ce3"/><text x="480" y="259" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kG*</text></g>
<line x1="16" y1="296" x2="504" y2="296" stroke="#d6d6d6"/>
<text x="16" y="316" font-size="13" fill="#222222">Plain Position gets only a position, so a measured kV does nothing there.</text>
<text x="16" y="338" font-size="12" fill="#5c5c5c">* gravity in MAXMotion position only.   Plain Position: kS stays 0 (it would dither).</text>
</svg>
