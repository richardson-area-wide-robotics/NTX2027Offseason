<rect x="463" y="177" width="34" height="34" rx="6" fill="#ffffff" stroke="#d0d4d9"/>
<g class="sp-c10"><rect x="199" y="177" width="34" height="34" rx="6" fill="#446ce3"/><text x="216" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kP</text></g>
<g class="sp-c11"><rect x="243" y="177" width="34" height="34" rx="6" fill="#446ce3"/><text x="260" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kI</text></g>
<g class="sp-c13"><rect x="331" y="177" width="34" height="34" rx="6" fill="#446ce3"/><text x="348" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kS</text></g>
<g class="sp-c14"><rect x="375" y="177" width="34" height="34" rx="6" fill="#446ce3"/><text x="392" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">kV</text></g>
<rect x="16" y="228" width="488" height="52" rx="8" fill="#f6f7f9"/>
