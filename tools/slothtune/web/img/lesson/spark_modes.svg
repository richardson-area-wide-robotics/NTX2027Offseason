@keyframes sp-c14{0%,41.5%{opacity:0}43%,96%{opacity:1}99%,100%{opacity:0}}
.sp-hl2{opacity:0;animation:sp-hl2 8s linear infinite}
@keyframes sp-hl2{0%,60%{opacity:0}61.5%,84.5%{opacity:1}86%,100%{opacity:0}}
.sp-c2p{animation:sp-c2p 8s linear infinite}
@keyframes sp-c2p{0%,62%{opacity:0}63.5%,96%{opacity:1}99%,100%{opacity:0}}
.sp-c23{animation:sp-c23 8s linear infinite}
@keyframes sp-c23{0%,64.5%{opacity:0}66%,96%{opacity:1}99%,100%{opacity:0}}
.sp-c24{animation:sp-c24 8s linear infinite}
@keyframes sp-c24{0%,67%{opacity:0}68.5%,96%{opacity:1}99%,100%{opacity:0}}
