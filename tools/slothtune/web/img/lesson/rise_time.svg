<title id="rise_time-title">Rise time: from 10% to 90% of the way</title>
<desc id="rise_time-desc">Animated graph. The dashed setpoint jumps to the target and the solid measured line is drawn after it. Dotted lines mark 10% and 90% of the way to the target; dots appear where the measured line crosses each, and the shaded stretch between them is the rise time. Brackets below show the delay before it and the slow finish after it, both not counted, so they don't hide the speed of the move.</desc>
