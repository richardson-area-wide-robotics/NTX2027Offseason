<text x="16" y="336" font-size="13" fill="#222222" font-weight="700">Quicker = more kP, or the motor is giving all it has.</text>
<text x="16" y="354" font-size="13" fill="#222222">Measured between 10% and 90% so the delay and the slow finish don't</text>
<text x="16" y="372" font-size="13" fill="#222222">hide the speed of the move. If the motor is saturated during the rise,</text>
<text x="16" y="390" font-size="13" fill="#222222">more kP won't make it faster: only more voltage, current or less load can.</text>
