<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 432" width="520" height="432" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="battery_current-title battery_current-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="battery_current-title">Battery-side current</title>
<desc id="battery_current-desc">Animated. A PDH port feeds a motor controller running at 25% output, which feeds a motor. The controller is drawn as a switch that connects the motor to the battery a quarter of the time: then current dots flow from the PDH through the motor and back. The rest of the time the switch is open and the motor's current keeps circulating through the controller, not the battery. Scrolling graphs show the motor's current steady at 20 A while the current from the battery comes in 20 A pulses a quarter of the time, averaging 5 A: battery current equals motor current times output, 20 A times 25% is 5 A, which is what the PDH port measures.</desc>
<style>
.bc-flow{animation:bc-flow 8s linear infinite}
@keyframes bc-flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-320}}
.bc-on{animation:bc-on 8s linear infinite}
@keyframes bc-on{0%{opacity:1}6%{opacity:1}6.4%{opacity:0}24.6%{opacity:0}25%{opacity:1}31%{opacity:1}31.4%{opacity:0}49.6%{opacity:0}50%{opacity:1}56%{opacity:1}56.4%{opacity:0}74.6%{opacity:0}75%{opacity:1}81%{opacity:1}81.4%{opacity:0}99.6%{opacity:0}100%{opacity:1}}
.bc-off{opacity:0;animation:bc-off 8s linear infinite}
@keyframes bc-off{0%{opacity:0}6%{opacity:0}6.4%{opacity:1}24.6%{opacity:1}25%{opacity:0}31%{opacity:0}31.4%{opacity:1}49.6%{opacity:1}50%{opacity:0}56%{opacity:0}56.4%{opacity:1}74.6%{opacity:1}75%{opacity:0}81%{opacity:0}81.4%{opacity:1}99.6%{opacity:1}100%{opacity:0}}
.bc-blade{transform-box:view-box;transform-origin:214px 110px;animation:bc-blade 8s linear infinite}
@keyframes bc-blade{0%{transform:rotate(0deg)}6%{transform:rotate(0deg)}6.4%{transform:rotate(-30deg)}24.6%{transform:rotate(-30deg)}25%{transform:rotate(0deg)}31%{transform:rotate(0deg)}31.4%{transform:rotate(-30deg)}49.6%{transform:rotate(-30deg)}50%{transform:rotate(0deg)}56%{transform:rotate(0deg)}56.4%{transform:rotate(-30deg)}74.6%{transform:rotate(-30deg)}75%{transform:rotate(0deg)}81%{transform:rotate(0deg)}81.4%{transform:rotate(-30deg)}99.6%{transform:rotate(-30deg)}100%{transform:rotate(0deg)}}
.bc-scroll{animation:bc-scroll 8s linear infinite}
@keyframes bc-scroll{0%{transform:translateX(0px)}100%{transform:translateX(-420px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Battery-side current</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">At 25% output the controller connects the motor to the battery a quarter of the time.</text>
<path d="M106 110 H196" fill="none" stroke="#d0352b" stroke-width="5"/>
<path d="M106 162 H196" fill="none" stroke="#333333" stroke-width="5"/>
<path d="M316 110 H430 V112 M316 162 H430 V160" fill="none" stroke="#333333" stroke-width="5"/>
<rect x="196" y="74" width="120" height="122" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
<path d="M196 110 H214 M248 110 H316 M196 162 H316 M296 110 V162" fill="none" stroke="#444444" stroke-width="3"/>
<circle cx="214" cy="110" r="3.5" fill="#444444"/><circle cx="248" cy="110" r="3.5" fill="#444444"/>
<line class="bc-blade" x1="214" y1="110" x2="248" y2="110" stroke="#222222" stroke-width="3.5" stroke-linecap="round"/>
<text x="256" y="66" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">controller at 25% output</text>
<text x="256" y="180" font-size="12" fill="#5c5c5c" text-anchor="middle">loops back here</text>
<circle cx="430" cy="136" r="26" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<g class="bc-on"><path class="bc-flow" d="M106 110 H296" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 15.9"/><path class="bc-flow" d="M296 162 H106" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 15.9"/></g>
<path class="bc-flow" d="M296 110 H430 V162 H296" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 15.9"/>
<g class="bc-off"><path class="bc-flow" d="M296 162 V110" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 15.9"/></g>
<circle cx="430" cy="136" r="17" fill="#ffffff"/>
<text x="430" y="141" font-size="15" font-weight="700" fill="#333333" text-anchor="middle">M</text>
<rect x="16" y="86" width="90" height="100" rx="6" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
<text x="61" y="132" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">PDH port</text>
<text x="61" y="150" font-size="12" fill="#5c5c5c" text-anchor="middle">measures</text>
<text x="61" y="165" font-size="12" fill="#5c5c5c" text-anchor="middle">this side</text>
<text x="151" y="100" font-size="12" fill="#5c5c5c" text-anchor="middle">battery side</text>
<text x="373" y="100" font-size="12" fill="#5c5c5c" text-anchor="middle">motor side</text>
<text x="470" y="141" font-size="13" font-weight="700" fill="#222222">20 A</text>
<line x1="16" y1="206" x2="504" y2="206" stroke="#e2e2e2"/>
<text x="16" y="226" font-size="12" font-weight="700" fill="#222222">From the battery: what the PDH port measures</text>
<text x="16" y="304" font-size="12" font-weight="700" fill="#222222">In the motor</text>
<defs><clipPath id="bc-clip"><rect x="64" y="230" width="426" height="140"/></clipPath></defs>
<g clip-path="url(#bc-clip)"><g class="bc-scroll">
<path d="M64 284 H64.00 V236 H90.25 V284 H169.00 V236 H195.25 V284 H274.00 V236 H300.25 V284 H379.00 V236 H405.25 V284 H484.00 V236 H510.25 V284 H589.00 V236 H615.25 V284 H694.00 V236 H720.25 V284 H799.00 V236 H825.25 V284 H904.00 V236 H930.25 V284 H910" fill="#d0352b" fill-opacity="0.18" stroke="#d0352b" stroke-width="2" stroke-linejoin="round"/>
<path d="M64 318 H910" fill="none" stroke="#333333" stroke-width="2.5"/>
</g></g>
<path d="M64 272 H490" stroke="#446ce3" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M64 232 V284 H490 M64 314 V366 H490" fill="none" stroke="#444444" stroke-width="1.2"/>
<text x="58" y="240" font-size="12" fill="#5c5c5c" text-anchor="end">20 A</text>
<text x="58" y="276" font-size="12" font-weight="700" fill="#446ce3" text-anchor="end">5 A</text>
<text x="58" y="322" font-size="12" fill="#5c5c5c" text-anchor="end">20 A</text>
<text x="58" y="370" font-size="12" fill="#5c5c5c" text-anchor="end">0</text>
<text x="486" y="226" font-size="12" font-weight="700" fill="#446ce3" text-anchor="end">average 5 A</text>
<line x1="490" y1="230" x2="490" y2="368" stroke="#222222" stroke-width="1.5"/>
<text x="490" y="384" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">now</text>
<text x="16" y="404" font-size="13" font-weight="700" fill="#222222">Battery current = motor current × output: 20 A × 25% = 5 A.</text>
<text x="16" y="423" font-size="12" fill="#5c5c5c">So a motor stalled at low output can be hot while its breaker never notices.</text>
</svg>
