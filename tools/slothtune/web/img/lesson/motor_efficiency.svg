<text x="260" y="370" font-size="22" font-weight="700" fill="#222222" text-anchor="middle"><tspan fill="#446ce3">power in</tspan> = <tspan fill="#1a7f37">power out</tspan> + <tspan fill="#c62828">heat</tspan></text>
<text x="16" y="398" font-size="14" fill="#222222"><tspan font-weight="700">efficiency</tspan> = power out ÷ power in</text>
<text class="me-t1" x="504" y="398" font-size="14" font-weight="700" fill="#222222" text-anchor="end" data-ov="eff">here: almost none</text>
<text class="me-t2" x="504" y="398" font-size="14" font-weight="700" fill="#222222" text-anchor="end" data-ov="eff">here: about half</text>
<text class="me-t3" x="504" y="398" font-size="14" font-weight="700" fill="#222222" text-anchor="end" data-ov="eff">here: none</text>
<text x="16" y="424" font-size="12" fill="#5c5c5c">Twice the current, four times the heat: that is why a stall cooks a motor in seconds.</text>
</svg>
