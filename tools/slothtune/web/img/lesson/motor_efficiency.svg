<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 444" width="520" height="444" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="me-title me-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="me-title">Power in, power out, and heat</title>
<desc id="me-desc">Animated. A power-flow diagram for a NEO V1.1 at 12 V. A blue arrow, power in (volts times amps), enters the motor and splits into a green arrow, power out (torque times speed), that drives a wheel, and a wavy red arrow, heat, rising out of the copper windings. It cycles through three points. Spinning free: about 1.8 A, about 22 W in, almost nothing out and a little heat, with the wheel spinning fastest. At its most power, half its free speed: about half of what goes in comes out as work and the rest is heat, with the wheel at half speed. Stalled: 105 A, about 1,260 W in, nothing out and all 1,260 W as heat; the wheel is still and the windings glow hot. Below: power in = power out + heat, and efficiency = power out divided by power in.</desc>
