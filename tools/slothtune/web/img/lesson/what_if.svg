<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 426" width="520" height="426" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="wi-title wi-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="wi-title">What if: your own run, replayed with new gains</title>
<desc id="wi-desc">Animated. Four steps across the top light up in turn: 1, your run, the step you ran; 2, fit a model, kS, kV and kA from that run; 3, replay it with the same gains and see whether it matches; 4, new gains, the same setpoints run on the model with the SPARK's own controller rules. Below, a graph of speed over time with a dashed setpoint step: your measured run draws in orange; the replay with the same gains draws in dashed gray almost on top of it, and a label says a close match means you can trust the prediction more; then the prediction with your new gains draws in teal, rising faster with a small overshoot. Below: the model leaves out backlash, battery sag and grip changes, so treat a big change as a hint and run it for real; the robot has the final word.</desc>
<style>
.wi-b1 { opacity: 0; animation: wi-b1 8s linear infinite; }
@keyframes wi-b1 { 0% { opacity: 0; } 1.5%, 22% { opacity: 1; } 24%, 100% { opacity: 0; } }
.wi-b2 { opacity: 0; animation: wi-b2 8s linear infinite; }
@keyframes wi-b2 { 0%, 22% { opacity: 0; } 24%, 36% { opacity: 1; } 38%, 100% { opacity: 0; } }
.wi-b3 { opacity: 0; animation: wi-b3 8s linear infinite; }
@keyframes wi-b3 { 0%, 36% { opacity: 0; } 38%, 58% { opacity: 1; } 60%, 100% { opacity: 0; } }
.wi-b4 { opacity: 0; animation: wi-b4 8s linear infinite; }
@keyframes wi-b4 { 0%, 58% { opacity: 0; } 60%, 84% { opacity: 1; } 86%, 100% { opacity: 0; } }
.wi-w1, .wi-w2, .wi-w3 { transform: translateX(0px); }
.wi-w1 { animation: wi-w1 8s linear infinite; }
@keyframes wi-w1 { 0%, 2% { transform: translateX(-440px); } 20%, 100% { transform: translateX(0px); } }
.wi-w2 { animation: wi-w2 8s linear infinite; }
@keyframes wi-w2 { 0%, 38% { transform: translateX(-440px); } 54%, 100% { transform: translateX(0px); } }
.wi-w3 { animation: wi-w3 8s linear infinite; }
@keyframes wi-w3 { 0%, 60% { transform: translateX(-440px); } 78%, 100% { transform: translateX(0px); } }
.wi-fade { animation: wi-fade 8s linear infinite; }
@keyframes wi-fade { 0%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
.wi-lbl { opacity: 1; animation: wi-lbl 8s linear infinite; }
@keyframes wi-lbl { 0%, 54% { opacity: 0; } 56%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">What if: your own run, replayed with new gains</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Good for direction and rough size. The robot has the final word.</text>
<rect x="16" y="60" width="111" height="64" rx="6" fill="#ffffff" stroke="#b0b8c0" stroke-width="1.2"/>
<rect class="wi-b1" x="16" y="60" width="111" height="64" rx="6" fill="#edf2fd" stroke="#446ce3" stroke-width="2.5"/>
<text x="24" y="79" font-size="13" font-weight="700" fill="#222222">1 Your run</text>
<text x="24" y="97" font-size="12" fill="#222222">the step you ran</text>
<path d="M131 85L137 92L131 99" fill="none" stroke="#5c5c5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="141" y="60" width="111" height="64" rx="6" fill="#ffffff" stroke="#b0b8c0" stroke-width="1.2"/>
<rect class="wi-b2" x="141" y="60" width="111" height="64" rx="6" fill="#edf2fd" stroke="#446ce3" stroke-width="2.5"/>
<text x="149" y="79" font-size="13" font-weight="700" fill="#222222">2 Fit a model</text>
<text x="149" y="97" font-size="12" fill="#222222">kS, kV and kA</text>
<text x="149" y="113" font-size="12" fill="#222222">from that run</text>
<path d="M256 85L262 92L256 99" fill="none" stroke="#5c5c5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="266" y="60" width="111" height="64" rx="6" fill="#ffffff" stroke="#b0b8c0" stroke-width="1.2"/>
<rect class="wi-b3" x="266" y="60" width="111" height="64" rx="6" fill="#edf2fd" stroke="#446ce3" stroke-width="2.5"/>
<text x="274" y="79" font-size="13" font-weight="700" fill="#222222">3 Replay it</text>
<text x="274" y="97" font-size="12" fill="#222222">same gains:</text>
<text x="274" y="113" font-size="12" fill="#222222">does it match?</text>
<path d="M381 85L387 92L381 99" fill="none" stroke="#5c5c5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="391" y="60" width="111" height="64" rx="6" fill="#ffffff" stroke="#b0b8c0" stroke-width="1.2"/>
<rect class="wi-b4" x="391" y="60" width="111" height="64" rx="6" fill="#edf2fd" stroke="#446ce3" stroke-width="2.5"/>
<text x="399" y="79" font-size="13" font-weight="700" fill="#222222">4 New gains</text>
<text x="399" y="97" font-size="12" fill="#222222">same setpoints,</text>
<text x="399" y="113" font-size="12" fill="#222222">SPARK's own rules</text>
<path d="M70 150V324H500" fill="none" stroke="#444444" stroke-width="1.2"/>
<text x="62" y="162" font-size="12" fill="#5c5c5c" text-anchor="end">speed</text>
<text x="500" y="340" font-size="12" fill="#5c5c5c" text-anchor="end">time →</text>
