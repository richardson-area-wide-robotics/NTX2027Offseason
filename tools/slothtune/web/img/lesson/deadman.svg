<text x="208" y="106" font-size="13" font-weight="700" fill="#446ce3">right bumper</text>
<text x="208" y="122" font-size="12" fill="#222222">the tester's joystick,</text>
<text x="208" y="137" font-size="12" fill="#5c5c5c">Driver Station port 1</text>
