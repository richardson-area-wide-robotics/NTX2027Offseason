<g class="dm-finger"><rect x="156" y="64" width="22" height="50" rx="11" fill="#f0d2b6" stroke="#444444" stroke-width="1.5"/><rect x="160" y="96" width="14" height="13" rx="5" fill="#f8e6d8" stroke="#444444" stroke-width="1"/></g>
