<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 416" width="520" height="416" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="dm-title dm-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="dm-title">Deadman: the robot moves only while it is held</title>
<desc id="dm-desc">Animated. Left: a game controller seen from above, the tester's joystick on Driver Station port 1, with its right bumper marked. A finger presses the right bumper and it lights up blue; right: a wheel spins while it is held, with the label 'held: it may move'. When the finger lets go, the wheel stops at once and the label reads 'let go: it stops'. Below, a timeline traces the same thing: the held line steps up and down, and the wheel speed is up only while the bumper is held, falling to zero right after it is let go. At the bottom: the on-screen Hold to run button, used with the mouse or a finger, is also allowed; a keyboard key is never used, because in the Driver Station the space bar is E-STOP.</desc>
<style>
.dm-finger { transform: translateY(0px); animation: dm-finger 8s linear infinite; }
@keyframes dm-finger { 0%, 13% { transform: translateY(-10px); } 15%, 58.5% { transform: translateY(0px); } 60.5%, 100% { transform: translateY(-10px); } }
.dm-on { opacity: 1; animation: dm-on 8s linear infinite; }
@keyframes dm-on { 0%, 14% { opacity: 0; } 15%, 59.5% { opacity: 1; } 60.5%, 100% { opacity: 0; } }
.dm-off { opacity: 0; animation: dm-off 8s linear infinite; }
@keyframes dm-off { 0%, 14% { opacity: 1; } 15%, 59.5% { opacity: 0; } 60.5%, 100% { opacity: 1; } }
.dm-spin { transform-box: view-box; transform-origin: 0 0; animation: dm-spin 8s linear infinite; }
@keyframes dm-spin { 0%, 15% { transform: rotate(0deg); } 18.5% { transform: rotate(29deg); } 22% { transform: rotate(117deg); } 60% { transform: rotate(1390deg); } 61.5% { transform: rotate(1427deg); } 63%, 100% { transform: rotate(1440deg); } }
.dm-cur { opacity: 0; animation: dm-cur 8s linear infinite; }
@keyframes dm-cur { 0% { transform: translateX(0px); opacity: 1; } 97% { transform: translateX(358.9px); opacity: 1; } 99%, 100% { transform: translateX(370px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Deadman: the robot moves only while it is held</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Let go and it stops. Prefer the bumper: stand where you see every wheel.</text>
