<g class="dm-on"><g><path d="M373.26 129.53A54 54 0 0 1 433.29 94.81" fill="none" stroke="#446ce3" stroke-width="2.5"/><path d="M437.98 95.84L429.08 98.12L431.41 89.42Z" fill="#446ce3"/></g><g><path d="M474.74 166.47A54 54 0 0 1 414.71 201.19" fill="none" stroke="#446ce3" stroke-width="2.5"/><path d="M410.02 200.16L418.92 197.88L416.59 206.58Z" fill="#446ce3"/></g></g>
<text x="424" y="226" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle" class="dm-on">held: it may move</text>
<text x="424" y="226" font-size="13" font-weight="700" fill="#c62828" text-anchor="middle" class="dm-off">let go: it stops</text>
