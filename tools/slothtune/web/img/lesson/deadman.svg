<text x="369.1" y="314" font-size="12" font-weight="700" fill="#c62828">stops</text>
<text x="500" y="342" font-size="12" fill="#5c5c5c" text-anchor="end">time →</text>
<line class="dm-cur" x1="130" y1="248" x2="130" y2="330" stroke="#444444" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="16" y1="352" x2="504" y2="352" stroke="#e2e2e2"/>
<rect x="16" y="364" width="92" height="32" rx="6" fill="#446ce3"/>
<text x="62" y="385" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Hold to run</text>
<text x="118" y="374" font-size="12" font-weight="700" fill="#1a7f37">Also OK: Hold to run</text>
<text x="118" y="390" font-size="12" fill="#222222">on screen, with the</text>
<text x="118" y="406" font-size="12" fill="#222222">mouse or a finger.</text>
<rect x="268" y="364" width="84" height="32" rx="5" fill="#f2f4f6" stroke="#444444" stroke-width="1.5"/>
<text x="310" y="385" font-size="12" fill="#222222" text-anchor="middle">space bar</text>
<circle cx="350" cy="364" r="9" fill="#c62828"/><path d="M346 360L354 368M354 360L346 368" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<text x="368" y="374" font-size="12" font-weight="700" fill="#c62828">Never a key: in the</text>
<text x="368" y="390" font-size="12" fill="#222222">Driver Station the</text>
<text x="368" y="406" font-size="12" fill="#222222">space bar is E-STOP.</text>
</svg>
