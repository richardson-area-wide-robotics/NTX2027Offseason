<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 418" width="520" height="418" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="spark_firmware-title spark_firmware-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="spark_firmware-title">SPARK firmware: update it, match it, check it</title>
<desc id="spark_firmware-desc">Animated. A laptop running REV Hardware Client 2 is plugged by USB-C into the PDH, which passes the update over the CAN bus to four SPARKs in turn: a SPARK Flex, a SPARK MAX, a Flex and a MAX. As each one receives its update, its light blinks white and yellow, then a green check and its new firmware version appear: 26.1.6 on a SPARK Flex and 26.1.5 on a SPARK MAX, the newest 2026 firmware. Below, a table matches the library to the firmware: robot code on REVLib 2026 wants 2026 firmware, version 26; REVLib 2027 goes with firmware 27.0.0, released October 29, 2026, which removes the conversion factors 2026 code relies on, so keep 26 until the code moves to 2027. Last, three ways to check: REV Hardware Client 2's summary for each device, Sloth Tune's Motors tab, and REVLib 2026.0.5's warning when a SPARK is not on 2026 firmware.</desc>
