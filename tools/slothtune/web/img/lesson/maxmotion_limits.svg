<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392" width="520" height="392" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="maxmotion_limits-title maxmotion_limits-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="maxmotion_limits-title">MAXMotion's limits from the model</title>
<desc id="maxmotion_limits-desc">Animated, left to right. A battery bar, measured under load, fills to 80%, the volts the tool plans with; the top 20% is hatched. An arrow turns those volts into a top speed: (volts − kS − kG) / kV. A top-speed bar fills to 80%, the cruise speed; its top 20% is hatched too. Then the speed-time profile is drawn: it speeds up, cruises at that 80% level under the dashed top speed, and slows down. What's left over is kept for feedback. Acceleration is limited by the volts left at cruise and by the current limit: the smaller wins, less 20%.</desc>
<style>
.mm-af{animation:mm-af 8s linear infinite}
@keyframes mm-af{0%,4%{transform:translateY(264px) scaleY(0) translateY(-264px)}18%{transform:translateY(264px) scaleY(1) translateY(-264px)}96%{transform:translateY(264px) scaleY(1) translateY(-264px);opacity:1}99%{transform:translateY(264px) scaleY(1) translateY(-264px);opacity:0}100%{transform:translateY(264px) scaleY(0) translateY(-264px);opacity:0}}
.mm-ah{animation:mm-ah 8s linear infinite}
@keyframes mm-ah{0%,19%{opacity:0}20.5%,96%{opacity:1}99%,100%{opacity:0}}
.mm-aft{animation:mm-aft 8s linear infinite}
@keyframes mm-aft{0%,16%{opacity:0}17.5%,96%{opacity:1}99%,100%{opacity:0}}
.mm-aht{animation:mm-aht 8s linear infinite}
@keyframes mm-aht{0%,19%{opacity:0}20.5%,96%{opacity:1}99%,100%{opacity:0}}
.mm-bf{animation:mm-bf 8s linear infinite}
@keyframes mm-bf{0%,38%{transform:translateY(264px) scaleY(0) translateY(-264px)}52%{transform:translateY(264px) scaleY(1) translateY(-264px)}96%{transform:translateY(264px) scaleY(1) translateY(-264px);opacity:1}99%{transform:translateY(264px) scaleY(1) translateY(-264px);opacity:0}100%{transform:translateY(264px) scaleY(0) translateY(-264px);opacity:0}}
.mm-bh{animation:mm-bh 8s linear infinite}
@keyframes mm-bh{0%,53%{opacity:0}54.5%,96%{opacity:1}99%,100%{opacity:0}}
.mm-bft{animation:mm-bft 8s linear infinite}
@keyframes mm-bft{0%,50%{opacity:0}51.5%,96%{opacity:1}99%,100%{opacity:0}}
.mm-bht{animation:mm-bht 8s linear infinite}
@keyframes mm-bht{0%,53%{opacity:0}54.5%,96%{opacity:1}99%,100%{opacity:0}}
.mm-ar{animation:mm-ar 8s linear infinite}
@keyframes mm-ar{0%,24%{opacity:0}25.5%,96%{opacity:1}99%,100%{opacity:0}}
.mm-cn{animation:mm-cn 8s linear infinite}
@keyframes mm-cn{0%,55%{opacity:0}56.5%,96%{opacity:1}99%,100%{opacity:0}}
.mm-pw{animation:mm-pw 8s linear infinite}
@keyframes mm-pw{0%,58%{transform:translateX(-172px)}82%,100%{transform:translateX(0px)}}
.mm-pf{animation:mm-pf 8s linear infinite}
@keyframes mm-pf{0%,96%{opacity:1}99%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">MAXMotion's limits from the model</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Plan with 80% of the battery, then cruise at 80% of the top speed that gives.</text>

<defs><pattern id="mm-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#b0b8c0" stroke-width="2.5"/></pattern></defs>
<rect x="40" y="84" width="52" height="180" fill="#ffffff"/><rect class="mm-ah" x="40" y="84" width="52" height="36" fill="url(#mm-hatch)"/><rect class="mm-af" x="40" y="120" width="52" height="144" fill="#1a7f37"/><rect x="40" y="84" width="52" height="180" fill="none" stroke="#444444" stroke-width="1.8"/><g class="mm-aft"><text x="66" y="197" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">80%</text></g><g class="mm-aht"><text x="66" y="106.5" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">20%</text></g><text x="66" y="284" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">battery</text><text x="66" y="300" font-size="12" fill="#5c5c5c" text-anchor="middle">under load</text>
<rect x="250" y="84" width="52" height="180" fill="#ffffff"/><rect class="mm-bh" x="250" y="84" width="52" height="36" fill="url(#mm-hatch)"/><rect class="mm-bf" x="250" y="120" width="52" height="144" fill="#446ce3"/><rect x="250" y="84" width="52" height="180" fill="none" stroke="#446ce3" stroke-dasharray="5 3" stroke-width="1.8"/><g class="mm-bft"><text x="276" y="197" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">80%</text></g><g class="mm-bht"><text x="276" y="106.5" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">20%</text></g><text x="276" y="284" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">top speed</text><text x="276" y="300" font-size="12" fill="#5c5c5c" text-anchor="middle">those volts give</text>

<g class="mm-ar"><line x1="100" y1="142" x2="236" y2="142" stroke="#222222" stroke-width="2.2"/><path d="M235.2 137.2L244 142L235.2 146.8Z" fill="#222222"/></g>
<text x="171" y="168" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">top speed =</text>
<text x="171" y="184" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">(volts − kS − kG) / kV</text>
<line class="mm-cn" x1="304" y1="120" x2="334" y2="120" stroke="#446ce3" stroke-width="1.4" stroke-dasharray="2 3"/>
<path d="M336 78V264H500" fill="none" stroke="#444444" stroke-width="1.4"/>
<line x1="336" y1="84" x2="496" y2="84" stroke="#446ce3" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="496" y="78" font-size="12" fill="#446ce3" text-anchor="end">top speed</text>
<clipPath id="mm-pc"><rect class="mm-pw" x="336" y="80" width="164" height="188"/></clipPath>
<g class="mm-pf" clip-path="url(#mm-pc)"><path d="M336 263 L386 120 L448 120 L494 263" fill="rgba(68,108,227,0.08)" stroke="#446ce3" stroke-width="2.8" stroke-dasharray="7 4" stroke-linejoin="round"/></g>
<text x="417" y="112" font-size="12" font-weight="700" fill="#446ce3" text-anchor="middle">cruise</text>
<text x="372" y="192" font-size="12" fill="#5c5c5c">slope:</text>
<text x="372" y="208" font-size="12" font-weight="700" fill="#222222">acceleration</text>
<text x="500" y="284" font-size="12" fill="#5c5c5c" text-anchor="end">time</text>
<text x="342" y="102" font-size="12" fill="#5c5c5c">speed</text>
<line x1="16" y1="316" x2="504" y2="316" stroke="#d6d6d6"/>
<text x="16" y="336" font-size="13" font-weight="700" fill="#222222">What's left over is kept for feedback.</text>
<text x="16" y="356" font-size="12" fill="#5c5c5c">Acceleration is limited by the volts left at cruise and by the current limit:</text>
<text x="16" y="372" font-size="12" fill="#5c5c5c">the smaller wins, less 20%.</text>
</svg>
