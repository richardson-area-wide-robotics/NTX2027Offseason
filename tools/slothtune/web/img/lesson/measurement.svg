<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" width="520" height="372" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="measurement-title measurement-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="measurement-title">Measurement: what the sensor says</title>
<desc id="measurement-desc">Animated graph drawn left to right. A thick light gray line shows what really happens: a smooth rise. The solid orange line, the measurement, is what the sensor says: a staircase of readings that starts to rise a little after the real motion does, marked 'a little late', and moves in steps, marked 'a little coarse'. The measurement is WPILib's process variable, y(t). The controller only knows what its sensor tells it, so it cannot react to anything faster than its sensor can see.</desc>
