<g transform="translate(300 121)"><g class="sm-steer"><rect x="-12" y="-32" width="24" height="64" rx="5" fill="#3a3f45"/><g clip-path="url(#sm-wclip)"><g class="sm-tread"><path d="M-12 -40H12M-12 -32H12M-12 -24H12M-12 -16H12M-12 -8H12M-12 0H12M-12 8H12M-12 16H12M-12 24H12M-12 32H12M-12 40H12M-12 48H12M-12 56H12M-12 64H12M-12 72H12M-12 80H12M-12 88H12M-12 96H12M-12 104H12" stroke="#5d646b" stroke-width="2"/></g></g><circle r="4" fill="#b0b8c0"/><path d="M0 -27L-5 -19H5Z" fill="#ffffff"/></g></g>
<circle cx="250" cy="74" r="9" fill="#446ce3"/><text x="250" y="78.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="358" y="84" font-size="13" font-weight="700" fill="#446ce3">Steering: an angle</text>
<text x="358" y="103" font-size="12" fill="#222222">a position loop,</text>
<text x="358" y="119" font-size="12" fill="#222222">like WPILib's turret</text>
<text x="358" y="135" font-size="12" fill="#222222">tutorial</text>
<text x="358" y="157" font-size="12" fill="#5c5c5c">dashed: the target</text>
<line x1="256" y1="280" x2="344" y2="280" stroke="#444444" stroke-width="1.5"/><path d="M266 280l-6 7M278 280l-6 7M290 280l-6 7M302 280l-6 7M314 280l-6 7M326 280l-6 7M338 280l-6 7" stroke="#b0b8c0" stroke-width="1.2"/>
<g transform="translate(300 244)"><g class="sm-drive"><circle r="35" fill="#3a3f45"/><circle r="27.3" fill="#b0b8c0" stroke="#444444" stroke-width="1.2"/><path d="M8.49 4.9L20.61 11.9M0 9.8L0 23.8M-8.49 4.9L-20.61 11.9M-8.49 -4.9L-20.61 -11.9M0 -9.8L0 -23.8M8.49 -4.9L20.61 -11.9" stroke="#444444" stroke-width="4.2" stroke-linecap="round"/><circle r="8.4" fill="#7d8790" stroke="#444444" stroke-width="1.2"/><circle cx="31.15" r="2.45" fill="#ffffff"/></g></g>
<g><path d="M259.59 229.29A43 43 0 0 1 302.7 201.09" fill="none" stroke="#0f766e" stroke-width="2.5"/><path d="M307.47 201.65L298.81 204.7L300.37 195.83Z" fill="#0f766e"/></g>
<circle cx="250" cy="204" r="9" fill="#0f766e"/><text x="250" y="208.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="358" y="214" font-size="13" font-weight="700" fill="#0f766e">Drive: a speed</text>
<text x="358" y="233" font-size="12" fill="#222222">a velocity loop,</text>
<text x="358" y="249" font-size="12" fill="#222222">like its flywheel</text>
<text x="358" y="265" font-size="12" fill="#222222">tutorial</text>
<line x1="16" y1="330" x2="504" y2="330" stroke="#e2e2e2"/>
<text x="16" y="350" font-size="13" fill="#222222"><tspan font-weight="700">Tune steering first:</tspan> a drive loop can't be judged while the wheel</text>
<text x="16" y="368" font-size="13" fill="#222222">points the wrong way.</text>
</svg>
