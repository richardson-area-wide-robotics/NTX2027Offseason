<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="sim-title sim-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="sim-title">The simulator: your code, pretend physics</title>
<desc id="sim-desc">Animated. At the top, one card: your robot code. Arrows carry the same code to two places. Left, the simulator on this laptop, with a physics model of the drivetrain: its graph draws a smooth measured curve that rises to the dashed setpoint, because its sensors are perfect: no noise, no backlash, no carpet, no battery sag. Right, the real robot: its graph draws the same kind of curve, but jagged with noise. Below: nothing real moves in the simulator, so it is a good place to learn each test and check code changes; gains that pass there still need tuning on the robot, so simulator runs never tick a Guide step.</desc>
<style>
.sim-tr { stroke-dasharray: 1000; animation: sim-tr 8s linear infinite; }
@keyframes sim-tr { 0%, 14% { stroke-dashoffset: 1000; opacity: 1; } 70%, 92% { stroke-dashoffset: 0; opacity: 1; } 97%, 100% { stroke-dashoffset: 0; opacity: 0; } }
.sim-d1 { opacity: 0; animation: sim-d1 8s ease-in-out infinite; }
@keyframes sim-d1 { 0% { transform: translate(0px, 0px); opacity: 0; } 2% { transform: translate(0px, 0px); opacity: 1; } 12% { transform: translate(-70px, 26px); opacity: 1; } 14%, 100% { transform: translate(-70px, 26px); opacity: 0; } }
.sim-d2 { opacity: 0; animation: sim-d2 8s ease-in-out infinite; }
@keyframes sim-d2 { 0% { transform: translate(0px, 0px); opacity: 0; } 2% { transform: translate(0px, 0px); opacity: 1; } 12% { transform: translate(70px, 26px); opacity: 1; } 14%, 100% { transform: translate(70px, 26px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
