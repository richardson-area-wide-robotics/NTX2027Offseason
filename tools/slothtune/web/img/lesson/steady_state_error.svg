<text x="16" y="366" font-size="13" fill="#222222">Near the target the error is small, so P is small. If friction needs more</text>
<text x="16" y="384" font-size="13" fill="#222222">than P provides, the motion stops short and stays there.</text>
<text x="16" y="402" font-size="13" fill="#222222"><tspan font-weight="700">Fixes, in order:</tspan> a little more kP; on drive, measure the feedforward;</text>
<text x="16" y="420" font-size="13" fill="#222222">last, a tiny kI with an IZone.</text>
</svg>
