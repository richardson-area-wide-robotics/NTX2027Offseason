<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 434" width="520" height="434" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="steady_state_error-title steady_state_error-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="steady_state_error-title">Steady-state error: what's left when it stops</title>
<desc id="steady_state_error-desc">Animated graph. The dashed setpoint jumps to the target and the solid measured line moves toward it, slows, and stops short; the gap left between it and the target is shaded and labeled left over. Below, a bar for P's push starts full when the setpoint jumps and shrinks as the error shrinks; a red mark shows how much friction needs. When the bar falls below the mark, the motion stops short and stays there. Fixes, in order: a little more kP; on drive, measure the feedforward; last, a tiny kI with an IZone.</desc>
