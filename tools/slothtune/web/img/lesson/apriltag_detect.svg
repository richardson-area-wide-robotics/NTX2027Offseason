<text x="306" y="90" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="322" y="90" font-size="12" fill="#222222">Find the black square.</text>
<rect class="at-h2" x="292" y="115" width="212" height="21" rx="4" fill="#e8eefc"/>
<circle cx="306" cy="125.5" r="9" fill="#446ce3"/>
<text x="306" y="130" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="322" y="130" font-size="12" fill="#222222">Mark its four corners.</text>
<rect class="at-h3" x="292" y="155" width="212" height="37" rx="4" fill="#e8eefc"/>
<circle cx="306" cy="165.5" r="9" fill="#446ce3"/>
<text x="306" y="170" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="322" y="170" font-size="12" fill="#222222">Read the 6 by 6 squares</text>
<text x="322" y="186" font-size="12" fill="#222222">inside: the tag's number.</text>
<rect class="at-h4" x="292" y="211" width="212" height="53" rx="4" fill="#e8eefc"/>
<circle cx="306" cy="221.5" r="9" fill="#446ce3"/>
<text x="306" y="226" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="322" y="226" font-size="12" fill="#222222">From where the corners land,</text>
<text x="322" y="242" font-size="12" fill="#222222">the tag's real size and the</text>
<text x="322" y="258" font-size="12" fill="#222222">lens: where the camera is.</text>
<line x1="16" y1="322" x2="504" y2="322" stroke="#d6d6d6" stroke-width="1"/>
<text x="16" y="342" font-size="12" fill="#5c5c5c">Ambiguity: two poses can put the corners in almost the same spots.</text>
<text x="16" y="358" font-size="12" fill="#5c5c5c">PhotonVision suggests ignoring single tags with ambiguity over 0.2.</text>
<text x="16" y="374" font-size="12" fill="#5c5c5c">Seeing several tags at once removes it.</text>
