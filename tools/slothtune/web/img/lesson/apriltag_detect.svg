<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384" width="520" height="384" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="at-title at-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="at-title">How a camera finds a tag</title>
<desc id="at-desc">Animated, four steps. In the camera's picture of an AprilTag seen at an angle: one, the tag's black square is outlined; two, its four corners are marked; three, the 6 by 6 squares inside it are read row by row, which gives the tag's number; four, lines run from the four corners back to the camera: from where the corners land in the picture, the tag's real size and the lens, the camera works out where it is. Ambiguity: two poses can put the corners in almost the same spots; PhotonVision suggests ignoring single tags with ambiguity over 0.2.</desc>
