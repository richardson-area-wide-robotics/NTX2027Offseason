<line x1="185" y1="140" x2="185" y2="154" stroke="#444444" stroke-width="1.6"/><path d="M185 160 L181.15 153 L188.85 153Z" fill="#444444"/><path d="M185 138 L188.85 145 L181.15 145Z" fill="#444444"/>
