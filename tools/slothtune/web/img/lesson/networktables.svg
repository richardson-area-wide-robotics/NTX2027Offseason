<g class="nt-c0"><rect x="-9" y="-7" width="18" height="14" rx="2" fill="#446ce3" stroke="#ffffff" stroke-width="1.5"/><path d="M-5 -2 H5 M-5 2 H3" stroke="#ffffff" stroke-width="1.3"/></g>
<g class="nt-c1"><rect x="-9" y="-7" width="18" height="14" rx="2" fill="#446ce3" stroke="#ffffff" stroke-width="1.5"/><path d="M-5 -2 H5 M-5 2 H3" stroke="#ffffff" stroke-width="1.3"/></g>
<g class="nt-c2"><rect x="-9" y="-7" width="18" height="14" rx="2" fill="#446ce3" stroke="#ffffff" stroke-width="1.5"/><path d="M-5 -2 H5 M-5 2 H3" stroke="#ffffff" stroke-width="1.3"/></g>
<g class="nt-req"><rect x="-9" y="-7" width="18" height="14" rx="2" fill="#1a7f37" stroke="#ffffff" stroke-width="1.5"/><path d="M-5 -2 H5 M-5 2 H3" stroke="#ffffff" stroke-width="1.3"/></g>
<g class="nt-sub"><rect x="-9" y="-7" width="18" height="14" rx="2" fill="#1a7f37" stroke="#ffffff" stroke-width="1.5"/><path d="M-5 -2 H5 M-5 2 H3" stroke="#ffffff" stroke-width="1.3"/></g>
<line x1="16" y1="312" x2="504" y2="312" stroke="#d6d6d6" stroke-width="1"/>
<text x="16" y="332" font-size="13" fill="#222222">Publish and subscribe: whoever has a value publishes it to a topic;</text>
<text x="16" y="350" font-size="13" fill="#222222">whoever wants it subscribes. Neither needs to know the other exists.</text>
<text x="16" y="367" font-size="12" fill="#5c5c5c">Clients connect by team number. Since 2023 it is NT4: a WebSocket on port 5810.</text>
</svg>
