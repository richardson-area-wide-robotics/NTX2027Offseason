<text x="16" y="47" font-size="12" fill="#5c5c5c">The robot program is the server; everything else is a client.</text>
<rect x="16" y="62" width="236" height="238" rx="10" fill="#f6f7f8" stroke="#9aa3ad" stroke-width="1.5"/>
