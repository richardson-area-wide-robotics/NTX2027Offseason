<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392" width="520" height="392" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="nt-title nt-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="nt-title">NetworkTables: a shared bulletin board</title>
<desc id="nt-desc">Animated. Left: the robot program, the server, on the roboRIO or SystemCore. Its robot code publishes to a bulletin board under /SlothTune holding notes for live readings, test results and gains. Right: three clients, the Driver Station laptop with its dashboards, this tool, and a coprocessor. A blue note goes from the robot code onto the board, then copies of it travel out to all three clients. Next this tool publishes a green request, start a test, which lands on the board, and the robot code, which subscribes to it, picks it up. Neither side needs to know the other exists.</desc>
