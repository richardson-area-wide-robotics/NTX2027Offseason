<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="can_bus-title can_bus-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="can_bus-title">The CAN bus: one pair past every device</title>
<desc id="can_bus-desc">Animated. One twisted pair of wires, CAN-H in the bus's own color (yellow on the first bus, never green) and CAN-L always green, runs from the robot controller (roboRIO or SystemCore) through three SPARK motor controllers to the far end, usually the PDH, with a terminator at each end. Inside each controller the two CAN connections are joined, so the cable passes straight through. First a SPARK in the middle sends a message: a glow spreads both ways along the cable and a light comes on at every device as it hears it. Then the robot controller sends one and every device down the chain hears that too. Every device hears every message.</desc>
