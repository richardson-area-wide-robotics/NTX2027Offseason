<text x="52" y="240" font-size="12" font-weight="700" fill="#222222">CAN-H (not green): the bus's own color, yellow on the first bus</text>
<rect x="16" y="252" width="26" height="8" rx="2" fill="#2e7d32" stroke="#444444"/>
<text x="52" y="260" font-size="12" font-weight="700" fill="#222222">CAN-L: always green</text>
<text x="16" y="290" font-size="13" fill="#222222">Each controller's two CAN plugs are joined inside, so the cable passes</text>
<text x="16" y="308" font-size="13" fill="#222222">straight through, even when that controller has no power. The chain runs</text>
<text x="16" y="326" font-size="13" fill="#222222">from the robot controller to the far end, usually the PDH.</text>
</svg>
