  <g class="de-rot"><circle r="22" fill="#333333"/>
    <line x1="0" y1="-4" x2="0" y2="-18" stroke="#c47a2c" stroke-width="5" stroke-linecap="round"/>
    <circle r="4" fill="#b0b8c0"/></g>
</g>
<text x="98" y="258" font-size="12" font-weight="700" fill="#222222">keeps working,</text>
<text x="98" y="273" font-size="12" fill="#5c5c5c">slower when derated</text>
<text x="250" y="70" font-size="12" font-weight="700" fill="#222222">temperature</text>
