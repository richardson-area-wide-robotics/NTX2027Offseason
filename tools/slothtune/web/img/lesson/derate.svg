<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396" width="520" height="396" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="de-title de-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="de-title">Derate: half the current, a quarter of the heat</title>
<desc id="de-desc">Animated. Left: a square whose side is the current and whose area is the heat. At full current it fills all four quarters; at half current it fills one, a quarter of the heat. A motor below keeps turning, slower while derated. Right: a graph of temperature rising to the line; there the current limit drops to half, and the temperature falls until it is 10 degrees (or 10 points) below the line, when the full limit comes back and the cycle repeats.</desc>
<style>
.de-x { animation: de-x 8s linear infinite; }
.de-yt { animation: de-yt 8s linear infinite; }
.de-yl { animation: de-yl 8s linear infinite; }
.de-sq { transform-box: fill-box; transform-origin: 0% 100%; transform: scale(0.5); animation: de-sq 8s linear infinite; }
.de-rf { animation: de-rf 8s linear infinite; }
.de-rh { animation: de-rh 8s linear infinite; }
.de-rot { transform-box: view-box; transform-origin: 0 0; animation: de-rot 8s linear infinite; }
