<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Derate: half the current, a quarter of the heat</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">The guard halves a hot motor's current limit so it can cool while still working.</text>
<text x="16" y="82" font-size="13" font-weight="700" fill="#222222">Heat grows as current squared</text>
<rect x="30" y="96" width="96" height="96" fill="#fbf3f3"/>
