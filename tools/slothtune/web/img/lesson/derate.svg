<g class="de-rf">
<text x="138" y="118" font-size="12" font-weight="700" fill="#222222">full current:</text>
<text x="138" y="133" font-size="12" fill="#5c5c5c">4 squares of heat</text>
</g>
<g class="de-rh">
<text x="138" y="172" font-size="12" font-weight="700" fill="#222222">half current:</text>
<text x="138" y="187" font-size="12" fill="#5c5c5c">1 square of heat</text>
</g>
<g transform="translate(58 262)">
