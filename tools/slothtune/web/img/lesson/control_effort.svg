<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="control_effort-title control_effort-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="control_effort-title">Control effort: the volts sent to the motor</title>
<desc id="control_effort-desc">Animated graph drawn left to right. A green line, the control effort in volts, rises from zero. The controller asks for more than the battery has, shown dotted above a dashed battery line, but the green line stops at the battery line and runs flat there, marked 'saturated: held at the battery'; then it comes down and holds a smaller value. Beside it a motor with a green push arrow that grows and shrinks with the volts at the cursor, and never passes the battery mark. A SPARK thinks in duty cycle, a fraction of the battery voltage; this tool shows volts so the parts add up and you can compare with the battery line.</desc>
