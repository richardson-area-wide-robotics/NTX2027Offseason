<rect width="100%" height="100%" fill="#ffffff"/>
<title id="cl-title">Current limit: a ceiling on the motor's current</title>
<desc id="cl-desc">Animated. Two graphs over time for a NEO V1.1 speeding up from a stop with its team limit of 60 A. Top: current. Without a limit (dotted gray) it would start far higher; with the limit (orange) it is held flat at the dashed 60 A line, then falls as the motor speeds up. Bottom: the voltage the SPARK applies, turned down at first to hold the limit and rising to full. A cursor with two dots sweeps across both. Beside them, the team limits: NEO 550 20 A, NEO V1.1 60 A, NEO 2.0 and Vortex 80 A.</desc>
