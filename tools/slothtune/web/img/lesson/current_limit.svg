<text x="16" y="342" font-size="13" fill="#222222">Current makes torque, torque makes acceleration, and heat.</text>
<text x="16" y="361" font-size="13" fill="#222222">The limit protects the motor and the wheels' grip, and caps acceleration.</text>
<text x="16" y="380" font-size="12" fill="#5c5c5c">On a drive motor, a limit above what the carpet can hold just spins the wheel.</text>
