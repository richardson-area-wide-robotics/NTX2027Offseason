<rect width="100%" height="100%" fill="#ffffff"/>
<title id="dead_time-title">Dead time: nothing moves yet</title>
<desc id="dead_time-desc">Animated graph. The dashed setpoint jumps up at the command, but the solid measured line stays flat while a shaded stretch labeled dead time grows behind the cursor; then it starts to move toward the target. Below, three steps light up in order while it waits: the setpoint reaches the controller, current builds in the windings, friction lets go. Gains can't remove dead time; a loop with more delay must be gentler, or it reacts to old news and oscillates.</desc>
