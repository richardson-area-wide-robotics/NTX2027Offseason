<text x="16" y="28" font-size="16" fill="#222222" font-weight="700">Ramp rate: the output can only change so fast</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Limits how quickly the output can change. In YAGSL it also slows every correction.</text>
