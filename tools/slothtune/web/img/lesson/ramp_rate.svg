<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" width="520" height="372" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="ramp_rate-title ramp_rate-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="ramp_rate-title">Ramp rate: the output can only change so fast</title>
<desc id="ramp_rate-desc">Animated graph. The dashed asked line jumps from 0 to full output, and later back to 0. The solid output line can only change so fast: with a ramp of 0.25 s it slopes up and takes a quarter second to reach full, and slopes back down the same way. The shaded gaps between asked and output are lag. For drive a ramp can smooth starts; for steering it adds pure lag to every correction, which hurts, so it is usually 0 for steering.</desc>
