<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="to-title to-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="to-title">Thermal override: hold on at the end of a match</title>
<desc id="to-desc">Animated. Two lanes show a motor's current near the end of a match. Without the override, the heat SHUTOFF turns the motor off. With the override, the shutoff is held at DERATE, half current, for up to 20 s, and the motor keeps turning slower until it goes off. A small motor in each lane stops or slows to match. Below: the hold never goes past 20 s, a sensor 10 °C over shutoff, or a 95% heat estimate, and it never lifts a stall cut.</desc>
<style>
