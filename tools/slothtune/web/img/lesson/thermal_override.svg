<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Thermal override: hold on at the end of a match</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Sometimes losing the motor costs more than the motor.</text>
<line x1="210" y1="80" x2="210" y2="246" stroke="#c62828" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="210" y="72" font-size="12" font-weight="700" fill="#c62828" text-anchor="middle">heat SHUTOFF</text>
