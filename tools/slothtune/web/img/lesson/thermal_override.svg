.to-x { animation: to-x 8s linear infinite; }
.to-ya { animation: to-ya 8s linear infinite; }
.to-yb { animation: to-yb 8s linear infinite; }
.to-spin { transform-box: view-box; transform-origin: 0 0; }
.to-ra { animation: to-ra 8s linear infinite; }
.to-rb { animation: to-rb 8s linear infinite; }
@keyframes to-fade {
  0% { opacity: 0; }
