  68.57% { opacity: 0.25; }
  69.57% { opacity: 1; }
  90% { opacity: 1; }
  97% { opacity: 0.25; }
  100% { opacity: 0.25; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" fill="#222222" font-weight="700">How fresh a value is</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Changes go out in batches, about every 100 ms, so a dashboard is a little behind.</text>
<line x1="16" y1="68" x2="40" y2="68" stroke="#446ce3" stroke-width="3"/><text x="46" y="72" font-size="12" fill="#222222">on the robot, as it happens</text>
