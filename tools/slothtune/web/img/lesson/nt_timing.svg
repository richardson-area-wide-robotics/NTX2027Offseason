<g class="tm-note"><rect x="226" y="186" width="168" height="33" fill="#ffffff"/><line x1="310" y1="186" x2="310" y2="172.23" stroke="#5c5c5c" stroke-width="1.2"/><text x="310" y="199" font-size="12" fill="#5c5c5c" text-anchor="middle">came and went between sends:</text><text x="310" y="214" font-size="12" fill="#5c5c5c" text-anchor="middle">the dashboard never saw it</text></g>
