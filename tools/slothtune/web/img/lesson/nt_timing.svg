<line x1="16" y1="290" x2="504" y2="290" stroke="#d6d6d6" stroke-width="1"/>
<text x="16" y="310" font-size="13" fill="#222222">Each batch carries the newest value and the time it was published.</text>
<text x="16" y="328" font-size="13" fill="#222222">A reader can ask for faster, or for every value (sendAll).</text>
<text x="16" y="345" font-size="12" fill="#5c5c5c">So the tool's tests record on the robot, a row every robot loop,</text>
<text x="16" y="362" font-size="12" fill="#5c5c5c">and send the whole run afterwards.</text>
</svg>
