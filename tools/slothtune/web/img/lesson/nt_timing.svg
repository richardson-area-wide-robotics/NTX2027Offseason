  0% { opacity: 0.25; }
  22.86% { opacity: 0.25; }
  23.86% { opacity: 1; }
  90% { opacity: 1; }
  97% { opacity: 0.25; }
  100% { opacity: 0.25; }
}
.tm-e2 { animation: tm-e2 8s linear infinite; }
@keyframes tm-e2 {
  0% { opacity: 0.25; }
  38.1% { opacity: 0.25; }
  39.1% { opacity: 1; }
  90% { opacity: 1; }
  97% { opacity: 0.25; }
  100% { opacity: 0.25; }
}
.tm-e3 { animation: tm-e3 8s linear infinite; }
@keyframes tm-e3 {
