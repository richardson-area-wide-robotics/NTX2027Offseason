<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384" width="520" height="384" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="tm-title tm-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="tm-title">How fresh a value is</title>
<desc id="tm-desc">Animated. A graph of one value against time. The blue line is the value on the robot, as it happens: it rises quickly, overshoots a little, settles, dips briefly and comes back, then falls. The orange line is what a dashboard shows: it moves in steps, and each step comes a little after the blue line, because the changes are collected and sent in a batch about every 100 ms, marked by an envelope under the time axis that lights up as each batch goes. The brief dip comes and goes between two sends, so the dashboard never shows it. A cursor sweeps left to right, drawing both lines.</desc>
<style>
.tm-wipe { animation: tm-wipe 8s linear infinite; }
@keyframes tm-wipe {
  0% { transform: translateX(-420px); }
  80% { transform: translateX(0); }
  100% { transform: translateX(0); }
}
.tm-fade { animation: tm-fade 8s linear infinite; }
@keyframes tm-fade {
  0% { opacity: 1; }
  90% { opacity: 1; }
  97% { opacity: 0; }
  100% { opacity: 0; }
}
.tm-cur { opacity: 0; animation: tm-cur 8s linear infinite; }
@keyframes tm-cur {
  0% { transform: translateX(0); opacity: 1; }
  80% { transform: translateX(420px); opacity: 1; }
  84% { transform: translateX(420px); opacity: 0; }
  100% { transform: translateX(420px); opacity: 0; }
}
.tm-note { animation: tm-note 8s linear infinite; }
@keyframes tm-note {
  0% { opacity: 0; }
  50.29% { opacity: 0; }
  52.29% { opacity: 1; }
  90% { opacity: 1; }
  97% { opacity: 0; }
  100% { opacity: 0; }
}
