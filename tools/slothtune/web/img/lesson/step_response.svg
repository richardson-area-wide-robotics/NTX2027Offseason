<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 418" width="520" height="418" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="step_response-title step_response-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="step_response-title">A step response: five things to read</title>
<desc id="step_response-desc">Animated graph. A dashed setpoint line jumps from start to target, and a solid measured line is drawn after it from left to right. Five parts are marked in turn as the line reaches them: 1, dead time, the flat stretch before it moves; 2, rise time, from 10% to 90% of the way; 3, overshoot, the peak past the target; 4, settling, until the ringing dies out; 5, left over, the gap that stays at the end. Usual causes: dead time, communication and friction, not gains; rise time, mostly kP and how hard the motor can push; overshoot, too much kP for the damping; settling, overshoot plus ringing; left over, friction beating a small P, or a wrong feedforward.</desc>
