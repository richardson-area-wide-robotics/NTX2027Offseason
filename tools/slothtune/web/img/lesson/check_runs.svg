@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Check runs: how hard to push</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Try the model's gains softer and harder, and keep whichever does best.</text>

