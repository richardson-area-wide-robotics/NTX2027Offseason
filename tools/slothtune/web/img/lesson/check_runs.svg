<text x="460" y="234" font-size="12" font-weight="700" fill="#c62828" text-anchor="middle">never past</text>
<text x="60" y="280" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">half</text>
<text x="460" y="280" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">double</text>
<line x1="112.6" y1="246" x2="112.6" y2="258" stroke="#444444" stroke-width="1.6"/>
