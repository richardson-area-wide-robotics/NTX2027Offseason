<line x1="395.6" y1="246" x2="395.6" y2="258" stroke="#444444" stroke-width="1.6"/>
<text x="395.6" y="280" font-size="12" fill="#222222" text-anchor="middle">1.6x harder</text>
<line x1="335.7" y1="246" x2="335.7" y2="258" stroke="#444444" stroke-width="1.6"/>
<text x="335.7" y="234" font-size="12" fill="#222222" text-anchor="middle">between</text>

<circle class="cr-d0" cx="260" cy="252" r="6.5" fill="#1a7f37" stroke="#ffffff" stroke-width="2"/>
<circle class="cr-d1" cx="395.6" cy="252" r="6.5" fill="#c62828" stroke="#ffffff" stroke-width="2"/>
<circle class="cr-d2" cx="335.7" cy="252" r="8" fill="#1a7f37" stroke="#ffffff" stroke-width="2"/>
<line x1="16" y1="300" x2="504" y2="300" stroke="#d6d6d6"/>
<text x="16" y="320" font-size="13" fill="#222222">It ends on the best. If that can't beat the baseline, it puts back</text>
<text x="16" y="338" font-size="13" fill="#222222">every gain it started with and says why.</text>
<text x="16" y="362" font-size="12" fill="#5c5c5c">If a check overshot or rang more than the model said, or buzzed, it goes softer;</text>
<text x="16" y="378" font-size="12" fill="#5c5c5c">if it was clean, harder. Four checks at most.</text>
</svg>
