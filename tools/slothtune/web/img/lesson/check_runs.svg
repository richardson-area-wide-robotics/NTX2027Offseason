@keyframes cr-w3{0%,58%{transform:translateX(-104px)}70%,100%{transform:translateX(0px)}}
.cr-f3{animation:cr-f3 8s linear infinite}
@keyframes cr-f3{0%,96%{opacity:1}99%,100%{opacity:0}}
.cr-v3{animation:cr-v3 8s linear infinite}
@keyframes cr-v3{0%,70%{opacity:0}71.5%,96%{opacity:1}99%,100%{opacity:0}}
