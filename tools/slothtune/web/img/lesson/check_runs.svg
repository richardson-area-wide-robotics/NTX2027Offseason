<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392" width="520" height="392" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="check_runs-title check_runs-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="check_runs-title">Check runs: how hard to push</title>
<desc id="check_runs-desc">Animated, four step tests drawn one after another. Baseline, the gains it had: a slow gray line, the one to beat. 1.00x, the model's own gains: a clean rise, so it goes harder. 1.6x, harder: it overshoots and rings, too hard. Between the two best: quick and clean, the best, so it is kept and outlined in green. Below, a how-hard scale runs from half to double, with walls marked never past at both ends, and ticks at 0.6x softer, 1.00x, 1.6x harder and between; a dot appears on it for each check. It ends on the best; if that can't beat the baseline, it puts back every gain it started with and says why. Four checks at most.</desc>
