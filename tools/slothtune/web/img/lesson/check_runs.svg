<g class="cr-v3"><text x="442.5" y="198" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">best: keep it</text></g>
<rect class="cr-keep" x="385" y="62" width="115" height="150" rx="8" fill="none" stroke="#1a7f37" stroke-width="3"/>
<line x1="60.0" y1="252" x2="460.0" y2="252" stroke="#444444" stroke-width="2"/>
<line x1="60.0" y1="240" x2="60.0" y2="264" stroke="#c62828" stroke-width="4"/>
<text x="60" y="234" font-size="12" font-weight="700" fill="#c62828" text-anchor="middle">never past</text>
