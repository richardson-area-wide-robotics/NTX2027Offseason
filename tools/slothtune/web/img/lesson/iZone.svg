<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 408" width="520" height="408" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="iZone-title iZone-desc">
<title id="iZone-title">IZone: I only adds up error near the target</title>
<desc id="iZone-desc">Animated, drawn left to right. Top: the measured position starts far below the dashed target line and closes in. A purple band marks the IZone, 3 degrees either side of the target. Below, the I term: while the error is bigger than 3 degrees the integrator is cleared to zero, so it cannot wind up. Once the position is inside the band, I starts adding up the error, and it closes the last little bit, where friction stops P. A label switches from I cleared to I adding up at that moment.</desc>
<style>
.iz-wipe { animation: iz-wipe 8s linear infinite; }
@keyframes iz-wipe { 0%, 4% { transform: translateX(-400px); } 84%, 100% { transform: translateX(0); } }
.iz-fade { animation: iz-fade 8s linear infinite; }
@keyframes iz-fade { 0%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
.iz-cursor { opacity: 0; animation: iz-cursor 8s linear infinite; }
@keyframes iz-cursor { 0%, 4% { transform: translateX(0); opacity: 1; } 84% { transform: translateX(400px); opacity: 1; } 88%, 100% { transform: translateX(400px); opacity: 0; } }

.iz-off, .iz-on { opacity: 0; animation: iz-off 8s linear infinite; }
.iz-on { animation-name: iz-on; }
@keyframes iz-off { 0%, 19.759999999999998% { opacity: 1; } 19.77%, 100% { opacity: 0; } }
@keyframes iz-on { 0%, 19.759999999999998% { opacity: 0; } 19.77%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="28" font-size="16" fill="#222222" font-weight="700">IZone: I only adds up error near the target</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Far from the target, the integrator is cleared, so it can't wind up.</text>
