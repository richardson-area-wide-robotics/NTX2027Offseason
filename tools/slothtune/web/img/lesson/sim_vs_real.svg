<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" width="520" height="450" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="sim_vs_real-title sim_vs_real-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="sim_vs_real-title">Why the simulator's gains differ</title>
<desc id="sim_vs_real-desc">Animated, two timelines drawn left to right over three robot loops. In each, a gray line shows where the mechanism really is and an orange line shows what the SPARK's loop sees. Top, a real SPARK: its loop runs every 1 ms, so what it sees follows the gray line closely. Bottom, the simulator: its loop runs once per 20 ms robot loop, so what it sees is a staircase that holds each value for 20 ms; a red mark shows it a whole 20 ms late. Below: on the robot, gains built for a 1 ms loop; in the simulator, softer gains, kP only, because it applies kD far harder. Practice the steps in the simulator; the numbers that count come from the robot.</desc>
<style>
.sv-w{animation:sv-w 8s linear infinite}
@keyframes sv-w{0%,4%{transform:translateX(-428px)}84%,100%{transform:translateX(0px)}}
.sv-cur{opacity:0;animation:sv-cur 8s linear infinite}
@keyframes sv-cur{0%,3.5%{opacity:0;transform:translateX(0px)}4%{opacity:1;transform:translateX(0px)}84%{opacity:1;transform:translateX(420px)}85.5%,100%{opacity:0;transform:translateX(420px)}}
.sv-f{animation:sv-f 8s linear infinite}
@keyframes sv-f{0%,96%{opacity:1}99%,100%{opacity:0}}
.sv-late{animation:sv-late 8s linear infinite}
@keyframes sv-late{0%,57.33%{opacity:0}58.83%,96%{opacity:1}99%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Why the simulator's gains differ</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">A real SPARK runs its loop every 1 ms; the simulator's runs once per 20 ms.</text>

<line x1="214" y1="68" x2="238" y2="68" stroke="#8a939c" stroke-width="2.4"/><text x="244" y="72" font-size="12" fill="#222222">where it really is</text>
<line x1="364" y1="68" x2="388" y2="68" stroke="#c2410c" stroke-width="2.6"/><text x="394" y="72" font-size="12" fill="#222222">what the loop sees</text>
