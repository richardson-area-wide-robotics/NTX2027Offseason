.sm-h2{opacity:0;animation:sm-h2 8s linear infinite}
@keyframes sm-h2{0%,86%{opacity:0}87.5%,94.5%{opacity:1}96%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">SIMC: speed-loop gains</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">As quick as the speed reading's delay allows, and no quicker.</text>

<line x1="270" y1="64" x2="294" y2="64" stroke="#8a939c" stroke-width="2.4"/><text x="300" y="68" font-size="12" fill="#222222">actual speed</text>
<line x1="386" y1="64" x2="410" y2="64" stroke="#c2410c" stroke-width="2.6"/><text x="416" y="68" font-size="12" fill="#222222">speed reading</text>
<path d="M60 84V236H500" fill="none" stroke="#444444" stroke-width="1.4"/>
<text x="56" y="78" font-size="12" font-weight="700" fill="#c2410c">speed</text>
