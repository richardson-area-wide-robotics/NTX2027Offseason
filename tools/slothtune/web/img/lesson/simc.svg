<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" width="520" height="410" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="simc-title simc-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="simc-title">SIMC: speed-loop gains</title>
<desc id="simc-desc">Animated graph drawn left to right after a volts step. A gray line, the actual speed, starts rising at once and gets two-thirds of the way to the new speed after one time constant, kA / kV. An orange line, the speed reading, does the same but starts late by the delay of the speed filter. Brackets mark the delay and the time constant. Below, the rules light up in turn: kP = kA / (2 × delay); integral time = the shorter of kA / kV and 8 × delay; kI = kP / integral time. Firm but safe: the gain could roughly triple before the loop swings on its own.</desc>
<style>
.sm-w{animation:sm-w 8s linear infinite}
@keyframes sm-w{0%,4%{transform:translateX(-448px)}60%,100%{transform:translateX(0px)}}
.sm-cur{opacity:0;animation:sm-cur 8s linear infinite}
@keyframes sm-cur{0%,3.5%{opacity:0;transform:translateX(0px)}4%{opacity:1;transform:translateX(0px)}60%{opacity:1;transform:translateX(440px)}61.5%,100%{opacity:0;transform:translateX(440px)}}
.sm-f{animation:sm-f 8s linear infinite}
@keyframes sm-f{0%,96%{opacity:1}99%,100%{opacity:0}}
.sm-bd{animation:sm-bd 8s linear infinite}
@keyframes sm-bd{0%,12.15%{opacity:0}13.65%,96%{opacity:1}99%,100%{opacity:0}}
.sm-bt{animation:sm-bt 8s linear infinite}
@keyframes sm-bt{0%,18%{opacity:0}19.5%,96%{opacity:1}99%,100%{opacity:0}}
.sm-h0{opacity:0;animation:sm-h0 8s linear infinite}
@keyframes sm-h0{0%,62%{opacity:0}63.5%,72.5%{opacity:1}74%,100%{opacity:0}}
.sm-h1{opacity:0;animation:sm-h1 8s linear infinite}
