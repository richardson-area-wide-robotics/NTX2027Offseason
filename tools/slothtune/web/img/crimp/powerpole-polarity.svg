<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392" width="520" height="392" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="ppp-title ppp-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="ppp-title">Powerpole polarity: Red Right, Tongue Top</title>
<desc id="ppp-desc">Mating face of a Powerpole pair, looking at the contact side: the black housing, negative, on the left and the red housing, positive, on the right, joined by a dovetail, with each contact's tongue (the flat mating blade) at the top of its opening: Red Right, Tongue Top. A mated pair seen from the top lines up red to red and black to black; every assembly built this way mates with every other, pins connecting one to one. The housings' dovetails slide together lengthwise, one way only; snapping them together sideways damages them. Laid out for crimping: stripped ends pointing away from you, red on the right, the hooked edge of each contact down.</desc>

<!-- Title -->
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Powerpole polarity: Red Right, Tongue Top</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Red = positive (+), black = negative (−).</text>

<!-- Mating face view -->
<text x="16" y="70" font-size="14" font-weight="700" fill="#222222">Mating face<tspan font-size="12" font-weight="400" fill="#5c5c5c"> (contact side)</tspan></text>
<!-- black housing, left -->
<rect x="36" y="82" width="72" height="72" rx="5" fill="#333333" stroke="#777777" stroke-width="1.5"/>
<rect x="48" y="92" width="48" height="40" rx="2" fill="#222222" stroke="#777777" stroke-width="1"/>
<rect x="51" y="95" width="42" height="9" rx="1.5" fill="#b0b8c0" stroke="#7d8790" stroke-width="1"/>
<!-- red housing, right -->
<rect x="108" y="82" width="72" height="72" rx="5" fill="#d32f2f" stroke="#444444" stroke-width="1.5"/>
<rect x="120" y="92" width="48" height="40" rx="2" fill="#222222" stroke="#444444" stroke-width="1"/>
<rect x="123" y="95" width="42" height="9" rx="1.5" fill="#b0b8c0" stroke="#7d8790" stroke-width="1"/>
<!-- dovetail joint -->
<path d="M108 106 L117 102 L117 130 L108 126 Z" fill="#333333" stroke="#777777" stroke-width="1" stroke-linejoin="round"/>
<g font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
  <text x="72" y="148">−</text>
  <text x="144" y="148">+</text>
</g>
<g font-size="13" font-weight="700" fill="#222222">
  <text x="194" y="94">Tongue</text>
  <text x="194" y="109">on top</text>
</g>
<line x1="191" y1="99" x2="167" y2="99.5" stroke="#222222" stroke-width="1"/>
<circle cx="165" cy="99.5" r="2.5" fill="#222222"/>
<g font-size="13" font-weight="700" text-anchor="middle">
  <text x="72" y="174" fill="#222222">BLACK (−)</text>
  <text x="144" y="174" fill="#d32f2f">RED (+)</text>
</g>
<g font-size="12" fill="#5c5c5c" text-anchor="middle">
  <text x="72" y="189">negative</text>
  <text x="144" y="189">positive</text>
</g>

<!-- Mated pair, top view -->
<text x="264" y="70" font-size="14" font-weight="700" fill="#222222">Mated pair<tspan font-size="12" font-weight="400" fill="#5c5c5c"> (top view)</tspan></text>
<g stroke-width="1">
  <rect x="280" y="90" width="29" height="10" fill="#d32f2f" stroke="#444444"/>
  <rect x="280" y="112" width="29" height="10" fill="#333333" stroke="#777777"/>
  <rect x="459" y="90" width="29" height="10" fill="#d32f2f" stroke="#444444"/>
  <rect x="459" y="112" width="29" height="10" fill="#333333" stroke="#777777"/>
</g>
<g stroke-width="1.5">
  <rect x="308" y="84" width="76" height="22" rx="2" fill="#d32f2f" stroke="#444444"/>
  <rect x="308" y="106" width="76" height="22" rx="2" fill="#333333" stroke="#777777"/>
  <rect x="384" y="84" width="76" height="22" rx="2" fill="#d32f2f" stroke="#444444"/>
  <rect x="384" y="106" width="76" height="22" rx="2" fill="#333333" stroke="#777777"/>
</g>
<g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
  <text x="346" y="100">+</text>
  <text x="422" y="100">+</text>
  <text x="346" y="122">−</text>
  <text x="422" y="122">−</text>
</g>
<g font-size="13" font-weight="700" text-anchor="middle">
  <text x="384" y="148" fill="#d32f2f">Red to red (+ to +)</text>
  <text x="384" y="164" fill="#222222">Black to black (− to −)</text>
</g>
<g font-size="12" fill="#5c5c5c" text-anchor="middle">
  <text x="384" y="183">Every assembly built this way mates</text>
  <text x="384" y="198">with every other: pins connect 1-to-1.</text>
</g>

<line x1="16" y1="210" x2="504" y2="210" stroke="#d6d6d6" stroke-width="1"/>

<!-- Joining the housings -->
<text x="16" y="232" font-size="14" font-weight="700" fill="#222222">Joining two housings<tspan font-size="12" font-weight="400" fill="#5c5c5c"> (top view)</tspan></text>

<!-- Good: slide lengthwise -->
<g stroke-width="1.5">
  <rect x="40" y="246" width="120" height="20" rx="2" fill="#d32f2f" stroke="#444444"/>
  <rect x="84" y="266" width="120" height="20" rx="2" fill="#333333" stroke="#777777"/>
</g>
<g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
  <text x="100" y="261">+</text>
  <text x="144" y="281">−</text>
</g>
<line x1="214" y1="276" x2="238" y2="276" stroke="#222222" stroke-width="1.5"/>
<path d="M206 276 L214 272.5 L214 279.5 Z" fill="#222222"/>
<path d="M17 311 L21.5 315.5 L30 306" fill="none" stroke="#1a7f37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g font-size="12" fill="#222222">
  <text x="36" y="318"><tspan font-weight="700" fill="#1a7f37">Good:</tspan> slide the dovetails together</text>
  <text x="36" y="333">lengthwise. They go one way only.</text>
</g>

<!-- Bad: snapped together sideways -->
<g stroke-width="1.5">
  <rect x="300" y="244" width="120" height="18" rx="2" fill="#d32f2f" stroke="#444444"/>
  <rect x="300" y="272" width="120" height="18" rx="2" fill="#333333" stroke="#777777"/>
</g>
<g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
  <text x="360" y="258">+</text>
  <text x="360" y="286">−</text>
</g>
<g stroke="#c62828" stroke-width="1.5">
  <line x1="390" y1="226" x2="390" y2="235"/>
  <line x1="390" y1="300" x2="390" y2="306"/>
</g>
<path d="M390 242 L386.5 234 L393.5 234 Z M390 292 L386.5 300 L393.5 300 Z" fill="#c62828"/>
<g transform="translate(274 313)" stroke="#c62828" stroke-width="3" stroke-linecap="round">
  <line x1="-5" y1="-5" x2="5" y2="5"/>
  <line x1="5" y1="-5" x2="-5" y2="5"/>
</g>
<g font-size="12" fill="#222222">
  <text x="286" y="318"><tspan font-weight="700" fill="#c62828">Bad:</tspan> snapping them together</text>
  <text x="286" y="333">sideways damages the dovetails.</text>
</g>

<line x1="16" y1="346" x2="504" y2="346" stroke="#d6d6d6" stroke-width="1"/>

<!-- Crimp layout -->
<g font-size="12" fill="#222222">
  <text x="16" y="366"><tspan font-weight="700">Laid out for crimping:</tspan> stripped ends pointing away from you, red on the right,</text>
  <text x="16" y="381">and the hooked edge of each contact down.</text>
</g>
</svg>
