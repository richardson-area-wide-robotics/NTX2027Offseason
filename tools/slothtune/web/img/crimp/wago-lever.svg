<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 520 696" width="520" height="696" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="wl-title wl-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="wl-title">WAGO lever nuts: lift, insert, close</title>
<desc id="wl-desc">Animated side view of a WAGO 221 lever nut with a clear housing. The orange lever lifts until it latches open, which opens the spring clamp inside; the stripped wire slides straight in until the bare copper stops at the back wall, with the insulation just inside the opening; the lever closes, the spring clamps the copper onto the current bar, and a green check appears; then tug the wire. Steps: 1 lift the lever until it latches open; 2 push the wire straight in until it stops at the back; 3 push the lever back down, flush with the housing; 4 look through the side, then give the wire a tug. Strip 0.43 in (11 mm), using the strip gauge printed on the side of the nut. Look through the clear side: copper reaches the back wall, insulation just inside the entry, no copper or strands outside, lever flush. Six bad connections, each marked with a red X: not fully in (heats up, cuts out); insulation in the clamp (no contact); bare copper outside (can short); stray strands outside (can short); lever not closed (wire not clamped); wrong wire size (won't grip or fit). The WAGO 221 Series takes 24-12 AWG (0.2-4 mm2) solid, stranded or fine-stranded wire, one lever per wire; read the rating printed on yours: the team's are rated 40 A at 12 V DC. Lever terminals on devices use the same steps with their own strip length: REV PDH high-current channels are latching WAGO terminals, 24-8 AWG, strip 0.43-0.51 in (11-13 mm); CTRE PDP 2.0 outputs are lever-actuated WAGO terminals, 22-10 AWG, strip 3/8 in (9.5 mm).</desc>
<style>
/* One 8 s loop. Lever and spring clamp open 8-18 %, wire slides in 20-44 % and stops at the back wall,
   lever and clamp close 50-60 %, check from 64 %, tug arrow 71-88 %, wire fades out 88-94 % and resets unseen.
   With no animation every part sits at its finished, good position. */
.lever { transform-box: view-box; transform-origin: 274px 177.5px; animation: lever 8s ease-in-out infinite; }
@keyframes lever {
  0%, 8% { transform: rotate(0deg); }
  18%, 50% { transform: rotate(80deg); }
  60%, 100% { transform: rotate(0deg); }
}
.spring { transform-box: view-box; transform-origin: 260px 234px; animation: spring 8s ease-in-out infinite; }
@keyframes spring {
  0%, 10% { transform: rotate(0deg); }
  18%, 51% { transform: rotate(11deg); }
  58%, 100% { transform: rotate(0deg); }
}
.wire { animation: wire 8s ease-in-out infinite; }
@keyframes wire {
  0% { transform: translateX(-127px); opacity: 0; }
  4%, 20% { transform: translateX(-127px); opacity: 1; }
  40% { transform: translateX(-10px); }
  44%, 88% { transform: translateX(0px); opacity: 1; }
  94% { transform: translateX(0px); opacity: 0; }
  100% { transform: translateX(-127px); opacity: 0; }
}
.check { animation: check 8s linear infinite; }
@keyframes check { 0%, 61% { opacity: 0; } 64%, 88% { opacity: 1; } 93%, 100% { opacity: 0; } }
.tug { animation: tug 8s linear infinite; }
@keyframes tug { 0%, 68% { opacity: 0; } 71%, 86% { opacity: 1; } 90%, 100% { opacity: 0; } }
.push { opacity: 0; animation: push 8s linear infinite; }
@keyframes push { 0%, 21% { opacity: 0; } 24%, 41% { opacity: 1; } 45%, 100% { opacity: 0; } }
.hl1, .hl2, .hl3, .hl4 { opacity: 0; }
.hl1 { animation: hl1 8s linear infinite; }
@keyframes hl1 { 0%, 5% { opacity: 0; } 7%, 18% { opacity: 1; } 19.5%, 100% { opacity: 0; } }
.hl2 { animation: hl2 8s linear infinite; }
@keyframes hl2 { 0%, 19.5% { opacity: 0; } 21%, 45% { opacity: 1; } 47%, 100% { opacity: 0; } }
.hl3 { animation: hl3 8s linear infinite; }
@keyframes hl3 { 0%, 47% { opacity: 0; } 49%, 60% { opacity: 1; } 62%, 100% { opacity: 0; } }
.hl4 { animation: hl4 8s linear infinite; }
@keyframes hl4 { 0%, 61% { opacity: 0; } 63%, 88% { opacity: 1; } 91%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <!-- Lever nut side view, cut away. Local units: entry face at x=0, top at y=0, about 7 px per mm. -->
  <g id="wl-body">
    <rect x="0" y="0" width="132" height="59" rx="6" fill="#eef5f9"/>
    <rect x="46" y="47" width="66" height="5" fill="#b0b8c0" stroke="#7d8790" stroke-width="1" vector-effect="non-scaling-stroke"/>
  </g>
  <!-- Back wall, entry channel and the clear housing wall drawn over the wire -->
  <g id="wl-front">
    <rect x="124" y="22" width="5" height="34" fill="#c3d3de"/>
    <path d="M2 29 H44 M2 51 H44" fill="none" stroke="#a9bccb" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <rect x="0" y="0" width="132" height="59" rx="6" fill="#dbe8f1" opacity="0.3"/>
    <path d="M0 28 V6 Q0 0 6 0 H126 Q132 0 132 6 V53 Q132 59 126 59 H6 Q0 59 0 53 V52" fill="none" stroke="#8aa1b1" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
  </g>
  <!-- Spring clamp, closed: wraps the current bar and presses the copper down onto it -->
  <path id="wl-spring" d="M110 52 C122 50 121 12 104 11 L78 11 Q68 11 67 19 L65 33" fill="none" stroke="#7d8790" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="wl-lever">
    <rect x="14" y="-9" width="116" height="9" rx="3" fill="#f28c28" stroke="#b55f12" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <circle cx="124" cy="-4.5" r="2.2" fill="#b55f12"/>
  </g>
  <g id="wl-x">
    <line x1="-5" y1="-5" x2="5" y2="5"/>
    <line x1="5" y1="-5" x2="-5" y2="5"/>
  </g>
  <g id="wl-cu" stroke="#c47a2c" stroke-width="2.9">
    <line x1="46" y1="35.1" x2="123" y2="35.1"/>
    <line x1="46" y1="38.4" x2="123" y2="38.4"/>
    <line x1="46" y1="41.6" x2="123" y2="41.6"/>
    <line x1="46" y1="44.9" x2="123" y2="44.9"/>
  </g>
</defs>

