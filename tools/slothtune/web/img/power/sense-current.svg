  <text x="155" y="262">it bigger</text>
  <text x="238" y="232" font-weight="700">bigger</text>
  <text x="238" y="247">voltage</text>
  <text x="326" y="232" font-weight="700">ADC</text>
  <text x="326" y="247">analog-to-digital</text>
  <text x="326" y="262">converter</text>
  <text x="443" y="232" font-weight="700">a number</text>
</g>

