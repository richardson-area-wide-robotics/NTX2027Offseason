<rect x="386" y="150" width="114" height="52" rx="6" fill="#eef3ff" stroke="#446ce3" stroke-width="1.6"/>
<g font-size="20" font-weight="700" fill="#222222" text-anchor="middle">
  <text class="ro r0" x="443" y="183">40.0 A</text>
  <text class="ro r1" x="443" y="183">37.7 A</text>
  <text class="ro r2" x="443" y="183">31.3 A</text>
  <text class="ro r3" x="443" y="183">22.5 A</text>
  <text class="ro r4" x="443" y="183">13.8 A</text>
  <text class="ro r5" x="443" y="183">7.3 A</text>
  <text class="ro r6" x="443" y="183">5.0 A</text>
  <text class="ro r7" x="443" y="183">7.3 A</text>
  <text class="ro r8" x="443" y="183">13.8 A</text>
  <text class="ro r9" x="443" y="183">22.5 A</text>
  <text class="ro r10" x="443" y="183">31.3 A</text>
  <text class="ro r11" x="443" y="183">37.7 A</text>
</g>

<!-- captions -->
<g font-size="12" fill="#222222" text-anchor="middle">
  <text x="64" y="232" font-weight="700">tiny voltage</text>
  <text x="64" y="247">across the shunt</text>
