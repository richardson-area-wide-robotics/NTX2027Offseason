<rect x="16" y="278" width="488" height="62" rx="6" fill="#f4f7ff" stroke="#c9d5f5"/>
<g class="field" fill="none" stroke="#446ce3" stroke-width="1.4" stroke-dasharray="3 3">
  <circle cx="56" cy="309" r="12"/>
  <circle cx="56" cy="309" r="17"/>
</g>
<path d="M78.55 300.79 A24 24 0 1 0 78.55 317.21" fill="none" stroke="#7d8790" stroke-width="6"/>
<rect x="76" y="304" width="9" height="10" fill="#222222"/>
<circle cx="56" cy="309" r="7" fill="#c47a2c" stroke="#8a5216" stroke-width="1.2"/>
<circle cx="56" cy="309" r="2" fill="#222222"/>
