<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 482" width="520" height="482" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="bc-title bc-desc">
<title id="bc-title">Charging: the charger pushes it back</title>
<desc id="bc-desc">Animated, slowed way down. Left: the same lead-acid cell as the discharge picture, now wired to a charger. The charger pulls yellow electrons out of the positive terminal and pushes them into the negative terminal, the opposite way to discharging. Pale lead sulfate leaves both plates and goes back into the acid, so the plates turn back into gray lead and dark brown lead dioxide and the acid turns from pale to deep blue (stronger). Fewer electrons flow as the charge goes on. Right: a chart of one charge, not to scale, with a moving cursor. In the bulk stage the current is steady (up to 5.4 A for the MK ES17-12) while the voltage rises. In the absorption stage the voltage is held at 14.4 to 15.0 V and the current tapers off. In the float stage the voltage drops to 13.5 to 13.8 V and only a tiny current flows. The voltages and the 5.4 A maximum are from the MK ES17-12 datasheet at 25 C. Text: in bulk a steady current puts back about 70% (Battery University; FRC rule R604 limits robot-battery chargers to 6 A average); in absorption the battery's own voltage climbs toward the held voltage, so less current flows; float keeps it topped up; charge only once the case is not warm (WPILib: about 15 minutes); let the battery rest a few hours before reading its voltage, because fresh off the charger it reads high (Battery University: at least 4 hours, makers say 24).</desc>
<style>
/* One 8 s loop. The cursor waits 0-5 %, sweeps the chart 5-85 % (bulk to 34.25 %, absorption to 68.66 %,
   float to 85 %), holds to 95 %, then fades and jumps back. x on the chart = 292 + (t - 5) / 80 * 186. */
.bc-e { animation: bc-e 2s linear infinite; }
@keyframes bc-e {
  0% { transform: translate(193px, 124px); opacity: 0; }
  4% { opacity: 1; }
  13.8% { transform: translate(193px, 100px); }
  86.2% { transform: translate(67px, 100px); }
  96% { opacity: 1; }
  100% { transform: translate(67px, 124px); opacity: 0; }
}
.bc-e1 { animation-delay: -0.1667s; } .bc-e2 { animation-delay: -0.5s; } .bc-e3 { animation-delay: -0.8333s; }
.bc-e4 { animation-delay: -1.1667s; } .bc-e5 { animation-delay: -1.5s; } .bc-e6 { animation-delay: -1.8333s; }
/* fewer electrons as the current tapers: two dots drop out early in absorption, two more later */
.bc-gC { animation: bc-gC 8s linear infinite; }
.bc-gB { animation: bc-gB 8s linear infinite; }
@keyframes bc-gC { 0%, 40% { opacity: 1; } 46%, 96.9% { opacity: 0; } 97%, 100% { opacity: 1; } }
@keyframes bc-gB { 0%, 55% { opacity: 1; } 62%, 96.9% { opacity: 0; } 97%, 100% { opacity: 1; } }
.bc-chipL { animation: bc-chipL 2s linear infinite; }
.bc-chipR { animation: bc-chipR 2s linear infinite; }
@keyframes bc-chipL { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(32px); opacity: 0; } }
@keyframes bc-chipR { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(-32px); opacity: 0; } }
.bc-chips { animation: bc-chips 8s linear infinite; }
@keyframes bc-chips { 0%, 62% { opacity: 1; } 68.66%, 96.9% { opacity: 0; } 97%, 100% { opacity: 1; } }
.bc-sulf { animation: bc-sulf 8s linear infinite; }
@keyframes bc-sulf { 0%, 5% { opacity: 0.88; } 34.25% { opacity: 0.3; } 68.66% { opacity: 0; } 95% { opacity: 0; } 100% { opacity: 0.88; } }
.bc-acid { animation: bc-acid 8s linear infinite; }
@keyframes bc-acid { 0%, 5% { fill: #e3eef9; } 34.25% { fill: #a9cbee; } 68.66% { fill: #7fb3e6; } 95% { fill: #7fb3e6; } 100% { fill: #e3eef9; } }
.bc-cursor { animation: bc-cursor 8s linear infinite; }
@keyframes bc-cursor {
  0%, 5% { transform: translateX(0); opacity: 1; }
  85% { transform: translateX(186px); }
  95% { transform: translateX(186px); opacity: 1; }
  97% { transform: translateX(186px); opacity: 0; }
  97.1% { transform: translateX(0); opacity: 0; }
  100% { transform: translateX(0); opacity: 1; }
}
.bc-vdot { animation: bc-vdot 8s linear infinite; }
@keyframes bc-vdot {
  0%, 5% { transform: translate(292px, 170.7px); opacity: 1; }
  8.66% { transform: translate(300.5px, 154.8px); }
  12.31% { transform: translate(309px, 142.8px); }
  15.97% { transform: translate(317.5px, 133.6px); }
  19.62% { transform: translate(326px, 126.7px); }
  23.28% { transform: translate(334.5px, 121.4px); }
  26.94% { transform: translate(343px, 117.4px); }
  30.59% { transform: translate(351.5px, 114.3px); }
  34.25% { transform: translate(360px, 112px); }
  68.66% { transform: translate(440px, 112px); }
  69% { transform: translate(440.8px, 132px); }
  85% { transform: translate(478px, 132px); }
  95% { transform: translate(478px, 132px); opacity: 1; }
  97% { transform: translate(478px, 132px); opacity: 0; }
  97.1% { transform: translate(292px, 170.7px); opacity: 0; }
  100% { transform: translate(292px, 170.7px); opacity: 1; }
}
.bc-idot { animation: bc-idot 8s linear infinite; }
@keyframes bc-idot {
  0%, 5% { transform: translate(292px, 203px); opacity: 1; }
  34.25% { transform: translate(360px, 203px); }
  37.69% { transform: translate(368px, 218px); }
  41.13% { transform: translate(376px, 229px); }
  44.57% { transform: translate(384px, 237.2px); }
  48.01% { transform: translate(392px, 243.3px); }
  51.45% { transform: translate(400px, 247.8px); }
  54.89% { transform: translate(408px, 251.2px); }
  58.33% { transform: translate(416px, 253.6px); }
  61.77% { transform: translate(424px, 255.5px); }
  65.22% { transform: translate(432px, 256.8px); }
  68.66% { transform: translate(440px, 257.8px); }
  69% { transform: translate(440.8px, 263.7px); }
  85% { transform: translate(478px, 263.7px); }
  95% { transform: translate(478px, 263.7px); opacity: 1; }
  97% { transform: translate(478px, 263.7px); opacity: 0; }
  97.1% { transform: translate(292px, 203px); opacity: 0; }
  100% { transform: translate(292px, 203px); opacity: 1; }
}
/* the stage names light up, and the charger's display changes, as the cursor passes */
.bc-sb { animation: bc-sb 8s linear infinite; }
.bc-sa { animation: bc-sa 8s linear infinite; }
.bc-sf { animation: bc-sf 8s linear infinite; }
@keyframes bc-sb { 0%, 34.2% { fill: #446ce3; } 34.3%, 96.9% { fill: #5c5c5c; } 97%, 100% { fill: #446ce3; } }
@keyframes bc-sa { 0%, 34.2% { fill: #5c5c5c; } 34.3%, 68.6% { fill: #446ce3; } 68.7%, 100% { fill: #5c5c5c; } }
@keyframes bc-sf { 0%, 68.6% { fill: #5c5c5c; } 68.7%, 96.9% { fill: #446ce3; } 97%, 100% { fill: #5c5c5c; } }
.bc-db { animation: bc-db 8s linear infinite; }
.bc-da { animation: bc-da 8s linear infinite; }
.bc-df { animation: bc-df 8s linear infinite; }
@keyframes bc-db { 0%, 34.2% { opacity: 1; } 34.3%, 96.9% { opacity: 0; } 97%, 100% { opacity: 1; } }
@keyframes bc-da { 0%, 34.2% { opacity: 0; } 34.3%, 68.6% { opacity: 1; } 68.7%, 100% { opacity: 0; } }
@keyframes bc-df { 0%, 68.6% { opacity: 0; } 68.7%, 96.9% { opacity: 1; } 97%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="26" font-size="16" font-weight="700" fill="#222222">Charging: the charger pushes it back</text>
<text x="16" y="45" font-size="12" fill="#5c5c5c">The same cell, now on a charger. Slowed way down: a real charge takes hours.</text>

<!-- ============ the cell on a charger ============ -->
<text x="130" y="72" font-size="12" fill="#5c5c5c" text-anchor="middle">moves electrons from + to −</text>
<path d="M67 124 V100 H193 V124" fill="none" stroke="#444444" stroke-width="2.5" stroke-linejoin="round"/>
<!-- electrons: drawn before the charger so they pass through it -->
<g fill="#f2c200" stroke="#8a6d00" stroke-width="1">
