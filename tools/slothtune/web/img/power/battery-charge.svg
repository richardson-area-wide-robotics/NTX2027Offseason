<g font-size="12" fill="#446ce3" text-anchor="middle">
  <text class="bc-db" x="135" y="111">bulk</text>
  <text class="bc-da" x="135" y="111" opacity="0">absorption</text>
  <text class="bc-df" x="135" y="111" opacity="0">float</text>
</g>
<text x="87" y="95" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">−</text>
<text x="183" y="95" font-size="14" font-weight="700" fill="#c62828" text-anchor="middle">+</text>

<!-- terminals -->
