    <circle class="bc-e bc-e6" r="4.5" transform="translate(67 109.5)"/>
  </g>
</g>
<rect x="95" y="84" width="80" height="32" rx="5" fill="#f5f7fa" stroke="#444444" stroke-width="1.5"/>
