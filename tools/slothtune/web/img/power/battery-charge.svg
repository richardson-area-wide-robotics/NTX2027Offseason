  <line x1="52" y1="222" x2="82" y2="222"/><line x1="52" y1="236" x2="82" y2="236"/><line x1="52" y1="250" x2="82" y2="250"/>
  <line x1="52" y1="264" x2="82" y2="264"/><line x1="52" y1="278" x2="82" y2="278"/>
</g>
<!-- positive plate: lead dioxide -->
