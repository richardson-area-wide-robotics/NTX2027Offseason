</g>

<!-- ============ why ============ -->
<line x1="16" y1="352" x2="504" y2="352" stroke="#e2e2e2"/>
<g font-size="13" fill="#222222">
  <text x="16" y="372"><tspan font-weight="700">Bulk:</tspan> a steady current puts back about 70% (FRC R604: 6 A average max).</text>
  <text x="16" y="391"><tspan font-weight="700">Absorption:</tspan> the voltage is held. The battery's own voltage climbs toward</text>
  <text x="16" y="410">it, so less current flows: the current tapers. <tspan font-weight="700">Float</tspan> keeps it topped up.</text>
  <text x="16" y="429"><tspan font-weight="700">Cool first:</tspan> charge once the case is not warm (WPILib: about 15 min).</text>
  <text x="16" y="448"><tspan font-weight="700">Let it rest</tspan> a few hours before you read its voltage: fresh off the</text>
  <text x="16" y="467">charger it reads high (Battery University: 4 h or more; makers say 24 h).</text>
</g>
