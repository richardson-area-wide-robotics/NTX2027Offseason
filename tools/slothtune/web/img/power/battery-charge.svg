  <g fill="#f7f7f7" stroke="#9aa4ad" stroke-width="1">
    <rect x="56" y="174" width="8" height="5"/><rect x="70" y="189" width="8" height="5"/><rect x="57" y="209" width="8" height="5"/>
    <rect x="71" y="227" width="8" height="5"/><rect x="56" y="247" width="8" height="5"/><rect x="68" y="266" width="8" height="5"/>
    <rect x="182" y="179" width="8" height="5"/><rect x="196" y="197" width="8" height="5"/><rect x="184" y="217" width="8" height="5"/>
    <rect x="197" y="237" width="8" height="5"/><rect x="182" y="255" width="8" height="5"/><rect x="194" y="271" width="8" height="5"/>
  </g>
</g>
<!-- what the acid does -->
<text x="130" y="182" font-size="13" font-weight="700" fill="#222222" text-anchor="middle">sulfuric acid</text>
<text x="130" y="197" font-size="12" fill="#222222" text-anchor="middle">in water</text>
<text x="105" y="216" font-size="13" fill="#222222" text-anchor="middle">SO<tspan font-size="12" dy="3">4</tspan></text>
<text x="155" y="216" font-size="13" fill="#222222" text-anchor="middle">SO<tspan font-size="12" dy="3">4</tspan></text>
<g stroke="#222222" stroke-width="1.6" fill="none">
  <path d="M86 224 H124 M118 219 L124 224 L118 229"/>
  <path d="M174 224 H136 M142 219 L136 224 L142 229"/>
</g>
<g class="bc-chips" fill="#e8e8e8" stroke="#9aa4ad" stroke-width="1">
  <rect class="bc-chipL" x="86" y="232" width="10" height="8" rx="1.5"/>
  <rect class="bc-chipR" x="164" y="232" width="10" height="8" rx="1.5"/>
</g>
<text x="130" y="258" font-size="12" fill="#222222" text-anchor="middle">sulfate goes</text>
<text x="130" y="273" font-size="12" fill="#222222" text-anchor="middle">back to the acid</text>
<text x="130" y="291" font-size="12" font-weight="700" fill="#222222" text-anchor="middle">stronger acid</text>
<!-- plate names -->
<text x="30" y="318" font-size="13" font-weight="700" fill="#222222">− plate</text>
<text x="30" y="335" font-size="13" fill="#222222">lead (Pb)</text>
<text x="230" y="318" font-size="13" font-weight="700" fill="#222222" text-anchor="end">+ plate</text>
<text x="230" y="335" font-size="13" fill="#222222" text-anchor="end">lead dioxide (PbO<tspan font-size="12" dy="3">2</tspan><tspan dy="-3">)</tspan></text>

<!-- ============ the chart of one charge ============ -->
<text x="262" y="72" font-size="13" font-weight="700" fill="#222222">One charge (not to scale)</text>
<g font-size="12" font-weight="700" text-anchor="middle" fill="#5c5c5c">
