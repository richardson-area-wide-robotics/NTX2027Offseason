  <circle class="bc-e bc-e4" r="4.5" transform="translate(115.5 100)"/>
  <g class="bc-gB">
    <circle class="bc-e bc-e2" r="4.5" transform="translate(173.5 100)"/>
    <circle class="bc-e bc-e5" r="4.5" transform="translate(86.5 100)"/>
  </g>
  <g class="bc-gC">
