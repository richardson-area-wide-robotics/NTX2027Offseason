<g stroke="#4e342e" stroke-width="1">
  <line x1="178" y1="180" x2="208" y2="180"/><line x1="178" y1="194" x2="208" y2="194"/><line x1="178" y1="208" x2="208" y2="208"/>
  <line x1="178" y1="222" x2="208" y2="222"/><line x1="178" y1="236" x2="208" y2="236"/><line x1="178" y1="250" x2="208" y2="250"/>
  <line x1="178" y1="264" x2="208" y2="264"/><line x1="178" y1="278" x2="208" y2="278"/>
</g>
<!-- lead sulfate coat: starts thick (a flat battery) and clears as it charges -->
