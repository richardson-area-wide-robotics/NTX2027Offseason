<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="el-title el-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="el-title">Elevators: continuous and cascade rigging</title>
<desc id="el-desc">Animated side views of two elevators with the same parts: a fixed stage 1, a moving stage 2, and a carriage holding a game piece, lifted by a rope from a drum turned by a motor and gearbox, with an encoder in the motor, an upper soft limit and a lower limit switch. Left, continuous rigging: one rope runs from the drum over a pulley at the top of stage 1, under a pulley at the bottom of stage 2, over a pulley at the top of stage 2 and down to the carriage. One stage moves at a time: the carriage rides up stage 2 first, then stage 2 rises carrying it; coming down, the carriage goes first, then stage 2. The carriage moves at rope speed, and the rope pull steps from 10 lb (carriage only) to 15 lb (carriage plus stage 2), so the gravity gain kG is different low and high. Right, cascade rigging: one rope lifts stage 2 from its bottom, and a second rope, tied to stage 1, runs over a pulley at the top of stage 2 to the carriage, so every stage moves at once and the carriage moves twice as fast as stage 2. The rope pull is stage 2 plus twice the carriage, 25 lb, the same all the way up, so one kG fits the whole travel. Both reach the top together here, so the cascade drum turns half as far but pulls harder. Only the lifting ropes are drawn; a second rope or gravity brings each one down. Sources: FIRST Robotics Competition guided experience, Extenders; Game Manual 0, rigging; Chief Delphi; ReCalc.</desc>
<style>
/* One 10 s loop, all linear. Up 6-46 %, top 46-56 %, down 56-96 %.
   Continuous: carriage up stage 2 6-26 %, then stage 2 26-46 %; carriage down 56-76 %, stage 2 76-96 %.
   Cascade: stage 2 and carriage (relative to stage 2) both move 6-46 % and 56-96 %.
   Each stage travels 100 px; the drum (r 8) reels 200 px of rope (continuous) or 100 px (cascade). */
.s2c { animation: s2c 10s linear infinite; }
@keyframes s2c { 0%, 26% { transform: translateY(0); } 46%, 76% { transform: translateY(-100px); } 96%, 100% { transform: translateY(0); } }
.cc { animation: cc 10s linear infinite; }
@keyframes cc { 0%, 6% { transform: translateY(0); } 26%, 56% { transform: translateY(-100px); } 76%, 100% { transform: translateY(0); } }
.r2c { transform-box: fill-box; transform-origin: 50% 0%; animation: r2c 10s linear infinite; }
@keyframes r2c { 0%, 26% { transform: scaleY(1); } 46%, 76% { transform: scaleY(0.33333); } 96%, 100% { transform: scaleY(1); } }
.r4c { transform-box: fill-box; transform-origin: 50% 0%; animation: r4c 10s linear infinite; }
@keyframes r4c { 0%, 6% { transform: scaleY(1); } 26%, 56% { transform: scaleY(0.10714); } 76%, 100% { transform: scaleY(1); } }
.drumc { transform-box: fill-box; transform-origin: 50% 50%; animation: drumc 10s linear infinite; }
@keyframes drumc { 0%, 6% { transform: rotate(0deg); } 46%, 56% { transform: rotate(1432deg); } 96%, 100% { transform: rotate(0deg); } }
.meterc { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0.4); animation: meterc 10s linear infinite; }
@keyframes meterc { 0%, 26% { transform: scaleY(0.4); } 26.5%, 56% { transform: scaleY(0.6); } 56.5%, 76% { transform: scaleY(0.4); } 76.5%, 96% { transform: scaleY(0.6); } 96.5%, 100% { transform: scaleY(0.4); } }

.s2k, .ck { animation: s2k 10s linear infinite; }
@keyframes s2k { 0%, 6% { transform: translateY(0); } 46%, 56% { transform: translateY(-100px); } 96%, 100% { transform: translateY(0); } }
.r2k { transform-box: fill-box; transform-origin: 50% 0%; animation: r2k 10s linear infinite; }
@keyframes r2k { 0%, 6% { transform: scaleY(1); } 46%, 56% { transform: scaleY(0.34211); } 96%, 100% { transform: scaleY(1); } }
.r5k { transform-box: fill-box; transform-origin: 50% 100%; animation: r5k 10s linear infinite; }
@keyframes r5k { 0%, 6% { transform: scaleY(1); } 46%, 56% { transform: scaleY(5.16667); } 96%, 100% { transform: scaleY(1); } }
.r4k { transform-box: fill-box; transform-origin: 50% 0%; animation: r4k 10s linear infinite; }
@keyframes r4k { 0%, 6% { transform: scaleY(1); } 46%, 56% { transform: scaleY(0.10714); } 96%, 100% { transform: scaleY(1); } }
.drumk { transform-box: fill-box; transform-origin: 50% 50%; animation: drumk 10s linear infinite; }
@keyframes drumk { 0%, 6% { transform: rotate(0deg); } 46%, 56% { transform: rotate(716deg); } 96%, 100% { transform: rotate(0deg); } }

/* Reduced motion: hold a mid-lift pose so the rigging is visible. Continuous at 36 %
   (carriage at the top of stage 2, stage 2 half way), cascade at 26 % (both half way). */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .s2c { transform: translateY(-50px); } .cc { transform: translateY(-100px); }
  .r2c { transform: scaleY(0.66667); } .r4c { transform: scaleY(0.10714); } .meterc { transform: scaleY(0.6); }
  .s2k, .ck { transform: translateY(-50px); }
  .r2k { transform: scaleY(0.67105); } .r5k { transform: scaleY(3.08333); } .r4k { transform: scaleY(0.55357); }
}
</style>

<!-- Title -->
<text x="16" y="26" font-size="16" font-weight="700" fill="#222222">Elevators: continuous and cascade rigging</text>
<text x="16" y="45" font-size="12" fill="#5c5c5c">Side views. Same parts, same top height; only the rope routing differs.</text>

<!-- legend -->
<rect x="16" y="59" width="14" height="12" fill="#7d8790" stroke="#444444" stroke-width="1"/>
<text x="35" y="70" font-size="12" fill="#222222">stage 1 (fixed)</text>
<rect x="130" y="59" width="14" height="12" fill="#b0b8c0" stroke="#444444" stroke-width="1"/>
<text x="149" y="70" font-size="12" fill="#222222">stage 2</text>
<rect x="204" y="59" width="14" height="12" fill="#dfe4e9" stroke="#444444" stroke-width="1"/>
<text x="223" y="70" font-size="12" fill="#222222">carriage</text>
<line x1="290" y1="65" x2="306" y2="65" stroke="#c2410c" stroke-width="3"/>
<text x="311" y="70" font-size="12" fill="#222222">rope or belt</text>
<circle cx="398" cy="65" r="6" fill="#f2c200" stroke="#444444" stroke-width="1"/>
<text x="409" y="70" font-size="12" fill="#222222">game piece</text>

<line x1="260" y1="80" x2="260" y2="452" stroke="#e2e2e2" stroke-width="1"/>

<!-- ================= CONTINUOUS ================= -->
<g>
  <text x="130" y="92" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">CONTINUOUS</text>
  <text x="130" y="108" font-size="12" fill="#5c5c5c" text-anchor="middle">one rope; one stage moves at a time</text>

  <!-- upper soft limit (carriage top at full height) -->
  <text x="8" y="139" font-size="12" fill="#5c5c5c">upper soft limit</text>
  <line x1="8" y1="144" x2="240" y2="144" stroke="#5c5c5c" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- rope pull meter: steps when stage 2 starts to move -->
  <text x="14" y="226" font-size="12" fill="#222222">rope pull</text>
  <rect x="14" y="236" width="10" height="80" fill="#f3f3f3" stroke="#c8c8c8" stroke-width="1"/>
  <rect class="meterc" x="14" y="236" width="10" height="80" fill="#446ce3"/>
  <line x1="24" y1="268" x2="28" y2="268" stroke="#444444" stroke-width="1"/>
  <line x1="24" y1="284" x2="28" y2="284" stroke="#444444" stroke-width="1"/>
  <text x="30" y="272" font-size="12" fill="#222222">15 lb: + stage 2</text>
  <text x="30" y="288" font-size="12" fill="#222222">10 lb: carriage</text>

  <!-- encoder, motor, gearbox -->
  <text x="14" y="345" font-size="12" fill="#222222">encoder</text>
  <line x1="44" y1="349" x2="52" y2="356" stroke="#5c5c5c" stroke-width="1"/>
  <rect x="58" y="350" width="40" height="26" rx="3" fill="#333333"/>
  <text x="78" y="367" font-size="12" fill="#ffffff" text-anchor="middle">motor</text>
  <rect x="51" y="355" width="7" height="16" rx="1.5" fill="#446ce3" stroke="#444444" stroke-width="1"/>
  <rect x="98" y="354" width="18" height="18" fill="#7d8790" stroke="#444444" stroke-width="1"/>

  <!-- stage 1 (fixed) with its top pulley -->
  <rect x="116" y="224" width="12" height="160" fill="#7d8790" stroke="#444444" stroke-width="1"/>
  <rect x="128" y="219" width="12" height="6" fill="#7d8790" stroke="#444444" stroke-width="0.8"/>

  <!-- lift rope: drum up to stage 1 top pulley (fixed length), then down to stage 2's bottom pulley -->
  <rect x="132.75" y="222" width="2.5" height="142" fill="#c2410c"/>
  <rect class="r2c" x="144.75" y="222" width="2.5" height="150" fill="#c2410c"/>
  <circle cx="140" cy="222" r="6" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <path d="M134 222A6 6 0 0 1 146 222" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <circle cx="140" cy="222" r="1.5" fill="#444444"/>

  <!-- drum (spool) on the gearbox shaft -->
  <circle cx="126" cy="364" r="8" fill="#e7e9ec" stroke="#444444" stroke-width="1.2"/>
  <circle cx="126" cy="364" r="6.5" fill="none" stroke="#c2410c" stroke-width="3"/>
  <g class="drumc">
    <circle cx="126" cy="364" r="8" fill="none"/>
    <path d="M126 364L126 358.5M126 364L121.24 366.75M126 364L130.76 366.75" stroke="#444444" stroke-width="1.6"/>
  </g>
  <circle cx="126" cy="364" r="1.8" fill="#444444"/>

  <!-- stage 2 (moves), with its two pulleys and the carriage -->
  <g class="s2c">
    <rect x="160" y="230" width="12" height="150" fill="#b0b8c0" stroke="#444444" stroke-width="1"/>
    <rect x="154" y="370" width="6" height="4" fill="#b0b8c0" stroke="#444444" stroke-width="0.8"/>
    <rect x="155.75" y="232" width="2.5" height="140" fill="#c2410c"/>
    <circle cx="151.5" cy="372" r="5.5" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
    <path d="M146 372A5.5 5.5 0 0 0 157 372" fill="none" stroke="#c2410c" stroke-width="2.5"/>
    <circle cx="151.5" cy="372" r="1.5" fill="#444444"/>
    <rect class="r4c" x="173.75" y="232" width="2.5" height="112" fill="#c2410c"/>
    <circle cx="166" cy="232" r="9" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
    <path d="M157 232A9 9 0 0 1 175 232" fill="none" stroke="#c2410c" stroke-width="2.5"/>
    <circle cx="166" cy="232" r="1.8" fill="#444444"/>
    <g class="cc">
      <rect x="171" y="348" width="4" height="6" fill="#444444"/>
      <rect x="171" y="364" width="4" height="6" fill="#444444"/>
      <rect x="174" y="344" width="38" height="30" rx="2" fill="#dfe4e9" stroke="#444444" stroke-width="1.2"/>
      <circle cx="175" cy="346" r="2.2" fill="#444444"/>
      <circle cx="223" cy="359" r="11" fill="#f2c200" stroke="#444444" stroke-width="1"/>
    </g>
  </g>

  <!-- lower limit switch, pressed by the carriage at the bottom -->
  <rect x="186" y="377" width="16" height="7" fill="#5c5c5c" stroke="#444444" stroke-width="1"/>
  <line x1="189" y1="377" x2="200" y2="375" stroke="#444444" stroke-width="1.5"/>

  <line x1="36" y1="384" x2="244" y2="384" stroke="#444444" stroke-width="1.5"/>
  <text x="40" y="400" font-size="12" fill="#5c5c5c">gearbox + drum</text>
  <text x="150" y="400" font-size="12" fill="#5c5c5c">lower limit switch</text>

  <text x="12" y="418" font-size="12" font-weight="700" fill="#222222">Carriage moves at rope speed.</text>
  <text x="12" y="433" font-size="12" fill="#222222">Rope pull jumps when stage 2 starts to</text>
  <text x="12" y="448" font-size="12" fill="#222222">lift: kG is different low and high.</text>
</g>

<!-- ================= CASCADE ================= -->
<g transform="translate(260 0)">
  <text x="130" y="92" font-size="14" font-weight="700" fill="#222222" text-anchor="middle">CASCADE</text>
  <text x="130" y="108" font-size="12" fill="#5c5c5c" text-anchor="middle">a rope per stage; all stages move at once</text>

  <text x="8" y="139" font-size="12" fill="#5c5c5c">upper soft limit</text>
  <line x1="8" y1="144" x2="240" y2="144" stroke="#5c5c5c" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- rope pull meter: the same the whole way -->
  <text x="14" y="226" font-size="12" fill="#222222">rope pull</text>
  <rect x="14" y="236" width="10" height="80" fill="#446ce3" stroke="#c8c8c8" stroke-width="1"/>
  <line x1="24" y1="236.5" x2="28" y2="236.5" stroke="#444444" stroke-width="1"/>
  <text x="30" y="242" font-size="12" fill="#222222">25 lb: stage 2</text>
  <text x="30" y="258" font-size="12" fill="#222222">+ 2x carriage</text>

  <text x="14" y="345" font-size="12" fill="#222222">encoder</text>
  <line x1="44" y1="349" x2="52" y2="356" stroke="#5c5c5c" stroke-width="1"/>
  <rect x="58" y="350" width="40" height="26" rx="3" fill="#333333"/>
  <text x="78" y="367" font-size="12" fill="#ffffff" text-anchor="middle">motor</text>
  <rect x="51" y="355" width="7" height="16" rx="1.5" fill="#446ce3" stroke="#444444" stroke-width="1"/>
  <rect x="98" y="354" width="18" height="18" fill="#7d8790" stroke="#444444" stroke-width="1"/>

  <rect x="116" y="224" width="12" height="160" fill="#7d8790" stroke="#444444" stroke-width="1"/>
  <rect x="128" y="219" width="12" height="6" fill="#7d8790" stroke="#444444" stroke-width="0.8"/>
  <!-- tie point for rope 2, fixed to stage 1 -->
  <rect x="128" y="254" width="30" height="4" fill="#7d8790" stroke="#444444" stroke-width="0.8"/>

  <!-- rope 1: drum over stage 1's top pulley, down to the bottom of stage 2 -->
  <rect x="132.75" y="222" width="2.5" height="142" fill="#c2410c"/>
  <rect class="r2k" x="144.75" y="222" width="2.5" height="152" fill="#c2410c"/>
  <circle cx="140" cy="222" r="6" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
  <path d="M134 222A6 6 0 0 1 146 222" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <circle cx="140" cy="222" r="1.5" fill="#444444"/>
  <!-- rope 2, first run: from the stage 1 tie point up to stage 2's top pulley -->
  <rect class="r5k" x="155.75" y="232" width="2.5" height="24" fill="#c2410c"/>
  <circle cx="157" cy="256" r="2.2" fill="#444444"/>

  <circle cx="126" cy="364" r="8" fill="#e7e9ec" stroke="#444444" stroke-width="1.2"/>
  <circle cx="126" cy="364" r="6.5" fill="none" stroke="#c2410c" stroke-width="3"/>
  <g class="drumk">
    <circle cx="126" cy="364" r="8" fill="none"/>
    <path d="M126 364L126 358.5M126 364L121.24 366.75M126 364L130.76 366.75" stroke="#444444" stroke-width="1.6"/>
  </g>
  <circle cx="126" cy="364" r="1.8" fill="#444444"/>

  <g class="s2k">
    <rect x="160" y="230" width="12" height="150" fill="#b0b8c0" stroke="#444444" stroke-width="1"/>
    <rect x="144" y="372" width="16" height="5" fill="#b0b8c0" stroke="#444444" stroke-width="0.8"/>
    <circle cx="146" cy="374.5" r="2.2" fill="#444444"/>
    <!-- rope 2, second run: over stage 2's top pulley, down to the carriage -->
    <rect class="r4k" x="173.75" y="232" width="2.5" height="112" fill="#c2410c"/>
    <circle cx="166" cy="232" r="9" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
    <path d="M157 232A9 9 0 0 1 175 232" fill="none" stroke="#c2410c" stroke-width="2.5"/>
    <circle cx="166" cy="232" r="1.8" fill="#444444"/>
    <g class="ck">
      <rect x="171" y="348" width="4" height="6" fill="#444444"/>
      <rect x="171" y="364" width="4" height="6" fill="#444444"/>
      <rect x="174" y="344" width="38" height="30" rx="2" fill="#dfe4e9" stroke="#444444" stroke-width="1.2"/>
      <circle cx="175" cy="346" r="2.2" fill="#444444"/>
      <circle cx="223" cy="359" r="11" fill="#f2c200" stroke="#444444" stroke-width="1"/>
    </g>
  </g>

  <rect x="186" y="377" width="16" height="7" fill="#5c5c5c" stroke="#444444" stroke-width="1"/>
  <line x1="189" y1="377" x2="200" y2="375" stroke="#444444" stroke-width="1.5"/>

  <line x1="36" y1="384" x2="244" y2="384" stroke="#444444" stroke-width="1.5"/>
  <text x="40" y="400" font-size="12" fill="#5c5c5c">gearbox + drum</text>
  <text x="150" y="400" font-size="12" fill="#5c5c5c">lower limit switch</text>

  <text x="12" y="418" font-size="12" font-weight="700" fill="#222222">Carriage moves 2x as fast as stage 2.</text>
  <text x="12" y="433" font-size="12" fill="#222222">Rope pull is stage 2 + 2x carriage, the</text>
  <text x="12" y="448" font-size="12" fill="#222222">same all the way up: one kG.</text>
</g>

<line x1="16" y1="462" x2="504" y2="462" stroke="#d6d6d6" stroke-width="1"/>
<g font-size="12" fill="#5c5c5c">
  <text x="16" y="479">Example: carriage + piece 10 lb, stage 2 5 lb. Here both reach the top together,</text>
  <text x="16" y="495">so the cascade drum turns half as far but pulls harder.</text>
  <text x="16" y="511">Only the lifting ropes are drawn; a second rope or gravity brings each one down.</text>
</g>
</svg>
