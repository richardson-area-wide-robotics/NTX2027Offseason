<!-- Title -->
<text x="16" y="26" font-size="16" font-weight="700" fill="#222222">Arms (pivots)</text>
<text x="16" y="45" font-size="12" fill="#5c5c5c">Gravity always pulls straight down, but how hard it twists the joint depends on the angle.</text>

<!-- legend -->
<circle cx="22" cy="65" r="6" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
<path d="M22 65L28 65A6 6 0 0 1 22 71ZM22 65L16 65A6 6 0 0 1 22 59Z" fill="#222222"/>
<text x="33" y="70" font-size="12" fill="#222222">center of mass</text>
<path d="M140 58L140 68" stroke="#c62828" stroke-width="2.5"/>
<path d="M135.5 66.5L140 74L144.5 66.5Z" fill="#c62828"/>
<text x="150" y="70" font-size="12" fill="#222222">gravity</text>
<circle cx="208" cy="65" r="6" fill="#f2c200" stroke="#444444" stroke-width="1"/>
<text x="219" y="70" font-size="12" fill="#222222">game piece</text>

<!-- angle references (still) -->
<line x1="170" y1="240" x2="310" y2="240" stroke="#c8c8c8" stroke-width="1.2" stroke-dasharray="4 4"/>
