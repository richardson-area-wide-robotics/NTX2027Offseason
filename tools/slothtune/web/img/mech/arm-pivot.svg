<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="520" height="470" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="arm-title arm-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="arm-title">Arms (pivots)</title>
<desc id="arm-desc">Animated side view of an arm on a pivot at the top of a tower. A motor and gearbox low on the tower drive the pivot through a chain, and an absolute encoder sits on the joint's shaft. The arm starts resting on a lower hard stop, swings up through level and past straight up to an upper soft limit, holds, and swings back down. A red gravity arrow always points straight down from the arm's center of mass. Beside it, a bar shows the gravity torque at the joint, the part of a gravity feedforward that kCos times the cosine of the angle cancels: biggest when the arm is level (0 degrees), zero when it is straight up or straight down, and reversed once the arm goes past straight up. A small cosine graph has a dot that tracks the arm's angle. Notes: kCos times cos(angle) is REV's gravity feedforward for an arm, with 0 meaning level; a counterweight or gas spring carries part of the weight so the motor works less; with two joints each joint's load depends on both angles. Sources: WPILib ArmFeedforward docs; REVLib feed forward control docs; Chief Delphi; FRC 997's 2-jointed arm paper.</desc>
<style>
/* One 8 s loop: rest on the hard stop at -75 deg (0-8 %), swing up to 110 deg (8-45 %, eased),
   hold (45-55 %), swing down (55-92 %), rest. Angles from level, up positive.
   Sampled every 1.85 % so the bar and dot follow cos(angle). Without motion: the arm level. */
.arm { transform-box: view-box; transform-origin: 170px 240px; animation: arm 8s linear infinite; }
.arr { transform-box: fill-box; transform-origin: 50% 0%; animation: arr 8s linear infinite; }
.tbar { transform-box: fill-box; transform-origin: 0% 50%; animation: tbar 8s linear infinite; }
.tdot { transform: translate(72px, -56px); animation: tdot 8s linear infinite; }
