<line x1="170" y1="240" x2="170" y2="104" stroke="#c8c8c8" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="176" y="102" font-size="12" fill="#5c5c5c">90°</text>
<!-- limits -->
<line x1="170" y1="240" x2="118.7" y2="99" stroke="#5c5c5c" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="16" y="98" font-size="12" fill="#5c5c5c">upper soft limit</text>
