<text x="216" y="368" font-size="12" fill="#5c5c5c">lower limit</text>
<text x="216" y="384" font-size="12" fill="#5c5c5c">(hard stop)</text>

<!-- tower, motor, gearbox, chain (still) -->
<line x1="40" y1="392" x2="300" y2="392" stroke="#444444" stroke-width="1.5"/>
<rect x="156" y="226" width="28" height="166" rx="4" fill="#b0b8c0" stroke="#444444" stroke-width="1"/>
<rect x="104" y="330" width="46" height="22" rx="3" fill="#333333"/>
