<circle cx="163" cy="341" r="7" fill="#ffffff" stroke="#444444" stroke-width="1.2" stroke-dasharray="2.2 1.4"/>
<path d="M152 240.7L156 341.3M187.7 243.2L169.9 342.2" stroke="#444444" stroke-width="1.6" stroke-dasharray="3 1.6"/>
<rect x="171" y="297" width="8" height="8" rx="1" fill="#444444"/>
<text x="146" y="300" font-size="12" fill="#5c5c5c" text-anchor="end">chain</text>
<text x="104" y="374" font-size="12" fill="#5c5c5c">gearbox</text>
<line x1="150" y1="368" x2="158" y2="357" stroke="#5c5c5c" stroke-width="1"/>

<!-- the arm (turns about the pivot); drawn level, the animation sets its angle -->
<g class="arm">
  <circle cx="170" cy="240" r="18" fill="#e7e9ec" stroke="#444444" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="170" cy="240" r="13" fill="none" stroke="#444444" stroke-width="0.8"/>
  <circle cx="170" cy="231" r="2.5" fill="#444444"/>
  <circle cx="170" cy="249" r="2.5" fill="#444444"/>
  <rect x="160" y="233" width="116" height="14" rx="7" fill="#b0b8c0" stroke="#444444" stroke-width="1.2"/>
  <rect x="274" y="228" width="8" height="24" rx="1.5" fill="#7d8790" stroke="#444444" stroke-width="1"/>
  <circle cx="292" cy="240" r="12" fill="#f2c200" stroke="#444444" stroke-width="1"/>
  <!-- gravity arrow: turns back the other way, so it always points down -->
  <g class="arr">
    <path d="M242 240L242 272" stroke="#c62828" stroke-width="3"/>
    <path d="M236 270L242 282L248 270Z" fill="#c62828"/>
  </g>
  <circle cx="242" cy="240" r="6" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <path d="M242 240L248 240A6 6 0 0 1 242 246ZM242 240L236 240A6 6 0 0 1 242 234Z" fill="#222222"/>
</g>

<!-- pivot shaft with the absolute encoder on it (still) -->
<circle cx="170" cy="240" r="8" fill="#446ce3" stroke="#444444" stroke-width="1"/>
<circle cx="170" cy="240" r="4" fill="#ffffff" stroke="#444444" stroke-width="0.8"/>
<circle cx="170" cy="240" r="1.8" fill="#444444"/>
<text x="16" y="250" font-size="12" fill="#222222">pivot, with the</text>
<text x="16" y="266" font-size="12" fill="#222222">absolute encoder</text>
<text x="16" y="282" font-size="12" fill="#222222">on its shaft</text>
<line x1="122" y1="261" x2="161" y2="245" stroke="#5c5c5c" stroke-width="1"/>

<!-- gravity torque bar -->
<text x="334" y="96" font-size="13" font-weight="700" fill="#222222">Gravity torque at the joint</text>
<text x="334" y="112" font-size="12" fill="#5c5c5c">what kCos x cos(angle) cancels</text>
<rect x="334" y="122" width="168" height="20" fill="#f6f6f6" stroke="#c8c8c8" stroke-width="1"/>
<rect class="tbar" x="378" y="124" width="124" height="16" fill="#c62828"/>
<line x1="378" y1="118" x2="378" y2="146" stroke="#222222" stroke-width="1.2"/>
<text x="378" y="160" font-size="12" fill="#222222" text-anchor="middle">0</text>
<text x="502" y="160" font-size="12" fill="#222222" text-anchor="end">level: most</text>

<!-- cos(angle) with a dot at the arm's angle -->
<text x="334" y="190" font-size="12" fill="#5c5c5c">cos(angle)</text>
<line x1="412" y1="200" x2="412" y2="286" stroke="#e2e2e2" stroke-width="1"/>
<line x1="484" y1="200" x2="484" y2="286" stroke="#e2e2e2" stroke-width="1"/>
<line x1="340" y1="262" x2="500" y2="262" stroke="#c8c8c8" stroke-width="1"/>
<path d="M340.0 262.0L344.0 257.1L348.0 252.3L352.0 247.5L356.0 242.8L360.0 238.3L364.0 234.0L368.0 229.9L372.0 226.0L376.0 222.4L380.0 219.1L384.0 216.1L388.0 213.5L392.0 211.2L396.0 209.4L400.0 207.9L404.0 206.9L408.0 206.2L412.0 206.0L416.0 206.2L420.0 206.9L424.0 207.9L428.0 209.4L432.0 211.2L436.0 213.5L440.0 216.1L444.0 219.1L448.0 222.4L452.0 226.0L456.0 229.9L460.0 234.0L464.0 238.3L468.0 242.8L472.0 247.5L476.0 252.3L480.0 257.1L484.0 262.0L488.0 266.9L492.0 271.7L496.0 276.5L500.0 281.2" fill="none" stroke="#5c5c5c" stroke-width="1.6"/>
<circle class="tdot" cx="340" cy="262" r="5" fill="#c62828" stroke="#ffffff" stroke-width="1.2"/>
<g font-size="12" fill="#5c5c5c" text-anchor="middle">
  <text x="342" y="300">-90°</text>
  <text x="412" y="300">0°</text>
  <text x="484" y="300">90°</text>
  <text x="342" y="315">down</text>
  <text x="412" y="315">level</text>
  <text x="484" y="315">up</text>
</g>
<g font-size="12" fill="#222222">
  <text x="334" y="342">Most when level, zero when</text>
  <text x="334" y="358">straight up or straight down,</text>
  <text x="334" y="374">and it flips past straight up.</text>
</g>

<line x1="16" y1="404" x2="504" y2="404" stroke="#d6d6d6" stroke-width="1"/>
<text x="16" y="424" font-size="12" font-weight="700" fill="#222222">kCos x cos(angle): REV's gravity feedforward for an arm (0 = level).</text>
<g font-size="12" fill="#5c5c5c">
  <text x="16" y="442">A counterweight or gas spring carries part of the weight, so the motor works less.</text>
  <text x="16" y="458">Two joints: each joint's load depends on both angles, so one kCos is not enough.</text>
</g>
</svg>
