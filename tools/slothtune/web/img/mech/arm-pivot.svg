form: translate(20.07px, -23.74px); } 88.3% { transform: translate(15.62px, -18.72px); } 90.15% { transform: translate(12.91px, -15.57px); } 92% { transform: translate(12px, -14.49px); } 100% { transform: translate(12px, -14.49px); } }
