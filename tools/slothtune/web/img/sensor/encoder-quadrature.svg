<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 454" width="520" height="454" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="eq-title eq-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="eq-title">Quadrature encoder: two channels, a quarter cycle apart</title>
<desc id="eq-desc">Animated. A slotted disc turns under two sensors, A and B, placed so their signals are a quarter cycle apart. Each sensor's output is high while it is over a slot. To the right, the A and B square waves slide past a "now" line in step with the disc, with a dot on every edge: four edges per cycle. For half the loop the disc turns forward, A leads B, and the count climbs from 0 to 8 (two cycles, four edges each). For the other half it turns backward, B leads A, and the count falls back to 0. One sensor can't tell direction; two, a quarter cycle apart, can (quad = four states). Counting all 4 edges (4X): the REV Through Bore's 2048 cycles a turn are 8192 counts. Speed: count ticks in a set time, or time a set number of ticks.</desc>
<style>
  .disc { transform-origin: 112px 156px; animation: eq-spin 8s linear infinite; }
  @keyframes eq-spin {
    0% { transform: rotate(0deg); } 45% { transform: rotate(90deg); }
    50% { transform: rotate(90deg); } 95% { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
  }
  .tape { animation: eq-tape 8s linear infinite; }
  @keyframes eq-tape {
    0% { transform: translateX(0px); } 45% { transform: translateX(-160px); }
    50% { transform: translateX(-160px); } 95% { transform: translateX(0px); }
    100% { transform: translateX(0px); }
  }
  .headA { fill: #ffffff; animation: eq-headA 8s step-end infinite; }
  @keyframes eq-headA {
    0% { fill: #ffffff; } 8.4375% { fill: #446ce3; } 19.6875% { fill: #ffffff; }
    30.9375% { fill: #446ce3; } 42.1875% { fill: #ffffff; } 52.8125% { fill: #446ce3; }
    64.0625% { fill: #ffffff; } 75.3125% { fill: #446ce3; } 86.5625% { fill: #ffffff; }
    100% { fill: #ffffff; }
  }
  .headB { fill: #c2410c; animation: eq-headB 8s step-end infinite; }
  @keyframes eq-headB {
    0% { fill: #c2410c; } 2.8125% { fill: #ffffff; } 14.0625% { fill: #c2410c; }
    25.3125% { fill: #ffffff; } 36.5625% { fill: #c2410c; } 58.4375% { fill: #ffffff; }
    69.6875% { fill: #c2410c; } 80.9375% { fill: #ffffff; } 92.1875% { fill: #c2410c; }
    100% { fill: #c2410c; }
  }
  .fwd { opacity: 1; animation: eq-fwd 8s step-end infinite; }
  @keyframes eq-fwd { 0% { opacity: 1; } 47.5% { opacity: 0; } 97.5% { opacity: 1; } 100% { opacity: 1; } }
  .bwd { opacity: 0; animation: eq-bwd 8s step-end infinite; }
  @keyframes eq-bwd { 0% { opacity: 0; } 47.5% { opacity: 1; } 97.5% { opacity: 0; } 100% { opacity: 0; } }
  .fwdText { opacity: 1; animation: eq-fwdText 8s step-end infinite; }
  @keyframes eq-fwdText { 0% { opacity: 1; } 47.5% { opacity: 0.4; } 97.5% { opacity: 1; } 100% { opacity: 1; } }
  .bwdText { opacity: 0.4; animation: eq-bwdText 8s step-end infinite; }
  @keyframes eq-bwdText { 0% { opacity: 0.4; } 47.5% { opacity: 1; } 97.5% { opacity: 0.4; } 100% { opacity: 0.4; } }
  .n0 { opacity: 1; animation: eq-n0 8s step-end infinite; }
  .n1, .n2, .n3, .n4, .n5, .n6, .n7, .n8 { opacity: 0; }
  .n1 { animation: eq-n1 8s step-end infinite; }
  .n2 { animation: eq-n2 8s step-end infinite; }
  .n3 { animation: eq-n3 8s step-end infinite; }
  .n4 { animation: eq-n4 8s step-end infinite; }
  .n5 { animation: eq-n5 8s step-end infinite; }
  .n6 { animation: eq-n6 8s step-end infinite; }
  .n7 { animation: eq-n7 8s step-end infinite; }
  .n8 { animation: eq-n8 8s step-end infinite; }
  @keyframes eq-n0 { 0% { opacity: 1; } 2.8125% { opacity: 0; } 92.1875% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes eq-n1 { 0% { opacity: 0; } 2.8125% { opacity: 1; } 8.4375% { opacity: 0; } 86.5625% { opacity: 1; } 92.1875% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes eq-n2 { 0% { opacity: 0; } 8.4375% { opacity: 1; } 14.0625% { opacity: 0; } 80.9375% { opacity: 1; } 86.5625% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes eq-n3 { 0% { opacity: 0; } 14.0625% { opacity: 1; } 19.6875% { opacity: 0; } 75.3125% { opacity: 1; } 80.9375% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes eq-n4 { 0% { opacity: 0; } 19.6875% { opacity: 1; } 25.3125% { opacity: 0; } 69.6875% { opacity: 1; } 75.3125% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes eq-n5 { 0% { opacity: 0; } 25.3125% { opacity: 1; } 30.9375% { opacity: 0; } 64.0625% { opacity: 1; } 69.6875% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes eq-n6 { 0% { opacity: 0; } 30.9375% { opacity: 1; } 36.5625% { opacity: 0; } 58.4375% { opacity: 1; } 64.0625% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes eq-n7 { 0% { opacity: 0; } 36.5625% { opacity: 1; } 42.1875% { opacity: 0; } 52.8125% { opacity: 1; } 58.4375% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes eq-n8 { 0% { opacity: 0; } 42.1875% { opacity: 1; } 52.8125% { opacity: 0; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <clipPath id="eq-panel"><rect x="264" y="84" width="240" height="100"/></clipPath>
</defs>

<!-- Title -->
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Quadrature encoder: two channels, a quarter cycle apart</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">Sensors A and B read the slots of the same turning disc.</text>

<!-- Disc (turns) -->
<g class="disc">
  <circle cx="112" cy="156" r="72" fill="#b0b8c0" stroke="#444444" stroke-width="1.6"/>
  <path d="M180 156A68 68 0 0 1 174.82 182.02L152.65 172.84A44 44 0 0 0 156 156ZM160.08 204.08A68 68 0 0 1 138.02 218.82L128.84 196.65A44 44 0 0 0 143.11 187.11ZM112 224A68 68 0 0 1 85.98 218.82L95.16 196.65A44 44 0 0 0 112 200ZM63.92 204.08A68 68 0 0 1 49.18 182.02L71.35 172.84A44 44 0 0 0 80.89 187.11ZM44 156A68 68 0 0 1 49.18 129.98L71.35 139.16A44 44 0 0 0 68 156ZM63.92 107.92A68 68 0 0 1 85.98 93.18L95.16 115.35A44 44 0 0 0 80.89 124.89ZM112 88A68 68 0 0 1 138.02 93.18L128.84 115.35A44 44 0 0 0 112 112ZM160.08 107.92A68 68 0 0 1 174.82 129.98L152.65 139.16A44 44 0 0 0 143.11 124.89Z" fill="#ffffff" stroke="#444444" stroke-width="1"/>
  <circle cx="112" cy="156" r="18" fill="#d5dade" stroke="#444444" stroke-width="1.2"/>
  <polygon points="120,156 116,162.93 108,162.93 104,156 108,149.07 116,149.07" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
</g>

<!-- Sensors A and B (fixed; filled while over a slot) -->
<rect class="headA" x="-17" y="-4.5" width="34" height="9" rx="2" stroke="#446ce3" stroke-width="2.2" transform="translate(68.71 120.47) rotate(-140.625)"/>
<rect class="headB" x="-17" y="-4.5" width="34" height="9" rx="2" stroke="#c2410c" stroke-width="2.2" transform="translate(155.29 120.47) rotate(-39.375)"/>
<g font-size="15" font-weight="700" text-anchor="middle">
  <text x="40" y="99" fill="#446ce3">A</text>
  <text x="184" y="99" fill="#c2410c">B</text>
</g>

<!-- Direction arrows under the disc -->
<g class="fwd" fill="#222222">
  <path d="M149.56 226.64A80 80 0 0 1 74.44 226.64" fill="none" stroke="#222222" stroke-width="2"/>
  <path d="M68.43 223.09L78.70 223.80L73.25 232.19Z"/>
</g>
<g class="bwd" fill="#222222">
  <path d="M74.44 226.64A80 80 0 0 0 149.56 226.64" fill="none" stroke="#222222" stroke-width="2"/>
  <path d="M155.57 223.09L150.75 232.19L145.30 223.80Z"/>
</g>

<!-- Direction notes (the active one is highlighted) -->
<rect class="fwd" x="16" y="250" width="212" height="22" rx="4" fill="#eef2fd"/>
<rect class="bwd" x="16" y="275" width="212" height="22" rx="4" fill="#eef2fd"/>
<g font-size="14" font-weight="700" fill="#222222">
  <text class="fwdText" x="24" y="266"><tspan fill="#446ce3">A</tspan> leads <tspan fill="#c2410c">B</tspan>: forward</text>
  <text class="bwdText" x="24" y="291"><tspan fill="#c2410c">B</tspan> leads <tspan fill="#446ce3">A</tspan>: backward</text>
</g>

<!-- Waveform panel -->
<text x="244" y="74" font-size="13" font-weight="700" fill="#222222">Sensor outputs</text>
<text x="384" y="74" font-size="12" fill="#5c5c5c" text-anchor="middle">now</text>
<rect x="264" y="84" width="240" height="100" fill="#fafafa" stroke="#d6d6d6" stroke-width="1"/>
<g font-size="15" font-weight="700" text-anchor="middle">
  <text x="252" y="116" fill="#446ce3">A</text>
  <text x="252" y="164" fill="#c2410c">B</text>
</g>
<g clip-path="url(#eq-panel)">
  <g class="tape">
    <g fill="#446ce3" fill-opacity="0.13">
      <rect x="254" y="98" width="40" height="26"/><rect x="334" y="98" width="40" height="26"/>
      <rect x="414" y="98" width="40" height="26"/><rect x="494" y="98" width="40" height="26"/>
      <rect x="574" y="98" width="40" height="26"/><rect x="654" y="98" width="40" height="26"/>
    </g>
    <g fill="#c2410c" fill-opacity="0.13">
      <rect x="274" y="146" width="40" height="26"/><rect x="354" y="146" width="40" height="26"/>
      <rect x="434" y="146" width="40" height="26"/><rect x="514" y="146" width="40" height="26"/>
      <rect x="594" y="146" width="40" height="26"/><rect x="674" y="146" width="20" height="26"/>
    </g>
    <path d="M240 124H254V98H294V124H334V98H374V124H414V98H454V124H494V98H534V124H574V98H614V124H654V98H694" fill="none" stroke="#446ce3" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M240 172H274V146H314V172H354V146H394V172H434V146H474V172H514V146H554V172H594V146H634V172H674V146H694" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linejoin="round"/>
    <g fill="#446ce3" stroke="#ffffff" stroke-width="1">
      <circle cx="254" cy="111" r="3.6"/><circle cx="294" cy="111" r="3.6"/><circle cx="334" cy="111" r="3.6"/>
      <circle cx="374" cy="111" r="3.6"/><circle cx="414" cy="111" r="3.6"/><circle cx="454" cy="111" r="3.6"/>
      <circle cx="494" cy="111" r="3.6"/><circle cx="534" cy="111" r="3.6"/><circle cx="574" cy="111" r="3.6"/>
      <circle cx="614" cy="111" r="3.6"/><circle cx="654" cy="111" r="3.6"/>
    </g>
    <g fill="#c2410c" stroke="#ffffff" stroke-width="1">
      <circle cx="274" cy="159" r="3.6"/><circle cx="314" cy="159" r="3.6"/><circle cx="354" cy="159" r="3.6"/>
      <circle cx="394" cy="159" r="3.6"/><circle cx="434" cy="159" r="3.6"/><circle cx="474" cy="159" r="3.6"/>
      <circle cx="514" cy="159" r="3.6"/><circle cx="554" cy="159" r="3.6"/><circle cx="594" cy="159" r="3.6"/>
      <circle cx="634" cy="159" r="3.6"/><circle cx="674" cy="159" r="3.6"/>
    </g>
  </g>
</g>
<line x1="384" y1="80" x2="384" y2="190" stroke="#222222" stroke-width="1.4" stroke-dasharray="4 3"/>

<!-- Count readout under the "now" line -->
<rect x="334" y="190" width="100" height="25" rx="4" fill="#ffffff" stroke="#444444" stroke-width="1.2"/>
<text x="384" y="207" font-size="13" fill="#5c5c5c" text-anchor="end">count:</text>
<g font-size="14" font-weight="700" fill="#222222">
  <text class="n0" x="392" y="208">0</text>
  <text class="n1" x="392" y="208">1</text>
  <text class="n2" x="392" y="208">2</text>
  <text class="n3" x="392" y="208">3</text>
  <text class="n4" x="392" y="208">4</text>
  <text class="n5" x="392" y="208">5</text>
  <text class="n6" x="392" y="208">6</text>
  <text class="n7" x="392" y="208">7</text>
  <text class="n8" x="392" y="208">8</text>
</g>

<!-- Panel legend -->
<g font-size="12" fill="#5c5c5c">
  <text x="264" y="236">High = that sensor is over a slot.</text>
  <circle cx="268" cy="250" r="3.6" fill="#5c5c5c"/>
  <text x="276" y="254">Dots mark the edges: 4 per cycle.</text>
</g>

<line x1="16" y1="306" x2="504" y2="306" stroke="#d6d6d6" stroke-width="1"/>

<!-- Rules -->
<g fill="#222222">
  <circle cx="21" cy="321" r="2.5"/>
  <circle cx="21" cy="363" r="2.5"/>
  <circle cx="21" cy="405" r="2.5"/>
</g>
<g font-size="14" fill="#222222">
  <text x="30" y="326">One sensor can't tell direction; two, a quarter cycle apart,</text>
  <text x="30" y="344">can (quad = four states).</text>
  <text x="30" y="368">Counting all 4 edges (4X): the REV Through Bore's 2048 cycles</text>
  <text x="30" y="386">a turn are 8192 counts.</text>
  <text x="30" y="410">Speed: count ticks in a set time, or time a set number of ticks.</text>
</g>
<text x="16" y="440" font-size="12" fill="#5c5c5c">After Spectrum 3847's Encoders lesson and WPILib's encoder docs.</text>
</svg>
