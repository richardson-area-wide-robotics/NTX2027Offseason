<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 446" width="520" height="446" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="pr-title pr-desc">
<title id="pr-title">Pull-up and pull-down resistors</title>
<desc id="pr-desc">Animated. Top: an input pin connected to nothing is floating; it picks up stray electrical noise, and its reading flickers between high and low at random. Left: a pull-up resistor inside the roboRIO connects the DIO input to the supply, and a switch outside connects the input to ground. The switch closes and opens in a loop. Open, the resistor gently pulls the input high and it reads TRUE. Closed, the switch overpowers the resistor and pulls the input low, so it reads FALSE, while a small current, limited by the resistor, trickles through it. Right: a pull-down resistor inside SystemCore connects the Smart I/O input to ground, and the switch goes to 3.3 V. Open reads FALSE; closed reads TRUE. Same switch, opposite readings: code written for one reads backwards on the other.</desc>
<style>
/* One 6 s loop. Both switches move together: open 0-18 %, closing 18-25 %, closed 25-62 %, opening 62-69 %.
   The readings change the moment the contact touches (25 %) and lets go (62 %). */
.blade { transform-box: view-box; transform: rotate(30deg); animation: blade 6s linear infinite; }
.bL { transform-origin: 84px 284px; }
.bR { transform-origin: 336px 202px; }
@keyframes blade {
  0%, 18% { transform: rotate(30deg); }
  25%, 62% { transform: rotate(0deg); }
  69%, 100% { transform: rotate(30deg); }
}
/* what is true only while the switch is closed: the other reading, and the current */
.on { opacity: 0; animation: on 6s linear infinite; }
@keyframes on { 0%, 24.9% { opacity: 0; } 25%, 62% { opacity: 1; } 62.1%, 100% { opacity: 0; } }
/* the trickle: dots step one gap per second, so the 1 s loop repeats seamlessly */
.dripL { animation: dripL 1s linear infinite; }
@keyframes dripL { from { transform: translateY(0); } to { transform: translateY(22px); } }
.dripR { animation: dripR 1s linear infinite; }
@keyframes dripR { from { transform: translateY(0); } to { transform: translateY(24px); } }
/* the floating input: HIGH covers LOW at irregular moments */
.flhi { animation: flick 6s linear infinite; }
@keyframes flick {
  0%, 6% { opacity: 1; } 6.1%, 8.9% { opacity: 0; } 9%, 11% { opacity: 1; } 11.1%, 16.9% { opacity: 0; }
  17%, 29% { opacity: 1; } 29.1%, 32.9% { opacity: 0; } 33%, 35% { opacity: 1; } 35.1%, 40.9% { opacity: 0; }
  41%, 44% { opacity: 1; } 44.1%, 51.9% { opacity: 0; } 52%, 63% { opacity: 1; } 63.1%, 65.9% { opacity: 0; }
  66%, 67.5% { opacity: 1; } 67.6%, 72.9% { opacity: 0; } 73%, 80% { opacity: 1; } 80.1%, 85.9% { opacity: 0; }
  86%, 88% { opacity: 1; } 88.1%, 92.9% { opacity: 0; } 93%, 100% { opacity: 1; }
}
.noise { animation: noise 6s linear infinite; }
@keyframes noise {
  0% { opacity: 0.3; } 6% { opacity: 1; } 9% { opacity: 0.4; } 11% { opacity: 0.9; } 17% { opacity: 0.5; }
  23% { opacity: 0.25; } 29% { opacity: 1; } 33% { opacity: 0.6; } 41% { opacity: 1; } 47% { opacity: 0.3; }
  52% { opacity: 0.9; } 58% { opacity: 0.35; } 63% { opacity: 1; } 67% { opacity: 0.8; } 73% { opacity: 0.4; }
  80% { opacity: 1; } 86% { opacity: 0.6; } 93% { opacity: 0.9; } 100% { opacity: 0.3; }
}
.flq { opacity: 0; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .flq { opacity: 1; } }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="26" font-size="16" font-weight="700" fill="#222222">Pull-up and pull-down resistors</text>
<text x="16" y="44" font-size="12" fill="#5c5c5c">Switch open: the resistor sets the reading. Switch closed: the switch overpowers it.</text>

<!-- ===== Floating input: no resistor ===== -->
<rect x="16" y="54" width="488" height="58" rx="6" fill="#f7f7f7" stroke="#d6d6d6"/>
<rect x="28" y="68" width="46" height="30" rx="3" fill="#ffffff" stroke="#444444" stroke-width="1.4"/>
<text x="51" y="87" font-size="12" fill="#222222" text-anchor="middle">input</text>
<line x1="74" y1="83" x2="104" y2="83" stroke="#444444" stroke-width="1.6"/>
<circle cx="107" cy="83" r="3" fill="#ffffff" stroke="#444444" stroke-width="1.4"/>
<text x="124" y="70" font-size="12" fill="#5c5c5c" text-anchor="middle">noise</text>
<path class="noise" d="M112 84 q3 -9 6 0 t6 0 t6 0 t6 0" fill="none" stroke="#5c5c5c" stroke-width="1.6"/>
<g font-size="13" font-weight="700" text-anchor="middle">
  <rect x="146" y="70" width="56" height="26" rx="4" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="1.4"/>
  <text x="174" y="88" fill="#1f5fbf">LOW</text>
  <g class="flhi">
    <rect x="146" y="70" width="56" height="26" rx="4" fill="#fdeee6" stroke="#c2410c" stroke-width="1.4"/>
    <text x="174" y="88" fill="#c2410c">HIGH</text>
  </g>
  <g class="flq">
    <rect x="146" y="70" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#5c5c5c" stroke-width="1.4"/>
    <text x="174" y="87" font-size="12" fill="#5c5c5c">random</text>
  </g>
</g>
<text x="216" y="73" font-size="13" font-weight="700" fill="#222222">Floating input: no resistor</text>
<text x="216" y="89" font-size="12" fill="#222222">Connected to nothing, it picks up stray electrical</text>
<text x="216" y="104" font-size="12" fill="#222222">noise and reads high or low at random.</text>

<!-- ===== Left: pull-up (roboRIO DIO) ===== -->
<text x="20" y="134" font-size="13" font-weight="700" fill="#222222">Pull-up: resistor to the supply</text>
<rect x="20" y="144" width="230" height="96" rx="6" fill="#fafafa" stroke="#9a9a9a" stroke-dasharray="5 4"/>
<text x="242" y="160" font-size="12" fill="#5c5c5c" text-anchor="end">inside the roboRIO</text>
<text x="70" y="166" font-size="12" fill="#5c5c5c" text-anchor="end">supply</text>
<line x1="72" y1="162" x2="96" y2="162" stroke="#444444" stroke-width="2.4"/>
<path d="M84 162 V168 L90 171 L78 176 L90 181 L78 186 L90 191 L78 196 L84 199 V251" fill="none" stroke="#444444" stroke-width="1.6" stroke-linejoin="round"/>
<text x="98" y="179" font-size="12" font-weight="700" fill="#222222">pull-up</text>
<text x="98" y="193" font-size="12" fill="#5c5c5c">resistor</text>
<rect x="81" y="236" width="6" height="8" fill="#444444"/>
<!-- input wire and reading: HIGH = TRUE while open; LOW = FALSE while closed -->
<line x1="84" y1="220" x2="150" y2="220" stroke="#c2410c" stroke-width="2.4"/>
<text x="104" y="214" font-size="12" fill="#5c5c5c">input</text>
<rect x="150" y="208" width="94" height="24" rx="4" fill="#fdeee6" stroke="#c2410c" stroke-width="1.4"/>
<text x="197" y="225" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">HIGH = TRUE</text>
<g class="on">
  <line x1="84" y1="220" x2="150" y2="220" stroke="#1f5fbf" stroke-width="2.4"/>
  <rect x="150" y="208" width="94" height="24" rx="4" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="1.4"/>
  <text x="197" y="225" font-size="12" font-weight="700" fill="#1f5fbf" text-anchor="middle">LOW = FALSE</text>
</g>
<circle cx="84" cy="220" r="3" fill="#222222"/>
<!-- the switch to ground, outside -->
<circle cx="84" cy="254" r="3" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
<path d="M84 287 V296 M72 296 H96 M76 300 H92 M80 304 H88" fill="none" stroke="#444444" stroke-width="1.6"/>
<line class="blade bL" x1="84" y1="284" x2="84" y2="255" stroke="#444444" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="84" cy="284" r="3" fill="#444444"/>
<text x="110" y="274" font-size="12" fill="#5c5c5c">switch</text>
<text x="102" y="303" font-size="12" fill="#5c5c5c">ground</text>
<g class="on">
  <g class="dripL" fill="#f2c200" stroke="#8a6a00" stroke-width="1">
    <circle cx="84" cy="162" r="3.2"/><circle cx="84" cy="184" r="3.2"/><circle cx="84" cy="206" r="3.2"/>
    <circle cx="84" cy="228" r="3.2"/><circle cx="84" cy="250" r="3.2"/><circle cx="84" cy="272" r="3.2"/>
  </g>
</g>

<!-- ===== Right: pull-down (SystemCore Smart I/O) ===== -->
<text x="272" y="134" font-size="13" font-weight="700" fill="#222222">Pull-down: resistor to ground</text>
<rect x="272" y="214" width="230" height="88" rx="6" fill="#fafafa" stroke="#9a9a9a" stroke-dasharray="5 4"/>
<text x="494" y="296" font-size="12" fill="#5c5c5c" text-anchor="end">inside SystemCore</text>
<text x="322" y="166" font-size="12" fill="#5c5c5c" text-anchor="end">3.3 V</text>
<line x1="324" y1="162" x2="348" y2="162" stroke="#444444" stroke-width="2.4"/>
<line x1="336" y1="162" x2="336" y2="169" stroke="#444444" stroke-width="1.6"/>
<circle cx="336" cy="172" r="3" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
<line class="blade bR" x1="336" y1="202" x2="336" y2="173" stroke="#444444" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="336" cy="202" r="3" fill="#444444"/>
<text x="362" y="192" font-size="12" fill="#5c5c5c">switch</text>
<path d="M336 205 V238 L342 241 L330 246 L342 251 L330 256 L342 261 L330 266 L336 269 V284 M324 284 H348 M328 288 H344 M332 292 H340" fill="none" stroke="#444444" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="333" y="210" width="6" height="8" fill="#444444"/>
<text x="350" y="258" font-size="12" font-weight="700" fill="#222222">pull-down</text>
<text x="350" y="272" font-size="12" fill="#5c5c5c">resistor</text>
<text x="354" y="291" font-size="12" fill="#5c5c5c">ground</text>
<!-- input wire and reading: LOW = FALSE while open; HIGH = TRUE while closed -->
<line x1="336" y1="232" x2="404" y2="232" stroke="#1f5fbf" stroke-width="2.4"/>
<text x="356" y="226" font-size="12" fill="#5c5c5c">input</text>
<rect x="404" y="220" width="94" height="24" rx="4" fill="#e8f0fb" stroke="#1f5fbf" stroke-width="1.4"/>
<text x="451" y="237" font-size="12" font-weight="700" fill="#1f5fbf" text-anchor="middle">LOW = FALSE</text>
<g class="on">
  <line x1="336" y1="232" x2="404" y2="232" stroke="#c2410c" stroke-width="2.4"/>
  <rect x="404" y="220" width="94" height="24" rx="4" fill="#fdeee6" stroke="#c2410c" stroke-width="1.4"/>
  <text x="451" y="237" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">HIGH = TRUE</text>
</g>
<circle cx="336" cy="232" r="3" fill="#222222"/>
<g class="on">
  <g class="dripR" fill="#f2c200" stroke="#8a6a00" stroke-width="1">
    <circle cx="336" cy="162" r="3.2"/><circle cx="336" cy="186" r="3.2"/><circle cx="336" cy="210" r="3.2"/>
    <circle cx="336" cy="234" r="3.2"/><circle cx="336" cy="258" r="3.2"/>
  </g>
</g>

<!-- ===== Labels ===== -->
<g font-size="13" font-weight="700" fill="#222222">
  <text x="20" y="324">roboRIO DIO:</text>
  <text x="20" y="340">pull-up inside.</text>
  <text x="272" y="324">SystemCore Smart I/O:</text>
  <text x="272" y="340">pull-down inside (3.3 V).</text>
</g>
<g font-size="12" fill="#222222">
  <text x="20" y="357">Switch to ground.</text>
  <text x="20" y="373">Open: reads <tspan font-weight="700" fill="#c2410c">TRUE</tspan>; closed: <tspan font-weight="700" fill="#1f5fbf">FALSE</tspan>.</text>
  <text x="272" y="357">Switch to 3.3 V.</text>
  <text x="272" y="373">Open: reads <tspan font-weight="700" fill="#1f5fbf">FALSE</tspan>; closed: <tspan font-weight="700" fill="#c2410c">TRUE</tspan>.</text>
</g>

<line x1="16" y1="386" x2="504" y2="386" stroke="#e2e2e2"/>
<circle cx="22" cy="400" r="3.2" fill="#f2c200" stroke="#8a6a00" stroke-width="1"/>
<text x="32" y="404" font-size="12" fill="#222222">A small current, limited by the resistor, flows only while the switch is closed.</text>
<g font-size="13" fill="#222222">
  <text x="16" y="424"><tspan font-weight="700">Same switch, opposite readings:</tspan> code written for one reads</text>
  <text x="16" y="440">backwards on the other.</text>
</g>
</svg>
