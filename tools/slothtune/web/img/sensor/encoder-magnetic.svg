  @keyframes mg-r2 { 0% { transform: scaleX(0); } 25% { transform: scaleX(0); } 25.01% { transform: scaleX(1); } 27.5% { transform: scaleX(0.994); } 30% { transform: scaleX(0.976); } 32.5% { transform: scaleX(0.946); } 35% { transform: scaleX(0.905); } 37.5% { transform: scaleX(0.854); } 40% { transform: scaleX(0.794); } 42.5% { transform: scaleX(0.727); } 45% { transform: scaleX(0.655); } 47.5% { transform: scaleX(0.578); } 50% { transform: scaleX(0.5); } 52.5% { transform: scaleX(0.422); } 55% { transform: scaleX(0.345); } 57.5% { transform: scaleX(0.273); } 60% { transform: scaleX(0.206); } 62.5% { transform: scaleX(0.146); } 65% { transform: scaleX(0.095); } 67.5% { transform: scaleX(0.054); } 70% { transform: scaleX(0.024); } 72.5% { transform: scaleX(0.006); } 75% { transform: scaleX(0); } 100% { transform: scaleX(0); } }
  .pw { transform-box: fill-box; transform-origin: left center; transform: scaleX(0.27); animation: mg-pw 8s linear infinite; }
  @keyframes mg-pw { 0% { transform: scaleX(0.27); } 74.99% { transform: scaleX(0.96); } 75% { transform: scaleX(0.04); } 100% { transform: scaleX(0.27); } }
  .pf { transform: translateX(29.7px); animation: mg-pf 8s linear infinite; }
  @keyframes mg-pf { 0% { transform: translateX(29.7px); } 74.99% { transform: translateX(105.6px); } 75% { transform: translateX(4.4px); } 100% { transform: translateX(29.7px); } }
  .pl { transform-box: fill-box; transform-origin: right center; transform: scaleX(0.73); animation: mg-pl 8s linear infinite; }
  @keyframes mg-pl { 0% { transform: scaleX(0.73); } 74.99% { transform: scaleX(0.04); } 75% { transform: scaleX(0.96); } 100% { transform: scaleX(0.73); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="mg-cyl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
    <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.3"/>
    <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
