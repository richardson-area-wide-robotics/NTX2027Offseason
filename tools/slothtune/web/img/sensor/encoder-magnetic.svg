  @keyframes mg-turn { 0% { transform: rotate(90deg); } 100% { transform: rotate(450deg); } }
  .let { transform-box: fill-box; transform-origin: center; transform: rotate(-90deg); animation: mg-unturn 8s linear infinite; }
  @keyframes mg-unturn { 0% { transform: rotate(-90deg); } 100% { transform: rotate(-450deg); } }
  .arc { stroke-dasharray: 314.16 314.16; stroke-dashoffset: 235.62; animation: mg-arc 8s linear infinite; }
  @keyframes mg-arc {
