<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="mg-title mg-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="mg-title">Magnetic absolute encoder: a magnet and a chip</title>
<desc id="mg-desc">Animated. Side view: a shaft carries a disc magnet that is half north (red) and half south (blue) across its diameter; it spins just above a sensor chip, a grid of Hall elements on a circuit board. Top view: the magnet's north-south split turns over the chip, and a needle and arc show the angle, 0 to 360 degrees. Below, the duty-cycle output: the period stays fixed while the high time grows with the angle, shortest at 0 degrees and longest at 360, dropping back to shortest as the angle rolls over from 360 to 0. The chip reads which way the magnet's field points: the angle, even right after power-on. Duty cycle: the pulse is high for a share of each period that says the angle (REV Through Bore V2: 1 kHz, 12-bit; V1: about 976 Hz, 10-bit). Zero it with an offset, set so the 360 to 0 rollover isn't inside the mechanism's travel. REV Through Bore (MA600 chip on V2), CTRE CANcoder, Thrifty encoder: all a diametrically polarized magnet.</desc>
<style>
