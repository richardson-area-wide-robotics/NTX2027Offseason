<g font-size="14" fill="#222222">
  <text x="30" y="352">Duty cycle: the pulse is high for a share of each period that says the</text>
  <text x="30" y="370">angle (REV Through Bore V2: 1 kHz, 12-bit; V1: about 976 Hz, 10-bit).</text>
