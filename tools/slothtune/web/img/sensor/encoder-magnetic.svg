<!-- Title -->
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Magnetic absolute encoder: a magnet and a chip</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">The chip reads which way the magnet's field points: the angle, even right after power-on.</text>

