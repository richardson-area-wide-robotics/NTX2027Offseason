<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 456" width="520" height="456" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="lim-title lim-desc">
<rect width="100%" height="100%" fill="#ffffff"/>
<title id="lim-title">Touch and magnetic limit switches</title>
<desc id="lim-desc">Animated wiring of limit switches to a roboRIO digital input. Top left, normally open: a lever switch is wired between a roboRIO DIO signal pin and ground, with the roboRIO's internal pull-up resistor drawn. A robot arm comes down, presses the lever and pushes the contact closed, then lifts away, in a loop. Not pressed, the circuit is open and DigitalInput reads TRUE; pressed, it is closed to ground and reads FALSE. Top right: real contacts bounce for a few milliseconds when they close, so debounce in code. Bottom left, normally closed, which WPILib calls the safer way: pressed opens the circuit and reads TRUE, not pressed reads FALSE, and a broken wire also reads TRUE, as if pressed: the safe way to fail. Bottom right, the REV Magnetic Limit Switch (Hall effect): a magnet slides over the top of the sensor and back. Its output is active-low: LOW, so FALSE, when the magnet is near. It triggers about 0.4 in (10 mm) from the top, with either pole.</desc>
<style>
/* One 6 s loop: press 28-36 %, held 36-64 %, release 64-72 %. */
.arm{animation:arm 6s linear infinite}
@keyframes arm{0%,22%{transform:translateY(0)}28%{transform:translateY(11px)}36%,64%{transform:translateY(35px)}72%{transform:translateY(11px)}78%,100%{transform:translateY(0)}}
.lever{transform-origin:196px 163px;animation:lever 6s linear infinite}
@keyframes lever{0%,28%{transform:rotate(0deg)}36%,64%{transform:rotate(13deg)}72%,100%{transform:rotate(0deg)}}
.plunger{animation:plunger 6s linear infinite}
@keyframes plunger{0%,28%{transform:translateY(0)}36%,64%{transform:translateY(14.5px)}72%,100%{transform:translateY(0)}}
.blade{transform-origin:204px 196px;animation:blade 6s linear infinite}
@keyframes blade{0%,28%{transform:rotate(0deg)}36%,64%{transform:rotate(15.7deg)}72%,100%{transform:rotate(0deg)}}
.noT{animation:noT 6s linear infinite}
@keyframes noT{0%,35.9%{opacity:1}36%,63.9%{opacity:0}64%,100%{opacity:1}}
.noF{opacity:0;animation:noF 6s linear infinite}
@keyframes noF{0%,35.9%{opacity:0}36%,63.9%{opacity:1}64%,100%{opacity:0}}
.ncp{animation:ncp 6s linear infinite}
@keyframes ncp{0%,28%{transform:translateY(0)}36%,64%{transform:translateY(9px)}72%,100%{transform:translateY(0)}}
.ncF{animation:ncF 6s linear infinite}
@keyframes ncF{0%,28.9%{opacity:1}29%,71.9%{opacity:0}72%,100%{opacity:1}}
.ncT{opacity:0;animation:ncT 6s linear infinite}
@keyframes ncT{0%,28.9%{opacity:0}29%,71.9%{opacity:1}72%,100%{opacity:0}}
.mag{animation:mag 6s linear infinite}
@keyframes mag{0%,22%{transform:translateX(0)}36%,64%{transform:translateX(48px)}78%,100%{transform:translateX(0)}}
.magH{animation:magH 6s linear infinite}
@keyframes magH{0%,32.4%{opacity:1}32.5%,67.4%{opacity:0}67.5%,100%{opacity:1}}
.magL,.zoneOn{opacity:0;animation:magL 6s linear infinite}
@keyframes magL{0%,32.4%{opacity:0}32.5%,67.4%{opacity:1}67.5%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>

<!-- Title -->
<text x="16" y="28" font-size="16" font-weight="700" fill="#222222">Touch and magnetic limit switches</text>
<text x="16" y="47" font-size="12" fill="#5c5c5c">The pull-up makes an open circuit read TRUE; closed to ground reads FALSE.</text>

<!-- ===== Normally open, with the roboRIO's pull-up ===== -->
<text x="16" y="76" font-size="13" font-weight="700" fill="#222222">Normally open (NO)</text>
<rect x="18" y="92" width="108" height="148" rx="4" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
<text x="28" y="110" font-size="13" font-weight="700" fill="#222222">roboRIO</text>
<text x="28" y="126" font-size="12" fill="#5c5c5c">DIO port</text>
<g stroke="#444444" stroke-width="1.6" fill="none" stroke-linejoin="round">
  <line x1="62" y1="146" x2="78" y2="146"/>
  <path d="M70 146 V158 L76 161 L64 166 L76 171 L64 176 L76 181 L70 184 V196 H126"/>
  <path d="M126 222 H70 V227"/>
  <line x1="60" y1="227" x2="80" y2="227"/>
  <line x1="64" y1="231" x2="76" y2="231"/>
  <line x1="68" y1="235" x2="72" y2="235"/>
</g>
<circle cx="70" cy="196" r="2.8" fill="#222222"/>
<g font-size="12" fill="#5c5c5c">
  <text x="58" y="150" text-anchor="end">+V</text>
  <text x="81" y="175">pull-up</text>
</g>
<rect x="123" y="192" width="6" height="8" fill="#444444"/>
<rect x="123" y="218" width="6" height="8" fill="#444444"/>
<!-- wires to the switch -->
<g stroke="#444444" stroke-width="1.6">
  <line x1="129" y1="196" x2="186" y2="196"/>
  <line x1="129" y1="222" x2="186" y2="222"/>
</g>
<g font-size="12" fill="#5c5c5c" text-anchor="middle">
  <text x="157" y="190">signal</text>
  <text x="157" y="216">ground</text>
</g>
<!-- lever switch: body, plunger, internal contacts, lever -->
<rect x="186" y="168" width="94" height="68" rx="4" fill="#eef1f4" stroke="#444444" stroke-width="1.6"/>
<rect class="plunger" x="250" y="150" width="10" height="39" rx="1.5" fill="#b0b8c0" stroke="#444444" stroke-width="1.2"/>
<g font-size="12" fill="#5c5c5c">
  <text x="191" y="190">C</text>
  <text x="191" y="217">NO</text>
</g>
<g stroke="#444444" stroke-width="1.6" fill="none">
  <line x1="186" y1="196" x2="204" y2="196"/>
  <path d="M186 222 H262 V209"/>
</g>
<rect x="255" y="205" width="14" height="4" fill="#444444"/>
<line class="blade" x1="204" y1="196" x2="262" y2="189" stroke="#444444" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="204" cy="196" r="3" fill="#222222"/>
<g class="lever">
  <line x1="196" y1="163" x2="300" y2="139" stroke="#5c5c5c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="139" r="6" fill="#ffffff" stroke="#444444" stroke-width="1.6"/>
</g>
<circle cx="196" cy="163" r="3.2" fill="#444444"/>
<!-- the robot arm that presses it -->
<g class="arm">
  <rect x="278" y="98" width="52" height="24" rx="2" fill="#b0b8c0" stroke="#444444" stroke-width="1.4"/>
</g>
<text x="272" y="112" font-size="12" fill="#5c5c5c" text-anchor="end">arm comes down</text>
<text x="300" y="250" font-size="12" fill="#5c5c5c" text-anchor="end">lever switch</text>
<!-- readout -->
<g font-size="13" fill="#222222">
  <text class="noT" x="16" y="264">Not pressed: open circuit, reads <tspan font-weight="700" fill="#446ce3">TRUE</tspan></text>
  <text class="noF" x="16" y="264">Pressed: closed to ground, reads <tspan font-weight="700" fill="#446ce3">FALSE</tspan></text>
</g>

<line x1="338" y1="64" x2="338" y2="266" stroke="#d6d6d6" stroke-width="1"/>

<!-- ===== Contact bounce ===== -->
<text x="346" y="76" font-size="13" font-weight="700" fill="#222222">Contact bounce</text>
<g font-size="12" fill="#5c5c5c" text-anchor="end">
  <text x="384" y="104">TRUE</text>
  <text x="384" y="150">FALSE</text>
</g>
<line x1="388" y1="160" x2="502" y2="160" stroke="#d6d6d6" stroke-width="1"/>
<polyline points="390,100 424,100 424,146 428,146 428,104 431,104 431,146 434,146 434,114 436,114 436,146 500,146" fill="none" stroke="#446ce3" stroke-width="2" stroke-linejoin="round"/>
<path d="M423 164 V168 H437 V164" fill="none" stroke="#5c5c5c" stroke-width="1"/>
<text x="430" y="182" font-size="12" fill="#5c5c5c" text-anchor="middle">a few ms</text>
<g font-size="12" fill="#222222">
  <text x="346" y="206">Real contacts bounce for</text>
  <text x="346" y="222">a few milliseconds when</text>
  <text x="346" y="238">they close: <tspan font-weight="700">debounce</tspan></text>
  <text x="346" y="254"><tspan font-weight="700">in code.</tspan></text>
</g>

<line x1="16" y1="276" x2="504" y2="276" stroke="#d6d6d6" stroke-width="1"/>

<!-- ===== Normally closed ===== -->
<text x="16" y="296" font-size="13" font-weight="700" fill="#222222">Normally closed (NC)</text>
<text x="16" y="311" font-size="12" fill="#5c5c5c">WPILib calls this the safer way.</text>
<!-- (a) animated -->
<g font-size="12" fill="#5c5c5c">
  <text x="16" y="342">signal</text>
  <text x="184" y="342">ground</text>
</g>
<g stroke="#444444" stroke-width="1.6" fill="none">
  <line x1="56" y1="338" x2="84" y2="338"/>
  <line x1="136" y1="338" x2="170" y2="338"/>
  <path d="M170 338 V344 M161 344 H179 M164.5 348 H175.5 M168 352 H172"/>
</g>
<circle cx="86" cy="338" r="3" fill="#222222"/>
<circle cx="134" cy="338" r="3" fill="#222222"/>
<g class="ncp" stroke="#444444" stroke-linecap="round">
  <line x1="82" y1="342.5" x2="138" y2="342.5" stroke-width="3"/>
  <line x1="110" y1="342" x2="110" y2="321" stroke-width="1.6"/>
  <line x1="103" y1="321" x2="117" y2="321" stroke-width="2.6"/>
</g>
<g font-size="13" fill="#222222">
  <text class="ncF" x="16" y="372">Not pressed: closed, reads <tspan font-weight="700" fill="#446ce3">FALSE</tspan></text>
  <text class="ncT" x="16" y="372">Pressed: open, reads <tspan font-weight="700" fill="#446ce3">TRUE</tspan></text>
</g>
<!-- (b) broken wire, static -->
<text x="16" y="392" font-size="12" font-weight="700" fill="#c62828">broken wire</text>
<g font-size="12" fill="#5c5c5c">
  <text x="184" y="410">ground</text>
</g>
<g stroke="#444444" stroke-width="1.6" fill="none">
  <line x1="16" y1="406" x2="56" y2="406"/>
  <line x1="80" y1="406" x2="84" y2="406"/>
  <line x1="136" y1="406" x2="170" y2="406"/>
  <path d="M170 406 V412 M161 412 H179 M164.5 416 H175.5 M168 420 H172"/>
</g>
<g stroke="#c62828" stroke-width="1.6" fill="none" stroke-linejoin="round">
  <path d="M56 406 H60 L63 401 L66 411"/>
  <path d="M71 401 L74 411 L77 406 H80"/>
</g>
<circle cx="86" cy="406" r="3" fill="#222222"/>
<circle cx="134" cy="406" r="3" fill="#222222"/>
<g stroke="#444444" stroke-linecap="round">
  <line x1="82" y1="410.5" x2="138" y2="410.5" stroke-width="3"/>
  <line x1="110" y1="410" x2="110" y2="389" stroke-width="1.6"/>
  <line x1="103" y1="389" x2="117" y2="389" stroke-width="2.6"/>
</g>
<g font-size="13" fill="#222222">
  <text x="16" y="436">Broken wire: reads <tspan font-weight="700" fill="#446ce3">TRUE</tspan>, as if pressed:</text>
  <text x="16" y="452" font-weight="700" fill="#1a7f37">the safe way to fail</text>
</g>

<line x1="262" y1="286" x2="262" y2="450" stroke="#d6d6d6" stroke-width="1"/>

<!-- ===== REV Magnetic Limit Switch ===== -->
<text x="272" y="296" font-size="13" font-weight="700" fill="#222222">REV Magnetic Limit Switch</text>
<text x="272" y="311" font-size="12" fill="#5c5c5c">Hall effect: it senses a magnet.</text>
<!-- trigger zone above the top of the sensor -->
<rect x="318" y="324" width="44" height="34" fill="#446ce3" fill-opacity="0.10"/>
<rect class="zoneOn" x="318" y="324" width="44" height="34" fill="#446ce3" fill-opacity="0.22"/>
<line x1="312" y1="324" x2="368" y2="324" stroke="#446ce3" stroke-width="1.2" stroke-dasharray="4 3"/>
<g stroke="#5c5c5c" stroke-width="1">
  <line x1="374" y1="324" x2="374" y2="358"/>
  <line x1="370" y1="324" x2="378" y2="324"/>
  <line x1="370" y1="358" x2="378" y2="358"/>
</g>
<g font-size="12" fill="#5c5c5c">
  <text x="382" y="338">about 0.4 in</text>
  <text x="382" y="353">(10 mm) from the top</text>
  <text x="382" y="384">Hall sensor</text>
</g>
<!-- sensor board -->
<rect x="325" y="358" width="30" height="34" rx="2" fill="#e3e8ef" stroke="#444444" stroke-width="1.4"/>
<rect x="334" y="360" width="12" height="7" fill="#222222"/>
<line x1="347" y1="365" x2="378" y2="380" stroke="#5c5c5c" stroke-width="1"/>
<g stroke="#5c5c5c" stroke-width="1.6">
  <line x1="333" y1="392" x2="333" y2="398"/>
  <line x1="340" y1="392" x2="340" y2="398"/>
  <line x1="347" y1="392" x2="347" y2="398"/>
</g>
<!-- magnet sliding over the top and back -->
<g class="mag">
  <rect x="270" y="331" width="22" height="18" fill="#ef9a9a" stroke="#444444" stroke-width="1.2"/>
  <rect x="292" y="331" width="22" height="18" fill="#b0b8c0" stroke="#444444" stroke-width="1.2"/>
  <g font-size="12" font-weight="700" fill="#222222" text-anchor="middle">
    <text x="281" y="344.5">N</text>
    <text x="303" y="344.5">S</text>
  </g>
</g>
<!-- readout -->
<g font-size="13" fill="#222222">
  <g class="magH">
    <text x="272" y="416">No magnet: output HIGH,</text>
    <text x="272" y="432">reads <tspan font-weight="700" fill="#446ce3">TRUE</tspan></text>
  </g>
  <g class="magL">
    <text x="272" y="416">Magnet near: output LOW</text>
    <text x="272" y="432">(active-low), reads <tspan font-weight="700" fill="#446ce3">FALSE</tspan></text>
  </g>
</g>
<text x="272" y="450" font-size="12" fill="#5c5c5c">Either pole (N or S) triggers it.</text>
</svg>
